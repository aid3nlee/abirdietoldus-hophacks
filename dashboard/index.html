  /* A whiteboard with a tree drawn on it. The surface is plain white and
     every mark is a pen laid on top of it: no cards, no shadows, no rounded
     corners. One accent (blue marker) and one warning (red marker). A board
     is white in any light, so there is no dark variant to switch to. */
  :root {
    color-scheme: light;
    --paper:    #ffffff;
    --paper-2:  #f4f5f7;
    --ink:      #1b1b1b;
    --ink-2:    #63676b;
    --rule:     #d6d8db;
    --hair:     #ebecee;
    --pen:      #1a56a8;
    --pen-soft: #e4ecf8;
    --red:      #c0392b;
    /* Blue marker wash, light -> dark. One hue, five steps: enough to rank a
       node by eye, few enough that adjacent steps never blur. */
    --w1: #dce5f1; --w2: #aac0dd; --w3: #6f92c1; --w4: #3f68a0; --w5: #1d4478;
    --panel-w: 400px;
    --x-ink: #0f1419; --x-dim: #536471; --x-line: #cfd9de; --x-blue: #1d9bf0;
    --type: "AuthenticFont", "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive;
    /* One hand writes the whole board; kept as a name so the diagram code that
       asks for it keeps reading clearly. */
    --hand: var(--type);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--type); font-size: 15px; line-height: 1.55;
    letter-spacing: .012em; -webkit-font-smoothing: antialiased;
  }
  /* The face carries letters, digits and the common marks but no slash, colon,
     em dash or middot; those fall through to the next hand in the stack rather
     than to a typewriter, so the mixing does not show. */
  svg text { font-family: var(--type); }
  h1, h2, h3 { margin: 0; font-weight: 700; text-wrap: balance; }
  p { margin: 0; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }
  .vh {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  .sheet {
    display: flex; flex-direction: column; height: 100%; min-height: 0;
    transition: margin-right .2s ease;
  }
  .sheet[data-panel="open"] { margin-right: var(--panel-w); }

  /* ---------- header ---------- */
  .head {
    display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap;
    padding: 9px 20px 8px; border-bottom: 2px solid var(--ink);
  }
  .head h1 { font-weight: 400; font-size: 25px; line-height: 1.1; letter-spacing: .01em; }
  .head .counts { color: var(--ink-2); font-size: 12.5px; margin-left: auto; }
  .head .counts b { color: var(--ink); font-weight: 700; }

  /* The index of lineages folds away so the board can have the whole sheet. */
  .fold {
    flex: none; align-self: center; width: 25px; height: 25px; padding: 0;
    display: grid; place-items: center; cursor: pointer;
    border: 1px solid var(--rule); background: none; color: var(--ink-2);
  }
  .fold:hover { color: var(--ink); border-color: var(--ink); }
  .fold svg { display: block; transition: transform .2s ease; }
  .sheet[data-rail="closed"] .fold svg { transform: scaleX(-1); }

  .cols { display: grid; grid-template-columns: auto minmax(0, 1fr); flex: 1; min-height: 0; }

  /* ---------- left column: the index of lineages ---------- */
  .rail {
    display: flex; flex-direction: column; min-height: 0; width: 290px;
    border-right: 1px solid var(--rule); overflow: hidden; transition: width .2s ease;
  }
  /* Fixed-width children so the list does not reflow while the rail folds. */
  .rail > * { min-width: 290px; }
  .sheet[data-rail="closed"] .rail { width: 0; border-right-width: 0; }
  .rail-top { padding: 12px 16px 10px; display: grid; gap: 8px; border-bottom: 1px solid var(--rule); }
  .rail input[type="search"] {
    width: 100%; padding: 5px 2px; border: 0; border-bottom: 1px solid var(--rule);
    background: none; color: var(--ink);
  }
  .rail input[type="search"]::placeholder { color: var(--ink-2); }
  .rail input[type="search"]:focus { border-bottom-color: var(--pen); outline: none; }
  .railrow { display: flex; align-items: baseline; gap: 8px; font-size: 12px; color: var(--ink-2); }
  .railrow select {
    flex: 1; padding: 3px 2px; border: 0; border-bottom: 1px solid var(--rule);
    background: none; color: var(--ink);
  }
  .chips { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 12px; }
  .chips button {
    padding: 1px 0; border: 0; background: none; cursor: pointer; color: var(--ink-2);
    border-bottom: 2px solid transparent;
  }
  .chips button:hover { color: var(--ink); }
  .chips button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--pen); }
  .chips button i { font-style: normal; color: var(--ink-2); font-size: 10px; }
  .chips button[disabled] { opacity: .45; cursor: default; }
  .chips button[disabled]:hover { color: inherit; }
  .aug { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); cursor: pointer; }
  .aug input { accent-color: var(--pen); margin: 0; }
  .count { padding: 6px 16px; font-size: 11.5px; color: var(--ink-2); border-bottom: 1px solid var(--hair); }
  .list { overflow-y: auto; flex: 1; min-height: 0; }
  .fam {
    display: grid; gap: 3px; width: 100%; text-align: left; cursor: pointer;
    padding: 9px 16px 9px 13px; background: none; border: 0;
    border-bottom: 1px solid var(--hair); border-left: 3px solid transparent;
  }
  .fam:hover { background: var(--paper-2); }
  .fam[aria-current="true"] { background: var(--paper-2); border-left-color: var(--pen); }
  .fam-txt {
    font-size: 11.5px; line-height: 1.4; color: var(--ink);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .fam-meta { font-size: 11px; color: var(--ink-2); }
  /* Behaviour badge. Colour separates the two accusatory classes from the
     merely descriptive ones, so the list reads at a glance. */
  .kind {
    display: inline-block; padding: 0 4px; margin-right: 5px; font-size: 10px;
    letter-spacing: .04em; text-transform: uppercase; border: 1px solid currentColor;
  }
  .kind.farm, .kind.evade { color: var(--red); }
  .kind.burst { color: var(--pen); }
  .kind.promo { color: var(--ink-2); }
  .kind.offlang { color: var(--ink-2); border-style: dashed; }
  .why { margin-top: 6px; font-size: 11.5px; color: var(--ink-2); }
  .why b { color: var(--ink); font-weight: 600; }
  .chips.kinds button[aria-pressed="true"] { border-bottom-color: var(--red); }

  /* ---------- right column: the sheet itself ---------- */
  .stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow-y: auto; }
  /* Everything a lineage renders goes inside this one div, so it -- not the
     stage -- is the column the board stretches inside. */
  #stage-body { display: flex; flex-direction: column; flex: 1 0 auto; min-height: 0; }
  #stage-body.loading { display: block; }
  .lin { padding: 8px 20px 7px; border-bottom: 1px solid var(--rule); }
  .lin .hdr { display: flex; align-items: baseline; gap: 4px 16px; flex-wrap: wrap; }
  .lin h2 { font-size: 14px; }
  .lin .hdr .figs { margin-top: 0; }
  .lin .root {
    margin-top: 4px; font-size: 12.5px; color: var(--ink-2); max-width: 96ch;
    border-left: 2px solid var(--rule); padding-left: 9px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .figs { margin-top: 8px; font-size: 12px; color: var(--ink-2); }
  .figs b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
  .warn {
    margin-top: 9px; max-width: 84ch; font-size: 11.5px; color: var(--ink-2);
    border-left: 2px solid var(--red); padding: 2px 0 2px 9px;
  }

  /* Controls are typed words, underlined in pen when they are the live one. */
  .bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 20px;
    padding: 8px 20px; border-bottom: 1px solid var(--rule); font-size: 12.5px;
  }
  .grp { display: flex; align-items: baseline; gap: 8px; }
  .grp > b { font-weight: 400; color: var(--ink-2); }
  .bar button {
    padding: 1px 0; border: 0; background: none; cursor: pointer;
    color: var(--ink-2); border-bottom: 2px solid transparent;
  }
  .bar button:hover { color: var(--ink); }
  .bar button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--pen); }
  .bar .act { color: var(--ink-2); border-bottom: 1px dotted var(--rule); }
  .bar .act:hover { color: var(--ink); border-bottom-color: var(--ink); }

<div class="sheet" id="sheet" data-rail="open">

        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span
        class="vh" id="foldtext">Hide the lineage list</span></button>

<script>
(function () {
  "use strict";

  var RAMP = ["--w1","--w2","--w3","--w4","--w5"];
  var TOPIC_LABEL = {
    politics:"Politics", conflict:"Conflict", migration:"Migration", identity:"Identity",
    health:"Health", crypto:"Crypto", fandom:"Fandom", sports:"Sport"
  };
  var NEWS = { politics:1, conflict:1, migration:1, identity:1, health:1 };

  // Behaviour classes. Topic says what a lineage argues; this says how it
  // travelled, which is the axis that actually separates a propaganda
  // campaign from a concert promotion. Wording matters here: only "farm"
  // is a confident accusation, "burst" is a shortlist, and "promo" is a
  // description of a disclosed marketing pattern rather than a charge.
  var KIND_LABEL = {
    farm:"engagement farming", evade:"filter evasion", promo:"promo template",
    burst:"synchronised burst", organic:"no structural flag"
  };
  var KIND_SHORT = {
    farm:"farm", evade:"evasion", promo:"promo", burst:"burst", organic:""
  };
  var KIND_NOTE = {
    farm:"The payload is an instruction \u2014 follow, retweet, enter. Inauthentic " +
         "engagement, and openly so.",
    evade:"Words carrying cross-script lookalike characters, so the text reads " +
          "normally to a person and misses a keyword filter.",
    promo:"A conserved hashtag block with variable free text: scheduled marketing " +
          "and fan-campaign material. Coordinated by construction, but disclosed " +
          "and commercial \u2014 not covert.",
    burst:"Near-identical wordings from several different upstream accounts inside " +
          "a few hours. This is a shortlist to review, not a verdict: a newsroom " +
          "racing a scoop has the same shape as a press campaign.",
    organic:"No structural evidence of farming, evasion, templating or synchronised " +
            "release. Absence of evidence only."
  };

  var META = null, FAMS = [], BUCKETS = {}, CORPUS_T0 = 0;
  var state = { q:"", sort:"notable", topic:"all", kind:"all", win:"all", famId:null, fam:null, nodes:null,
                topo:null, colorBy:"drift", xMode:"tree", cut:Infinity, sel:0, playing:false,
                tableOpen:false };
  // auto = the view is still the fitted default, so a resize or a relayout may
  // refit it; any manual pan or zoom clears the flag and the view is left alone.
  var view = { k:1, tx:0, ty:0, auto:true };
  var layout = null;
  var MIN_TREE_H = 340;

  var $ = function (s) { return document.querySelector(s); };
  var fmt = function (n) { return n.toLocaleString("en-US"); };
  var css = function (v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); };

  // The tree gets every pixel the sheet is not already using. Subtracting the
  // board's siblings rather than reading the board itself keeps this stable:
  // the answer does not depend on the height we are about to set from it.
  function maxTreeH() {
    var st = $(".stage"), dr = $(".draw");
    if (!st || !dr) return 620;
    var others = dr.parentNode.scrollHeight - dr.clientHeight;
    return Math.max(MIN_TREE_H, st.clientHeight - others - 10);
  }

  // Twitter stores tweet text with &, < and > already escaped, so a band
  // called &TEAM arrives as "&amp;TEAM". Undo that before escaping it again
  // for this page, or the card shows markup where the tweet showed a word.
  // &amp; goes last: doing it first would turn "&amp;lt;" into a real "<".
  function detwit(s) {
    return String(s)
      .replace(/&lt;/g, "<").replace(/&gt;/g, ">")
      .replace(/&quot;/g, '"').replace(/&#0*39;/g, "'").replace(/&apos;/g, "'")
      .replace(/&nbsp;/g, "\u00a0").replace(/&amp;/g, "&");
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  // A, B, ... Z, AA, AB -- spreadsheet-style, so a tree of any size gets short
  // labels that stay readable inside a node.
  function letter(k) {
    var out = "";
    for (k += 1; k > 0; k = Math.floor((k - 1) / 26)) {
      out = String.fromCharCode(65 + (k - 1) % 26) + out;
    }
    return out;
  }

  // A label set inside a filled mark takes white or ink by the fill's own
  // luminance, so it clears contrast at either end of the ramp and in both
  // themes -- the ramp inverts in dark mode, so a fixed choice would fail.
  function inkOn(hex) {
    var h = String(hex).replace("#", "");
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    if (h.length < 6) return css("--ink");
    var lin = function (c) {
      c = parseInt(c, 16) / 255;
      return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    };
    var lum = 0.2126 * lin(h.slice(0, 2)) + 0.7152 * lin(h.slice(2, 4)) + 0.0722 * lin(h.slice(4, 6));
    return lum > 0.19 ? "#1c1c1a" : "#ffffff";
  }

  // Parent/child structure and the node letters are properties of the lineage,
  // not of any one layout, so they are computed once per family and shared by
  // the diagram, the inspector and the table.
  function topology(nodes) {
    var kids = nodes.map(function () { return []; });
    var root = 0;
    nodes.forEach(function (nd, i) {
      if (nd.p === null || nd.p === undefined) root = i; else kids[nd.p].push(i);
    });
    kids.forEach(function (ks) {
      ks.sort(function (a, b) { return nodes[a].t0 - nodes[b].t0 || nodes[b].n - nodes[a].n; });
    });
    var label = new Array(nodes.length), order = [root];
    for (var i = 0; i < order.length; i++) {
      label[order[i]] = letter(i);
      kids[order[i]].forEach(function (k) { order.push(k); });
    }
    return { kids: kids, root: root, label: label, order: order };
  }

  // Hours are stored relative to the first tweet in the corpus so every family
  // shares one clock; this turns one back into a readable date.
  function hourLabel(h) {
    var d = new Date(CORPUS_T0 + h * 3600e3);
    return d.toLocaleString("en-US", { month:"short", day:"numeric", hour:"numeric", timeZone:"UTC" }) + " UTC";
  }
  function dayLabel(h) {
    var d = new Date(CORPUS_T0 + h * 3600e3);
    return d.toLocaleString("en-US", { month:"short", day:"numeric", timeZone:"UTC" });
  }

  function notability(f) {
    return f.depth * Math.log10(Math.max(10, f.emis)) * (1 + f.drift);
  }

  // Name the behaviour class and show the numbers that produced it, so the
  // call can be checked rather than taken. Nothing here is a verdict the
  // reader has to accept: the evidence is the point.
  function kindLine(f) {
    var bits = [];
    if (f.kind !== "organic") {
      bits.push("<b>" + KIND_LABEL[f.kind] + "</b> \u2014 " + esc(KIND_NOTE[f.kind]));
      if (f.why && f.why.length) bits.push("Evidence: " + f.why.map(esc).join("; ") + ".");
    } else {
      bits.push("<b>No structural flag.</b> " + esc(KIND_NOTE.organic));
    }
    if (f.offlang) {
      bits.push("Twitter tagged this lineage English and " +
                Math.round(f.nonlatin * 100) + "% of its text is not. " +
                "Tokenisation keeps only Latin characters, so this tree was built from " +
                "its hashtags rather than from a reworded sentence.");
    }
    return '<p class="why">' + bits.join(" ") + "</p>";
  }

  /* ---------------- family list ---------------- */

  function filtered() {
    var q = state.q.toLowerCase().trim();
    var out = FAMS.filter(function (f) {
      if (state.win !== "all" && f.win !== state.win) return false;
      if (state.topic === "news") { if (!f.topics.some(function (t) { return NEWS[t]; })) return false; }
      else if (state.topic !== "all") { if (f.topics.indexOf(state.topic) < 0) return false; }
      if (state.kind === "flagged") { if (f.kind === "organic") return false; }
      else if (state.kind === "offlang") { if (!f.offlang) return false; }
      else if (state.kind !== "all") { if (f.kind !== state.kind) return false; }
      if (!q) return true;
      return f.q.indexOf(q) >= 0 || f.top.toLowerCase().indexOf(q) >= 0 || f.root.toLowerCase().indexOf(q) >= 0;
    });
    var key = {
      notable: notability, emis: function (f) { return f.emis; }, nv: function (f) { return f.nv; },
      depth: function (f) { return f.depth * 1000 + Math.log10(f.emis); },
      drift: function (f) { return f.drift; }, coord: function (f) { return f.coord_share; },
      peak6: function (f) { return f.peak6; }
    }[state.sort];
    return out.sort(function (a, b) { return key(b) - key(a); });
  }

  function renderList() {
    var rows = filtered();
    $("#count").textContent = fmt(rows.length) + " lineages" + (state.q ? ' matching "' + state.q + '"' : "");
    var shown = rows.slice(0, 400);
    if (state.famId !== null && !shown.some(function (f) { return f.id === state.famId; })) {
      var cur = FAMS.find(function (f) { return f.id === state.famId; });
      if (cur) shown.unshift(cur);
    }
    var html = shown.map(function (f) {
      var tags = f.topics.map(function (t) { return TOPIC_LABEL[t].toLowerCase(); }).join(", ");
      var badge = KIND_SHORT[f.kind]
        ? '<span class="kind ' + f.kind + '">' + KIND_SHORT[f.kind] + "</span>" : "";
      if (f.offlang) badge += '<span class="kind offlang">non-English</span>';
      return '<button class="fam" data-id="' + f.id + '" aria-current="' + (f.id === state.famId) + '">' +
        '<span class="fam-txt">' + esc(detwit(f.top)) + "</span>" +
        '<span class="fam-meta">' + badge + f.nv + " wordings &middot; " + fmt(f.emis) + " retweets" +
        (tags ? " &middot; " + tags : "") + "</span></button>";
    }).join("");
    $("#list").innerHTML = html || '<p class="loading">Nothing matches that phrase.</p>';
    var cur = $('.fam[aria-current="true"]');
    if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "nearest" });
    if (rows.length > 400) {
      $("#list").insertAdjacentHTML("beforeend",
        '<p class="loading">Top 400 of ' + fmt(rows.length) + " \u2014 narrow it with the search or a topic.</p>");
    }
  }

  /* ---------------- tree layout ---------------- */

  // Two ways to place the same lineage, and they answer different questions.
  //
  //   tree  -- the classic rooted tree. One row per generation, a child sits
  //            directly below the wording it was derived from, parents centred
  //            over their children. Structure is the subject: you can see the
  //            branching factor, which wordings are siblings, and how deep the
  //            lineage runs. Horizontal position carries no measure.
  //   time  -- a variant sits at the hour it was first observed, so the gap
  //            along an edge is the real waiting time before the rewording
  //            appeared. Structure is harder to read; timing is exact.
  function buildLayout(nodes, mode, width) {
    if (mode === "tree") return buildTreeLayout(nodes);

    var t = state.topo, kids = t.kids, root = t.root;

    var slot = 0, y = new Array(nodes.length).fill(0);
    (function walk(i) {
      if (!kids[i].length) { y[i] = slot++; return; }
      kids[i].forEach(walk);
      y[i] = (y[kids[i][0]] + y[kids[i][kids[i].length - 1]]) / 2;
    })(root);

    var t0 = Math.min.apply(null, nodes.map(function (n) { return n.t0; }));
    var t1 = Math.max.apply(null, nodes.map(function (n) { return n.t0; }));
    var maxD = Math.max.apply(null, nodes.map(function (n) { return n.d; }));
    var padL = 26, padR = 118;
    var inner = Math.max(120, width - padL - padR);
    var span = Math.max(1, t1 - t0), lspan = Math.log1p(span);
    var frac = mode === "log"
      ? function (h) { return Math.log1p(Math.max(0, h - t0)) / lspan; }
      : function (h) { return (h - t0) / span; };
    var xOf = function (n) { return padL + frac(n.t0) * inner; };

    var rowH = nodes.length > 90 ? 12 : nodes.length > 40 ? 16 : 21;
    return {
      root: root, kids: kids, t0: t0, t1: t1, maxD: maxD, padL: padL, inner: inner, rowH: rowH,
      x: nodes.map(xOf), y: y.map(function (v) { return 16 + v * rowH; }), frac: frac,
      height: 16 + slot * rowH + 18, mode: mode
    };
  }

  // Classic layout. Leaves take consecutive columns in sibling order and every
  // parent is centred over its children, which is the textbook tidy tree and,
  // because sibling subtrees occupy disjoint column ranges, cannot collide.
  // Node area still carries spread, so the range of radii is kept narrow --
  // enough to rank two nodes by eye, not so much that the rows lose their grid.
  function buildTreeLayout(nodes) {
    var t = state.topo, kids = t.kids, root = t.root;
    var maxN = Math.max.apply(null, nodes.map(function (n) { return n.n; }));
    var r = nodes.map(function (n) { return 12.5 + 8 * Math.sqrt(n.n / maxN); });
    var maxR = Math.max.apply(null, r);
    var slotW = 2 * maxR + 14;

    var slot = 0, col = new Array(nodes.length).fill(0);
    (function walk(i) {
      if (!kids[i].length) { col[i] = slot++; return; }
      kids[i].forEach(walk);
      col[i] = (col[kids[i][0]] + col[kids[i][kids[i].length - 1]]) / 2;
    })(root);

    var maxD = Math.max.apply(null, nodes.map(function (n) { return n.d; }));
    // The deepest lineage in the corpus runs 15 generations; tighten the rows
    // past nine so it still fits the frame without being scaled into mush.
    var TOP = 46, LEVEL = maxD > 9 ? 66 : 80;
    var x = col.map(function (c) { return maxR + 3 + c * slotW; });
    var levelY = [];
    for (var d = 0; d <= maxD; d++) levelY.push(TOP + d * LEVEL);

    return {
      mode: "tree", root: root, kids: kids, label: t.label, r: r, x: x, maxD: maxD,
      y: nodes.map(function (n) { return levelY[n.d]; }), levelY: levelY,
      natW: Math.max.apply(null, x) + maxR + 4,
      natH: TOP + maxD * LEVEL + 48
    };
  }

  function metricOf(n) {
    if (state.colorBy === "drift") return n.drift;
    if (state.colorBy === "coord") return n.acc ? n.co / n.acc : 0;
    return Math.log10(Math.max(1, n.n)) / 4.6;     // spread, log-scaled to ~40k
  }
  function rampColor(v) {
    var i = Math.max(0, Math.min(RAMP.length - 1, Math.round(v * (RAMP.length - 1))));
    return css(RAMP[i]);
  }
  var METRIC_LABEL = {
    drift: ["drift from the root", "identical", "fully reworded"],
    coord: ["coordinated share", "none", "all accounts"],
    spread: ["spread, log scale", "1", "40k+"]
  };

  /* ---------------- drawing ---------------- */

  function drawTree() {
    if (state.xMode === "tree") return drawClassicTree();
    var svg = $("#tree"); if (!svg || !layout) return;
    var nodes = state.nodes, L = layout;
    var W = svg.clientWidth || 800;
    var parts = [];

    // Ticks measure elapsed time since the root phrasing, which is the quantity
    // the axis actually encodes -- calendar dates would imply a linear scale.
    var elapsed = L.t1 - L.t0, ticks = [];
    if (L.mode === "log") {
      [0, 1, 2, 4, 8, 16, 32, 64, 128, 256, 512].forEach(function (o) {
        if (o <= elapsed) ticks.push(o);
      });
    } else {
      var stepH = elapsed > 240 ? 48 : elapsed > 96 ? 24 : elapsed > 24 ? 12 : 6;
      for (var o = 0; o <= elapsed; o += stepH) ticks.push(o);
    }
    ticks.forEach(function (o) {
      var gx = L.padL + L.frac(L.t0 + o) * L.inner;
      parts.push('<line x1="' + gx + '" y1="4" x2="' + gx + '" y2="' + (L.height - 16) +
        '" stroke="' + css("--hair") + '" stroke-width="1"/>');
      var lbl = o === 0 ? "root" : o < 24 ? "+" + o + "h" : "+" + Math.round(o / 24) + "d";
      parts.push('<text x="' + gx + '" y="' + (L.height - 4) + '" font-size="9.5" fill="' + css("--ink-2") +
        '" text-anchor="middle">' + lbl + "</text>");
    });

    // The crawl thins 15x on 1 September, so a lineage that appears to stop
    // there may only have gone unobserved. Draw the seam rather than hide it.
    if (META.cliff_h > L.t0 && META.cliff_h < L.t1) {
      var cx0 = L.padL + L.frac(META.cliff_h) * L.inner;
      parts.push('<line x1="' + cx0 + '" y1="4" x2="' + cx0 + '" y2="' + (L.height - 16) +
        '" stroke="' + css("--red") + '" stroke-width="1.5" stroke-dasharray="4 3"/>');
      parts.push('<text x="' + (cx0 + 4) + '" y="13" font-size="9.5" fill="' + css("--red") +
        '">Sep 1 \u2014 crawl thins 15\u00d7</text>');
    }

    // lifespan bars: how long the variant kept being posted after it appeared
    nodes.forEach(function (n, i) {
      if (n.t0 > state.cut || n.t1 <= n.t0) return;
      var x0 = L.x[i];
      var x1 = L.padL + L.frac(Math.min(n.t1, L.t1)) * L.inner;
      if (x1 - x0 < 3) return;
      parts.push('<line x1="' + x0 + '" y1="' + L.y[i] + '" x2="' + x1 + '" y2="' + L.y[i] +
        '" stroke="' + css("--rule") + '" stroke-width="1.5" stroke-linecap="round" opacity=".33"/>');
    });

    // edges: drop down from the parent, then run forward in time to the child
    nodes.forEach(function (n, i) {
      if (n.p === null || n.p === undefined) return;
      if (n.t0 > state.cut || nodes[n.p].t0 > state.cut) return;
      var px = L.x[n.p], py = L.y[n.p], cx = L.x[i], cy = L.y[i];
      parts.push('<path d="M' + px + "," + py + "V" + cy + "H" + cx +
        '" fill="none" stroke="' + css("--rule") + '" stroke-width="1.4" stroke-linecap="round"/>');
    });

    // nodes: area is spread, fill is the selected metric, ring flags coordination
    var maxN = Math.max.apply(null, nodes.map(function (n) { return n.n; }));
    nodes.forEach(function (n, i) {
      var faded = n.t0 > state.cut;
      var r = 2.6 + 7.4 * Math.sqrt(n.n / maxN);
      var coord = n.acc ? n.co / n.acc : 0;
      parts.push('<circle class="nd" data-i="' + i + '" cx="' + L.x[i] + '" cy="' + L.y[i] + '" r="' + r.toFixed(2) +
        '" fill="' + rampColor(metricOf(n)) + '" stroke="' + (coord > 0.15 ? css("--red") : css("--paper")) +
        '" stroke-width="' + (coord > 0.15 ? 2 : 1.5) + '" opacity="' + (faded ? 0.1 : 1) +
        '" style="cursor:pointer"/>');
      if (i === state.sel && !faded) {
        parts.push('<circle cx="' + L.x[i] + '" cy="' + L.y[i] + '" r="' + (r + 4.5).toFixed(2) +
          '" fill="none" stroke="' + css("--pen") + '" stroke-width="1.6"/>');
      }
    });

    // direct labels on the few heaviest variants only
    var top = nodes.map(function (n, i) { return [n.n, i]; })
      .sort(function (a, b) { return b[0] - a[0]; }).slice(0, 4);
    top.forEach(function (p) {
      var i = p[1]; if (nodes[i].t0 > state.cut) return;
      parts.push('<text x="' + (L.x[i] + 11) + '" y="' + (L.y[i] + 3.4) + '" font-size="10" fill="' + css("--ink-2") +
        '">' + fmt(nodes[i].n) + "</text>");
    });

    svg.setAttribute("height", L.height);
    svg.setAttribute("viewBox", "0 0 " + W + " " + L.height);
    svg.innerHTML = '<g transform="translate(' + view.tx + "," + view.ty + ") scale(" + view.k + ')">' +
      parts.join("") + "</g>";
  }

  // No line drawn by hand lands perfectly straight. The deviation is seeded
  // from the node index, so it is identical on every redraw and the tree does
  // not shimmer while the time scrub runs.
  function bow(x1, y1, x2, y2, seed) {
    var dx = x2 - x1, dy = y2 - y1, len = Math.sqrt(dx * dx + dy * dy) || 1;
    var h = Math.sin(seed * 12.9898) * 43758.5453;
    var off = ((h - Math.floor(h)) - 0.5) * Math.min(6, len * 0.08);
    return "M" + x1.toFixed(1) + "," + y1.toFixed(1) +
      "Q" + ((x1 + x2) / 2 - dy / len * off).toFixed(1) + "," + ((y1 + y2) / 2 + dx / len * off).toFixed(1) +
      " " + x2.toFixed(1) + "," + y2.toFixed(1);
  }

  // The classic view. One row per generation, ruled and numbered in the right
  // gutter, with the height of the tree bracketed on the left -- the two things
  // a rooted tree is normally read for. Selecting a node shades its subtree and
  // rings its parent, so the family relations the diagram encodes are visible
  // rather than inferred.
  function drawClassicTree() {
    var svg = $("#tree"); if (!svg || !layout) return;
    var nodes = state.nodes, L = layout, sel = state.sel;
    var W = svg.clientWidth || 800;
    var GL = 56, GR = 76;                       // gutters: height bracket, level numbers
    var avail = Math.max(160, W - GL - GR);

    // The default view fits the whole tree; a pan or a zoom takes over from it.
    // The floor keeps a 200-variant lineage from fitting itself into
    // illegibility -- past that point it is pannable instead of shrunk.
    var MT = maxTreeH();
    if (view.auto) {
      view.k = Math.max(0.5, Math.min(1, avail / L.natW, MT / L.natH));
      view.tx = GL + Math.max(0, (avail - L.natW * view.k) / 2);
      view.ty = 0;
    }
    var H = Math.min(MT, L.natH * view.k) + 6;
    var sy = function (cy) { return cy * view.k + view.ty; };
    var body = [], gutter = [];

    // The widest lineage here is 188 variants across one row -- far past what
    // fits on a screen at a readable size. Say so instead of quietly showing a
    // slice of it.
    var shown = Math.min(1, avail / (L.natW * view.k));
    if (shown < 0.995) {
      gutter.push('<text x="' + GL + '" y="' + (H - 5) + '" font-size="11.5" fill="' + css("--ink-2") +
        '">showing ' + Math.round(shown * 100) +
        "% of a wide tree, drag to pan and scroll to zoom</text>");
    }

    // Level rules are solid hairlines: a dashed rule reads as a threshold, and
    // the only threshold on this page is the 1 September collection cliff.
    L.levelY.forEach(function (cy, d) {
      var yy = sy(cy);
      if (yy < 10 || yy > H - 6) return;
      gutter.push('<line x1="' + GL + '" y1="' + yy.toFixed(1) + '" x2="' + (W - GR + 10) +
        '" y2="' + yy.toFixed(1) + '" stroke="' + css("--hair") + '" stroke-width="1"/>');
      gutter.push('<text x="' + (W - GR + 16) + '" y="' + (yy + 4).toFixed(1) + '" font-size="11.5" fill="' +
        css("--ink-2") + '">level ' + d + "</text>");
    });

    var yTop = sy(L.levelY[0]), yBot = sy(L.levelY[L.maxD]);
    if (L.maxD > 0 && yTop > 10 && yBot < H - 6) {
      var bx = 24, mid = (yTop + yBot) / 2;
      gutter.push('<line x1="' + bx + '" y1="' + yTop.toFixed(1) + '" x2="' + bx + '" y2="' + yBot.toFixed(1) +
        '" stroke="' + css("--rule") + '" stroke-width="1"/>');
      [yTop, yBot].forEach(function (yy) {
        gutter.push('<line x1="' + (bx - 4) + '" y1="' + yy.toFixed(1) + '" x2="' + (bx + 4) + '" y2="' + yy.toFixed(1) +
          '" stroke="' + css("--rule") + '" stroke-width="1"/>');
      });
      gutter.push('<text transform="rotate(-90 ' + (bx - 6) + " " + mid.toFixed(1) + ')" x="' + (bx - 6) +
        '" y="' + mid.toFixed(1) + '" text-anchor="middle" font-size="11.5" fill="' + css("--ink-2") +
        '">height ' + L.maxD + "</text>");
    }

    // The subtree of the selected wording: everything descended from it. This
    // is the population the lineage-total figure in the inspector counts.
    // (Skipped for the root: "the subtree of the root" is the whole tree.)
    if (sel !== L.root && L.kids[sel] && L.kids[sel].length) {
      var members = [], stack = [sel], byD = {};
      while (stack.length) {
        var cur = stack.pop();
        members.push(cur);
        L.kids[cur].forEach(function (k) { stack.push(k); });
      }
      members.forEach(function (i) {
        var d = nodes[i].d, e = byD[d] || (byD[d] = [Infinity, -Infinity]);
        e[0] = Math.min(e[0], L.x[i] - L.r[i]);
        e[1] = Math.max(e[1], L.x[i] + L.r[i]);
      });
      var ds = Object.keys(byD).map(Number).sort(function (a, b) { return a - b; });
      var pad = 13, left = [], right = [];
      ds.forEach(function (d, i) {
        var yy = L.levelY[d] + (i === 0 ? -pad : i === ds.length - 1 ? pad : 0);
        left.push((byD[d][0] - pad).toFixed(1) + "," + yy.toFixed(1));
        right.push((byD[d][1] + pad).toFixed(1) + "," + yy.toFixed(1));
      });
      body.push('<polygon points="' + left.concat(right.reverse()).join(" ") + '" fill="' + css("--ink") +
        '" fill-opacity=".05" stroke="' + css("--ink-2") + '" stroke-opacity=".7" stroke-width="1.1" ' +
        'stroke-dasharray="1 4" stroke-linecap="round" stroke-linejoin="round"/>');
    }

    // Edges run rim to rim rather than centre to centre, so a node never has a
    // line crossing its own label.
    nodes.forEach(function (n, i) {
      if (n.p === null || n.p === undefined) return;
      var faded = n.t0 > state.cut || nodes[n.p].t0 > state.cut;
      var dx = L.x[i] - L.x[n.p], dy = L.y[i] - L.y[n.p];
      var len = Math.sqrt(dx * dx + dy * dy) || 1;
      body.push('<path d="' + bow(L.x[n.p] + dx / len * L.r[n.p], L.y[n.p] + dy / len * L.r[n.p],
        L.x[i] - dx / len * L.r[i], L.y[i] - dy / len * L.r[i], i + 1) +
        '" fill="none" stroke="' + css("--ink-2") + '" stroke-width="1.3" stroke-linecap="round" opacity="' +
        (faded ? 0.12 : 1) + '"/>');
    });

    var pi = nodes[sel] ? nodes[sel].p : null;
    if (pi !== null && pi !== undefined) {
      body.push('<circle cx="' + L.x[pi].toFixed(1) + '" cy="' + L.y[pi].toFixed(1) + '" r="' + (L.r[pi] + 4.5).toFixed(1) +
        '" fill="none" stroke="' + css("--pen") + '" stroke-width="1.3" stroke-dasharray="3 3" opacity=".85"/>');
    }

    // Only mark the cliff per node where the distinction bites: inside a
    // lineage that straddles it. A wholly post-September family is flagged once
    // at the top instead of on every circle.
    var markCliff = state.fam.win === "span";
    nodes.forEach(function (n, i) {
      var faded = n.t0 > state.cut;
      var fill = rampColor(metricOf(n));
      var coord = n.acc ? n.co / n.acc : 0;
      var op = faded ? 0.12 : 1;
      body.push('<circle class="nd" data-i="' + i + '" cx="' + L.x[i].toFixed(1) + '" cy="' + L.y[i].toFixed(1) +
        '" r="' + L.r[i].toFixed(1) + '" fill="' + fill + '" stroke="' +
        (coord > 0.15 ? css("--red") : css("--paper")) + '" stroke-width="' + (coord > 0.15 ? 2.4 : 2) +
        '" opacity="' + op + '" style="cursor:pointer"/>');
      if (i === sel) {
        body.push('<circle cx="' + L.x[i].toFixed(1) + '" cy="' + L.y[i].toFixed(1) + '" r="' + (L.r[i] + 5).toFixed(1) +
          '" fill="none" stroke="' + css("--pen") + '" stroke-width="1.8" opacity="' + op + '"/>');
      }
      body.push('<text x="' + L.x[i].toFixed(1) + '" y="' + (L.y[i] + 3.9).toFixed(1) +
        '" text-anchor="middle" font-size="11" font-weight="600" fill="' + inkOn(fill) +
        '" opacity="' + op + '" pointer-events="none">' +
        L.label[i] + (markCliff && n.t0 >= META.cliff_h ? "*" : "") + "</text>");
    });

    body.push('<text x="' + L.x[L.root].toFixed(1) + '" y="' + (L.y[L.root] - L.r[L.root] - 9).toFixed(1) +
      '" text-anchor="middle" font-size="12" fill="' + css("--ink-2") + '">root</text>');

    // Direct-label the few heaviest wordings only; the rest are in the tooltip
    // and in the table below.
    nodes.map(function (n, i) { return [n.n, i]; })
      .sort(function (a, b) { return b[0] - a[0]; }).slice(0, 4)
      .forEach(function (pair) {
        var i = pair[1];
        if (nodes[i].t0 > state.cut) return;
        body.push('<text x="' + L.x[i].toFixed(1) + '" y="' + (L.y[i] + L.r[i] + 12).toFixed(1) +
          '" text-anchor="middle" font-size="9.5" fill="' + css("--ink-2") + '">' + fmt(nodes[i].n) + "</text>");
      });

    svg.setAttribute("height", H);
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.innerHTML = gutter.join("") +
      '<g transform="translate(' + view.tx + "," + view.ty + ") scale(" + view.k + ')">' +
      body.join("") + "</g>";
  }

  // Family emission curve: one series, so no legend -- the heading names it.
  function drawPulse() {
    var svg = $("#pulse"); if (!svg) return;
    var byHour = {};
    state.nodes.forEach(function (n) {
      (n.spark || []).forEach(function (p) { byHour[p[0]] = (byHour[p[0]] || 0) + p[1]; });
    });
    var hs = Object.keys(byHour).map(Number).sort(function (a, b) { return a - b; });
    if (!hs.length) { svg.innerHTML = ""; return; }
    var W = svg.clientWidth || 800, H = 56, pad = 26;
    var h0 = hs[0], h1 = hs[hs.length - 1], mx = Math.max.apply(null, hs.map(function (h) { return byHour[h]; }));
    var X = function (h) { return pad + (h1 > h0 ? (h - h0) / (h1 - h0) : 0) * (W - pad - 118); };
    var Y = function (v) { return H - 14 - (v / mx) * (H - 22); };
    var pts = [], area = ["M" + X(h0) + "," + (H - 14)];
    for (var h = h0; h <= h1; h++) {
      var v = byHour[h] || 0;
      pts.push(X(h) + "," + Y(v)); area.push("L" + X(h) + "," + Y(v));
    }
    area.push("L" + X(h1) + "," + (H - 14) + "Z");
    var cutX = state.cut === Infinity ? null : X(Math.min(state.cut, h1));
    var cliffX = (META.cliff_h > h0 && META.cliff_h < h1) ? X(META.cliff_h) : null;
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.innerHTML =
      '<path d="' + area.join("") + '" fill="' + css("--pen") + '" opacity=".16"/>' +
      '<polyline points="' + pts.join(" ") + '" fill="none" stroke="' + css("--pen") + '" stroke-width="2" stroke-linejoin="round"/>' +
      '<line x1="' + pad + '" y1="' + (H - 14) + '" x2="' + (W - 118) + '" y2="' + (H - 14) + '" stroke="' + css("--rule") + '" stroke-width="1"/>' +
      (cliffX !== null ? '<line x1="' + cliffX + '" y1="4" x2="' + cliffX + '" y2="' + (H - 14) + '" stroke="' + css("--red") + '" stroke-width="1.5" stroke-dasharray="4 3"/>' : "") +
      (cutX !== null ? '<line x1="' + cutX + '" y1="4" x2="' + cutX + '" y2="' + (H - 14) + '" stroke="' + css("--pen") + '" stroke-width="1.5"/>' : "") +
      '<text x="' + pad + '" y="' + (H - 3) + '" font-size="9.5" fill="' + css("--ink-2") + '">' + esc(dayLabel(h0)) + "</text>" +
      '<text x="' + (W - 118) + '" y="' + (H - 3) + '" font-size="9.5" fill="' + css("--ink-2") + '" text-anchor="end">' + esc(dayLabel(h1)) + "</text>" +
      '<text x="' + (W - 112) + '" y="14" font-size="10" fill="' + css("--ink-2") + '">peak ' + fmt(mx) + "/h</text>";
  }

  /* ---------------- the post, as X would draw it ----------------

     Generic equivalents of X's action icons, not their artwork: same
     vocabulary at the same weight, drawn here. */
  var XI = {
    reply: "M4.3 5.9A2.6 2.6 0 0 1 6.9 3.3h10.2a2.6 2.6 0 0 1 2.6 2.6v7.5a2.6 2.6 0 0 1-2.6 2.6h-4.6l-4.8 3.7v-3.7H6.9a2.6 2.6 0 0 1-2.6-2.6z",
    rt:    "M4.8 9.3V7.6a2.4 2.4 0 0 1 2.4-2.4h8.3M13.3 2.6 16.1 5.2l-2.8 2.6M19.2 14.7v1.7a2.4 2.4 0 0 1-2.4 2.4H8.5M10.7 21.4 7.9 18.8l2.8-2.6",
    like:  "M12 20.3S4.6 15.7 4.6 10.9A4.1 4.1 0 0 1 12 8.4a4.1 4.1 0 0 1 7.4 2.5c0 4.8-7.4 9.4-7.4 9.4z",
    views: "M4.4 20.2v-8.8M9.5 20.2V4.6M14.5 20.2v-6.1M19.6 20.2V8.2",
    save:  "M6.2 3.6h11.6v17.1L12 16.3l-5.8 4.4z",
    share: "M12 15.4V3.4M8.4 7 12 3.4 15.6 7M5 12.6v6.1a1.6 1.6 0 0 0 1.6 1.6h10.8a1.6 1.6 0 0 0 1.6-1.6v-6.1"
  };
  function xicon(k) {
    return '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" ' +
      'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="' + XI[k] + '"/></svg>';
  }

  // X's own compact counter: 942, 2.3K, 230K, 1.4M.
  function compact(v) {
    if (v < 1000) return String(v);
    var u = v < 1e6 ? [v / 1e3, "K"] : [v / 1e6, "M"];
    return (u[0] < 100 ? u[0].toFixed(1).replace(/\.0$/, "") : String(Math.round(u[0]))) + u[1];
  }

  // No avatars were collected, so the circle is a deterministic monogram
  // rather than a stand-in photograph of somebody.
  function avatar(handle) {
    var h = 0;
    for (var i = 0; i < handle.length; i++) h = (h * 31 + handle.charCodeAt(i)) >>> 0;
    return { bg: "hsl(" + (h % 360) + " 48% 44%)", ch: (handle[0] || "?").toUpperCase() };
  }

  // `mini` is the hover card: the whole text, no clamp, nothing to press.
  function xpost(nd, mini) {
    var who = String(nd.src || "").replace(/^@/, "");
    var av = avatar(who || "?");
    var acts =
      '<div class="xacts">' +
        '<span class="xact" title="Replies were not collected">' + xicon("reply") + "</span>" +
        '<span class="xact" title="' + fmt(nd.n) + ' retweets of this wording">' +
          xicon("rt") + "<span>" + compact(nd.n) + "</span></span>" +
        '<span class="xact" title="Likes were not collected">' + xicon("like") + "</span>" +
        '<span class="xact" title="Views were not collected">' + xicon("views") + "</span>" +
        '<span class="xact">' + xicon("save") + "</span>" +
        '<span class="xact">' + xicon("share") + "</span>" +
      "</div>";
    return '<article class="xpost" data-expanded="' + (mini ? "true" : "false") + '">' +
      '<span class="av" style="background:' + av.bg + '" aria-hidden="true">' + esc(av.ch) + "</span>" +
      '<div class="xcol">' +
        '<p class="xhead"><span class="xname">' +
          (who ? "@" + esc(who) : "account not recorded") + "</span>" +
          '<span class="xdate">&middot; ' + esc(dayLabel(nd.t0)) + "</span></p>" +
        '<p class="xtext">' + esc(detwit(nd.txt)) + "</p>" +
        (mini ? "" : '<button type="button" class="xmore" hidden>Show more</button>') +
        acts +
      "</div></article>";
  }

  // Whether the clamp actually bit can only be known once it is laid out, and
  // an offer to expand something already whole is worse than no offer.
  function initPost(root) {
    var post = root.querySelector(".xpost"), txt = root.querySelector(".xtext"),
        more = root.querySelector(".xmore");
    if (!post || !txt || !more) return;
    more.hidden = txt.scrollHeight - txt.clientHeight < 2;
  }
  function togglePost(post) {
    var open = post.dataset.expanded === "true";
    post.dataset.expanded = open ? "false" : "true";
    post.querySelector(".xmore").textContent = open ? "Show more" : "Show less";
  }

  /* ---------------- inspector ---------------- */

  function renderInspector() {
    var n = state.nodes[state.sel]; if (!n) return;
    var el = $("#inspector"); if (!el) return;
    var T = state.topo;
    var isRoot = n.p === null || n.p === undefined;
    var coord = n.acc ? n.co / n.acc : 0;
    var add = (n.add || []).map(function (t) { return '<span class="tok add">+' + esc(t) + "</span>"; }).join("");
    var del = (n["del"] || []).map(function (t) { return '<span class="tok del">' + esc(t) + "</span>"; }).join("");

    var mutation = isRoot
      ? '<p class="mut"><span class="lbl">earliest phrasing in the corpus &mdash; the root of this lineage</span></p>'
      : '<p class="mut"><span class="lbl">changed from ' + T.label[n.p] + "</span>" + add + del +
        (add || del ? "" : '<span class="tok">wording only</span>') +
        '<span class="lbl">' + Math.round(n.sim * 100) + "% of the words kept</span></p>";

    // Every relation the diagram draws is a word you can click.
    var kids = T.kids[state.sel];
    var sibs = isRoot ? [] : T.kids[n.p].filter(function (k) { return k !== state.sel; });
    var more = function (rest) { return rest > 0 ? '<button disabled>+' + rest + " more</button>" : ""; };
    var rels = '<p class="rels"><span class="lbl">relations</span>' +
      (isRoot ? "<button disabled>root</button>" : relChip("parent", n.p)) +
      (kids.length
        ? kids.slice(0, 8).map(function (k) { return relChip("child", k); }).join("") + more(kids.length - 8)
        : "<button disabled>no children, a dead end</button>") +
      sibs.slice(0, 6).map(function (k) { return relChip("sibling", k); }).join("") + more(sibs.length - 6) +
      "</p>";

    // Only the flags that are actually raised. An unlit warning is noise.
    var fl = [];
    // Two different things used to be reported as one number. A lookalike
    // character sitting inside an otherwise Latin word is evasion and very
    // little else; a wholly styled headline is typography. Only the first
    // is worth raising.
    if (n.mix > 0) {
      fl.push(n.mix + " word" + (n.mix > 1 ? "s" : "") +
              " mix scripts \u2014 a lookalike character inside a Latin word, which " +
              "reads normally and misses a keyword filter");
    } else if (n.obf > 3) {
      fl.push(n.obf + " styled characters (math-bold and similar) \u2014 defeats a naive " +
              "keyword match, but reads as decoration here");
    }
    if (coord > 0.15) fl.push("coordinated accounts present");

    el.innerHTML =
      "<h3>Wording " + T.label[state.sel] + "</h3><span>generation " + n.d +
        " &middot; first seen " + esc(hourLabel(n.t0)) + "</span>" +
      xpost(n) + mutation + rels +
      '<p class="figs"><b>' + fmt(n.n) + "</b> retweets &middot; <b>" + fmt(n.acc) + "</b> accounts &middot; <b>" +
        fmt(n.sub) + "</b> counting everything descended from it &middot; <b>" + Math.round(n.drift * 100) +
        "%</b> drift &middot; <b>" + Math.round(coord * 100) + "%</b> coordinated" +
        (n.src ? " &middot; amplifies @" + esc(n.src) : "") + "</p>" +
      (fl.length
        ? '<p class="flags' + (n.mix > 0 ? "" : " mild") + '">' + fl.join(" &middot; ") + "</p>"
        : "");
    initPost(el);
  }
  function relChip(kind, i) {
    return "<button data-i=\"" + i + '">' + kind + " " + state.topo.label[i] + "</button>";
  }

  /* ---------------- table twin ---------------- */

  // Colour and area are the diagram's encodings; this is the same lineage as
  // numbers, so nothing on the page is readable only as a colour.
  function renderTable() {
    var T = state.topo, nodes = state.nodes;
    var rows = T.order.map(function (i) {
      var n = nodes[i];
      return '<tr data-i="' + i + '" aria-current="' + (i === state.sel) + '">' +
        '<td class="k">' + T.label[i] + "</td><td>" + n.d + "</td><td>" +
        (n.p === null || n.p === undefined ? "\u2014" : T.label[n.p]) + "</td><td>" +
        fmt(n.n) + "</td><td>" + fmt(n.acc) + "</td><td>" +
        (n.acc ? Math.round(n.co / n.acc * 100) : 0) + "%</td><td>" +
        Math.round(n.drift * 100) + "%</td><td>" + esc(hourLabel(n.t0)) + "</td>" +
        '<td class="txt"><span>' + esc(detwit(n.txt)) + "</span></td></tr>";
    }).join("");
    return '<details class="tbl" id="tabledetails"' + (state.tableOpen ? " open" : "") +
      "><summary>the same lineage as numbers \u2014 all " + nodes.length + " wordings</summary>" +
      '<div class="tscroll"><table id="vartable">' +
      "<thead><tr><th>node</th><th>level</th><th>from</th><th>retweets</th><th>accounts</th>" +
      "<th>coord.</th><th>drift</th><th>first seen</th><th>text</th></tr></thead><tbody>" +
      rows + "</tbody></table></div></details>";
  }
  function syncTable() {
    var t = $("#vartable"); if (!t) return;
    Array.prototype.forEach.call(t.querySelectorAll("tr[data-i]"), function (tr) {
      tr.setAttribute("aria-current", String(+tr.dataset.i === state.sel));
    });
  }
  function openPanel()  { setPanel(true); }
  function closePanel() { setPanel(false); }
  function setPanel(on) {
    var p = $("#panel");
    p.classList.toggle("on", on);
    p.setAttribute("aria-hidden", String(!on));
    $("#sheet").dataset.panel = on ? "open" : "closed";
  }
  // `open` is passed by everything a person can click or key. Switching family
  // selects the root silently, which should not throw a panel over the board.
  function selectNode(i, open) {
    state.sel = i; drawTree(); renderInspector(); syncTable();
    if (open) openPanel();
  }

  /* ---------------- stage ---------------- */

  function renderStage() {
    var f = state.fam;
    var isTree = state.xMode === "tree";
    var ml = METRIC_LABEL[state.colorBy];
    var wash = RAMP.map(function (v) { return '<i style="background:' + css(v) + '"></i>'; }).join("");

    var warn = f.win === "aug" ? "" :
      '<p class="warn">' + (f.win === "sep"
        ? "Lives entirely after 1 September, where the crawl collects 1.4M tweets a day against August's 22.0M. Its spread is undercounted by roughly 15× next to an August lineage."
        : "Crosses 1 September, where crawl volume drops 15×. Any fall-off after that point is partly our collection thinning, not the narrative dying.") + "</p>";

    // The cliff is a dashed rule on a time axis and a marked node in the tree,
    // so the sentence pointing at it has to follow the layout.
    var seam = isTree
      ? (f.win === "span"
          ? "so counts before and after 1 September are not comparable; the wordings marked * are the ones that first appeared after it. "
          : "so counts before and after 1 September are not comparable. ")
      : "so counts either side of the dashed rule are not comparable. ";
    var geom = isTree
      ? "Each row is one generation, and a parent sits centred over its children. Horizontal position carries no measure here — " +
        "it only packs the tree, so switch the layout to <i>time</i> to see how long a rewording took to appear. "
      : "Horizontal distance is real waiting time; vertical position only keeps sibling lineages apart. ";

    $("#stage-body").className = "";
    $("#stage-body").innerHTML =
      '<div class="lin"><div class="hdr">' +
        "<h2>Lineage " + f.id + "</h2>" +
        '<p class="figs"><b>' + f.nv + "</b> wordings &middot; <b>" + f.depth + "</b> generations &middot; <b>" +
          fmt(f.emis) + "</b> retweets &middot; <b>" + fmt(f.acc) + "</b> accounts &middot; <b>" +
          Math.round(f.drift * 100) + "%</b> mean drift &middot; <b>" + Math.round(f.coord_share * 100) +
          "%</b> coordinated &middot; over <b>" + Math.round((f.t1 - f.t0) / 24) + "</b> days</p>" +
        kindLine(f) + "</div>" +
        '<p class="root">' + esc(detwit(f.root)) + "</p>" +
        warn +
      "</div>" +
      '<div class="bar">' +
        '<span class="grp" id="colorby"><b>shade</b>' +
          btn("drift", "drift", state.colorBy) + btn("spread", "spread", state.colorBy) +
          btn("coord", "coordination", state.colorBy) + "</span>" +
        '<span class="grp" id="xmode"><b>layout</b>' +
          btn("tree", "tree", state.xMode) + btn("log", "time", state.xMode) + "</span>" +
        '<span class="scrub"><button class="act" id="play">play</button>' +
          '<input id="cut" type="range" min="' + f.t0 + '" max="' + f.t1 + '" value="' + f.t1 +
          '" aria-label="Show wordings first seen up to"><output id="cutout"></output></span>' +
        '<button class="act" id="reset">reset view</button>' +
      "</div>" +
      '<div class="plot"><svg id="pulse" class="pulse" role="img" aria-label="Retweets per hour for this lineage"></svg></div>' +
      '<div class="draw"><svg id="tree" class="tree" role="img" tabindex="0" aria-label="' +
        (isTree
          ? "Mutation tree as a rooted tree, one row per generation. Arrow keys move to the parent, a child or a sibling."
          : "Mutation tree drawn against time. Arrow keys move to the parent, a child or a sibling.") +
        '"></svg></div>' +
      '<div class="key">' +
        "<span>" + ml[1] + '<span class="wash">' + wash + "</span>" + ml[2] + " &mdash; " + ml[0] + "</span>" +
        "<span>bigger circle, more retweets</span>" +
        '<span><svg width="15" height="15" aria-hidden="true"><circle cx="7.5" cy="7.5" r="5" fill="none" stroke="' +
          css("--red") + '" stroke-width="2"/></svg>coordinated accounts</span>' +
        (isTree
          ? "<span>pencilled ring, the subtree of the selected wording</span>" +
            (f.win === "span" ? "<span>* first seen after 1 Sep</span>" : "")
          : '<span><svg width="15" height="10" aria-hidden="true"><line x1="7" y1="0" x2="7" y2="10" stroke="' +
            css("--red") + '" stroke-width="1.5" stroke-dasharray="3 2"/></svg>1 Sep collection cliff</span>') +
        "<span><b>click a circle</b> to read its wording</span>" +
      "</div>" +
      renderTable();

    // The prose that explains the drawing belongs beside the wording it is
    // explaining, not underneath the board.
    $("#howto-body").innerHTML =
      '<p class="note"><b>How to read it.</b> Each circle is one distinct wording. A wording hangs off whichever ' +
        "earlier wording it most resembles, so the root is the earliest phrasing <i>in this corpus</i> &mdash; not where " +
        "the idea began. " + geom +
        "Topic tags are a keyword heuristic, not a classifier. &ldquo;Coordinated&rdquo; means the account co-amplified " +
        "content with others inside a 60&#8202;s window, repeatedly: evidence of coordination, not proof of automation. " +
        "The crawl collected 22.0M tweets a day through 31 August and 1.4M a day after, " + seam +
        "Tick <i>August 17&ndash;31 only</i> for a clean sample.</p>";

    state.cut = f.t1;
    view = { k: 1, tx: 0, ty: 0, auto: true };
    relayout();
    renderInspector();
    wireStage();
  }
  function btn(v, label, cur) {
    return '<button data-v="' + v + '" aria-pressed="' + (v === cur) + '">' + label + "</button>";
  }

  function relayout() {
    var svg = $("#tree"); if (!svg) return;
    layout = buildLayout(state.nodes, state.xMode, svg.clientWidth || 800);
    drawTree(); drawPulse(); updateCut();
  }

  function updateCut() {
    var o = $("#cutout"); if (!o) return;
    var shown = state.nodes.filter(function (n) { return n.t0 <= state.cut; }).length;
    o.textContent = shown + "/" + state.nodes.length + " · " + dayLabel(state.cut);
  }

  function wireStage() {
    var svg = $("#tree"), tip = $("#tip");

    svg.addEventListener("pointermove", function (e) {
      var t = e.target;
      if (t.classList && t.classList.contains("nd")) {
        var n = state.nodes[+t.dataset.i];
        tip.innerHTML = xpost(n, true) +
          '<div class="m">generation ' + n.d + " &middot; " + Math.round(n.drift * 100) +
          "% drift &middot; first seen " + esc(hourLabel(n.t0)) + "</div>";
        tip.classList.add("on");
        var w = tip.offsetWidth, h = tip.offsetHeight;
        tip.style.left = Math.min(e.clientX + 14, innerWidth - w - 10) + "px";
        tip.style.top = Math.max(8, e.clientY - h - 12) + "px";
      } else { tip.classList.remove("on"); }
    });
    svg.addEventListener("pointerleave", function () { tip.classList.remove("on"); });

    // A tree is navigated by its relations, so give the keyboard the same four
    // moves the diagram draws.
    svg.addEventListener("keydown", function (e) {
      var T = state.topo, n = state.nodes[state.sel], go;
      var hasParent = !(n.p === null || n.p === undefined);
      if (e.key === "ArrowUp") go = hasParent ? n.p : undefined;
      else if (e.key === "ArrowDown") go = T.kids[state.sel][0];
      else if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
        var sibs = hasParent ? T.kids[n.p] : [T.root];
        go = sibs[sibs.indexOf(state.sel) + (e.key === "ArrowRight" ? 1 : -1)];
      } else if (e.key === "Home") go = T.root;
      else return;
      e.preventDefault();
      if (go !== undefined) selectNode(go, true);
    });

    var table = $("#vartable");
    if (table) table.addEventListener("click", function (e) {
      var tr = e.target.closest("tr[data-i]"); if (tr) selectNode(+tr.dataset.i, true);
    });
    var details = $("#tabledetails");
    if (details) details.addEventListener("toggle", function () { state.tableOpen = details.open; });

    // Pan, zoom, and pick. Picking rides on pointerup rather than on click:
    // panning captures the pointer, and a captured pointer retargets the click
    // to the <svg>, so the circle itself never sees one.
    var drag = null;
    svg.addEventListener("pointerdown", function (e) {
      drag = { x: e.clientX, y: e.clientY, tx: view.tx, ty: view.ty, hit: e.target, moved: false };
      svg.classList.add("dragging"); svg.setPointerCapture(e.pointerId);
    });
    svg.addEventListener("pointerup", function (e) {
      var d = drag;
      drag = null; svg.classList.remove("dragging");
      try { svg.releasePointerCapture(e.pointerId); } catch (err) {}
      if (d && !d.moved && d.hit && d.hit.classList && d.hit.classList.contains("nd")) {
        selectNode(+d.hit.dataset.i, true);
      }
    });
    svg.addEventListener("pointercancel", function () {
      drag = null; svg.classList.remove("dragging");
    });
    svg.addEventListener("pointermove", function (e) {
      if (!drag) return;
      // A few pixels of hand tremor is a pick, not a drag.
      if (!drag.moved) {
        if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) < 4) return;
        drag.moved = true;
      }
      view.auto = false;
      view.tx = drag.tx + (e.clientX - drag.x); view.ty = drag.ty + (e.clientY - drag.y); drawTree();
    });
    svg.addEventListener("wheel", function (e) {
      e.preventDefault();
      var r = svg.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
      view.auto = false;
      var k = Math.max(0.5, Math.min(8, view.k * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));
      view.tx = mx - (mx - view.tx) * (k / view.k);
      view.ty = my - (my - view.ty) * (k / view.k);
      view.k = k; drawTree();
    }, { passive: false });

    $("#reset").addEventListener("click", function () { view = { k:1, tx:0, ty:0, auto:true }; drawTree(); });
    $("#colorby").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-v]"); if (!b) return;
      state.colorBy = b.dataset.v; renderStage();
    });
    $("#xmode").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-v]"); if (!b) return;
      state.xMode = b.dataset.v; renderStage();
    });
    $("#cut").addEventListener("input", function (e) {
      state.cut = +e.target.value; drawTree(); drawPulse(); updateCut();
    });
    $("#play").addEventListener("click", play);
  }

  // Wired once, against elements that no render replaces.
  function wireOnce() {
    // The relation chips are the diagram's edges as words, so they navigate it.
    $("#inspector").addEventListener("click", function (e) {
      var m = e.target.closest(".xmore");
      if (m) { togglePost(m.closest(".xpost")); return; }
      var b = e.target.closest("button[data-i]"); if (b) selectNode(+b.dataset.i, true);
    });
    $("#panelx").addEventListener("click", closePanel);
    addEventListener("keydown", function (e) {
      if (e.key === "Escape") closePanel();
    });

    var fold = $("#fold"), sheet = $("#sheet");
    fold.addEventListener("click", function () {
      var open = sheet.dataset.rail !== "closed";
      sheet.dataset.rail = open ? "closed" : "open";
      fold.setAttribute("aria-expanded", String(!open));
      fold.title = open ? "Show the lineage list" : "Hide the lineage list";
      $("#foldtext").textContent = fold.title;
    });
    // The stage only learns its new width once the fold has finished.
    $("#rail").addEventListener("transitionend", function (e) {
      if (e.propertyName === "width") relayout();
    });
    sheet.addEventListener("transitionend", function (e) {
      if (e.propertyName === "margin-right" && e.target === sheet) relayout();
    });

    addEventListener("resize", debounce(relayout, 160));
  }

  function play() {
    if (state.playing) return;
    var f = state.fam, slider = $("#cut"), btn = $("#play");
    var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) { state.cut = f.t1; slider.value = f.t1; drawTree(); drawPulse(); updateCut(); return; }
    state.playing = true; btn.textContent = "■ Playing";
    var h = f.t0, step = Math.max(1, Math.round((f.t1 - f.t0) / 90));
    var timer = setInterval(function () {
      h += step;
      if (h >= f.t1) { h = f.t1; clearInterval(timer); state.playing = false; btn.innerHTML = "&#9654; Play"; }
      state.cut = h; slider.value = h; drawTree(); drawPulse(); updateCut();
    }, 45);
  }

  function debounce(fn, ms) {
    var t; return function () { clearTimeout(t); t = setTimeout(fn, ms); };
  }

  /* ---------------- loading ---------------- */

  function selectFamily(id) {
    state.famId = id;
    state.fam = FAMS.find(function (f) { return f.id === id; });
    renderList();
    var b = id % META.buckets;
    var go = function (bucket) {
      state.nodes = bucket[String(id)].nodes;
      state.topo = topology(state.nodes);
      state.sel = state.topo.root;
      renderStage();
    };
    if (BUCKETS[b]) { go(BUCKETS[b]); return; }
    $("#stage-body").className = "loading";
    $("#stage-body").textContent = "Loading lineage " + id + "…";
    fetch("phylo/trees-" + String(b).padStart(2, "0") + ".json")
      .then(function (r) { return r.json(); })
      .then(function (j) { BUCKETS[b] = j; go(j); })
      .catch(function () {
        $("#stage-body").textContent = "Could not load that lineage. Try another from the list.";
      });
  }

  function renderTopics() {
    var counts = {};
    FAMS.forEach(function (f) { f.topics.forEach(function (t) { counts[t] = (counts[t] || 0) + 1; }); });
    var chips = ['<button data-t="all" aria-pressed="true">all subjects</button>',
                 '<button data-t="news" aria-pressed="false">news &amp; politics</button>'];
    Object.keys(TOPIC_LABEL).filter(function (t) { return counts[t]; }).forEach(function (t) {
      chips.push('<button data-t="' + t + '" aria-pressed="false">' + TOPIC_LABEL[t].toLowerCase() +
                 ' <i>' + counts[t] + "</i></button>");
    });
    $("#topics").innerHTML = chips.join("");
  }

  // The behaviour row. Classes with nothing in them are still listed, greyed
  // and disabled, because "we looked for filter evasion and found none" is a
  // result and hiding the chip would quietly turn it into a question never
  // asked.
  function renderKinds() {
    var counts = {}, off = 0, flagged = 0;
    FAMS.forEach(function (f) {
      counts[f.kind] = (counts[f.kind] || 0) + 1;
      if (f.offlang) off++;
      if (f.kind !== "organic") flagged++;
    });
    var chips = ['<button data-k="all" aria-pressed="true">any behaviour</button>',
                 '<button data-k="flagged" aria-pressed="false">any flag <i>' + flagged + "</i></button>"];
    ["farm", "evade", "burst", "promo", "organic"].forEach(function (k) {
      var n = counts[k] || 0;
      chips.push('<button data-k="' + k + '" aria-pressed="false" title="' + esc(KIND_NOTE[k]) + '"' +
                 (n ? "" : " disabled") + ">" + KIND_LABEL[k] + " <i>" + n + "</i></button>");
    });
    if (off) {
      chips.push('<button data-k="offlang" aria-pressed="false" title="' +
                 'Twitter tagged these English. Their text is not, so the lineage was built ' +
                 'from Latin-script hashtags alone.">non-English <i>' + off + "</i></button>");
    }
    $("#kinds").innerHTML = chips.join("");
  }

  fetch("phylo/index.json").then(function (r) { return r.json(); }).then(function (data) {
    META = data.meta; FAMS = data.families; CORPUS_T0 = Date.parse(META.t0);

    var flagged = FAMS.filter(function (f) { return f.kind !== "organic"; }).length;
    $("#corpus").innerHTML =
      "<b>" + fmt(META.n_families) + "</b> lineages &middot; <b>" + fmt(META.n_variants) +
      "</b> distinct wordings &middot; <b>" + fmt(META.n_emissions) + "</b> retweets traced &middot; " +
      "<b>" + fmt(flagged) + "</b> carrying a behaviour flag &middot; Aug 17 \u2013 Sep 17, 2026";

    renderTopics();
    renderKinds();
    renderList();
    wireOnce();

    // Open on a prose narrative rather than a promotional template: both are
    // real lineages, but the hashtag-block campaigns dominate the corpus by
    // volume and would give a misleading first impression of what the method
    // finds. Now that promo is classified rather than guessed at by hashtag
    // count, exclude it by class, and exclude the lineages whose text is not
    // actually English.
    var pick = FAMS.filter(function (f) {
      return f.kind !== "promo" && !f.offlang && f.win === "aug" &&
             f.topics.some(function (t) { return NEWS[t]; });
    }).sort(function (a, b) { return notability(b) - notability(a); })[0] || FAMS[0];
    selectFamily(pick.id);

    $("#list").addEventListener("click", function (e) {
      var b = e.target.closest(".fam"); if (b) selectFamily(+b.dataset.id);
    });
    $("#q").addEventListener("input", debounce(function () {
      state.q = $("#q").value; renderList();
    }, 180));
    $("#sort").addEventListener("change", function (e) { state.sort = e.target.value; renderList(); });
    $("#augonly").addEventListener("change", function (e) {
      state.win = e.target.checked ? "aug" : "all"; renderList();
    });
    $("#topics").addEventListener("click", function (e) {
      var c = e.target.closest("button[data-t]"); if (!c) return;
      state.topic = c.dataset.t;
      Array.prototype.forEach.call($("#topics").children, function (x) {
        x.setAttribute("aria-pressed", String(x === c));
      });
      renderList();
    });
    $("#kinds").addEventListener("click", function (e) {
      var c = e.target.closest("button[data-k]"); if (!c || c.disabled) return;
      state.kind = c.dataset.k;
      Array.prototype.forEach.call($("#kinds").children, function (x) {
        x.setAttribute("aria-pressed", String(x === c));
      });
      renderList();
    });
  }).catch(function () {
    $("#stage-body").textContent = "Could not load the lineage index.";
  });
})();
</script>

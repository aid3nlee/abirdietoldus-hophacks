    return css(ramp[i]);
  }
  var METRIC_LABEL = {
    drift: ["drift from the root", "identical", "fully reworded"],
    coord: ["coordinated share — behaviour flag", "none", "all accounts"],
    spread: ["spread, log scale", "1", "40k+"]
  };

  /* ---------------- the board as a physical thing ----------------

     Every circle is a mass on a spring anchored at its rest position, tied to
     its parent and its children by more springs, and solid enough not to sit
     on top of a neighbour. None of it moves the data: the anchors *are* the
     layout above, so any arrangement a reader pulls the tree into eases back
     to the one the measurements produced. Overlap repulsion only fires when
     two circles actually touch, so a settled tree keeps exactly the spacing
     the tidy layout gave it and the physics is invisible until you reach in. */

  var REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var sim = { p: [], links: [], held: -1 };
  var motion = { raf: 0, glide: null };

  function initSim(bloom) {
    var L = layout, nodes = state.nodes, n = nodes.length;
    var keep = !bloom && sim.p.length === n;
    var old = sim.p, p = new Array(n), i;
    for (i = 0; i < n; i++) {
      if (keep) { p[i] = old[i]; continue; }
      // A new lineage arrives folded up against its root and springs open, so
      // the first thing the board says about itself is that it is not a picture.
      var b = bloom && !REDUCE ? 0.55 : 1;
      p[i] = { x: L.x[L.root] + (L.x[i] - L.x[L.root]) * b,
               y: L.y[L.root] + (L.y[i] - L.y[L.root]) * b, vx: 0, vy: 0 };
    }
    sim.p = p; sim.held = -1; sim.links = [];
    nodes.forEach(function (nd, j) {
      if (nd.p === null || nd.p === undefined) return;
      var dx = L.x[j] - L.x[nd.p], dy = L.y[j] - L.y[nd.p];
      sim.links.push({ a: nd.p, b: j, len: Math.sqrt(dx * dx + dy * dy) || 1 });
    });
    if (REDUCE) settle();
  }

  function settle() {
    var L = layout;
    if (!L) return;
    sim.p.forEach(function (p, i) { p.x = L.x[i]; p.y = L.y[i]; p.vx = p.vy = 0; });
  }

  // One frame of the simulation. Returns whether anything is still moving, so
  // the loop can stop the moment the board is at rest rather than burn a core
  // redrawing a still picture.
  function stepSim() {
    var L = layout, P = sim.p, n = P.length, i, j;
    if (!L || !n || REDUCE) return false;
    var lk, a, b, dx, dy, d, d2, f;

    for (i = 0; i < sim.links.length; i++) {
      lk = sim.links[i]; a = P[lk.a]; b = P[lk.b];
      dx = b.x - a.x; dy = b.y - a.y;
      d = Math.sqrt(dx * dx + dy * dy) || 1e-6;
      f = (d - lk.len) / d * 0.035;
      if (lk.a !== sim.held) { a.vx += dx * f; a.vy += dy * f; }
      if (lk.b !== sim.held) { b.vx -= dx * f; b.vy -= dy * f; }
    }

    for (i = 0; i < n; i++) {
      for (j = i + 1; j < n; j++) {
        a = P[i]; b = P[j];
        dx = b.x - a.x; dy = b.y - a.y;
        var gap = L.r[i] + L.r[j] + 7;
        d2 = dx * dx + dy * dy;
        if (d2 >= gap * gap) continue;
        if (d2 < 1e-4) { dx = (i % 2 ? 1 : -1); dy = 1; d2 = 2; }
        d = Math.sqrt(d2);
        f = (gap - d) / d * 0.13;
        if (i !== sim.held) { a.vx -= dx * f; a.vy -= dy * f; }
        if (j !== sim.held) { b.vx += dx * f; b.vy += dy * f; }
      }
    }

    // Whether the board is still busy is a question about the picture, not
    // about the model: a lineage eight thousand units wide, seen at a third of
    // scale, can creep for half a minute inside a tenth of a pixel of screen.
    // So both tests are in the pixels a reader actually has -- with a floor
    // under the scale, so that zooming out does not declare everything
    // finished. Parking only ever happens when the circles have stopped
    // moving anywhere a person could see it.
    var K = Math.max(0.3, view.k), rest = true, far = 0;
    for (i = 0; i < n; i++) {
      var p = P[i];
      if (i === sim.held) { p.vx = p.vy = 0; rest = false; continue; }
      p.vx = (p.vx + (L.x[i] - p.x) * L.ax) * L.dx;
      p.vy = (p.vy + (L.y[i] - p.y) * L.ay) * L.dy;
      p.x += p.vx; p.y += p.vy;
      if (rest && (Math.abs(p.vx) + Math.abs(p.vy)) * K > 0.025) rest = false;
      if (rest) far = Math.max(far, (Math.abs(L.x[i] - p.x) + Math.abs(L.y[i] - p.y)) * K);
    }
    // Close enough that dropping the last fraction of a pixel cannot be seen:
    // take it, so the board is exactly the one the layout describes. Further
    // out than that, stop where it stands rather than jump.
    if (rest && far < 0.5) settle();
    return !rest;
  }

  // Letting go of the board keeps the throw, the way letting go of a map does.
  function stepGlide() {
    var g = motion.glide;
    if (!g) return false;
    view.tx += g.vx; view.ty += g.vy;
    g.vx *= 0.945; g.vy *= 0.945;
    if (Math.abs(g.vx) + Math.abs(g.vy) < 0.15) { motion.glide = null; return false; }
    return true;
  }

  function kick() { if (!motion.raf) motion.raf = requestAnimationFrame(frame); }
  function frame() {
    motion.raf = 0;
    var busy = stepGlide();
    if (stepSim()) busy = true;
    paint();
    if (busy) kick();
  }

  /* ---------------- the camera ---------------- */

  function boardSize() {
    var svg = $("#tree");
    return svg ? { w: svg.clientWidth || 800, h: svg.clientHeight || 520 } : { w: 800, h: 520 };
  }
  function sizeBoard() {
    var d = $(".draw"), svg = $("#tree");
    if (!d || !svg) return;
    svg.setAttribute("width", Math.max(140, d.clientWidth));
    svg.setAttribute("height", Math.max(140, d.clientHeight));
  }

  // World extent of the resting arrangement, which is what "the whole lineage"
  // means -- fitting to wherever the circles have been dragged to would make
  // the fit button move the answer around.
  function worldBox() {
    var L = layout, x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    state.nodes.forEach(function (n, i) {
      x0 = Math.min(x0, L.x[i] - L.r[i]); x1 = Math.max(x1, L.x[i] + L.r[i]);
      y0 = Math.min(y0, L.y[i] - L.r[i]); y1 = Math.max(y1, L.y[i] + L.r[i]);
    });
    if (L.mode === "time") { x0 -= 92; y0 -= 28; } // room for time-axis labels
    else y0 -= 22;                              // room for the "root" caption
    return { x0: x0, y0: y0, x1: x1, y1: y1 };
  }

  // The widest lineage in the corpus is 226 wordings across a dozen
  // generations. Fitted to the window that is a field of specks, so opening a
  // lineage stops at a size the circles can still be read at and leaves the
  // rest to the pan -- but `fit` pressed on purpose really does fit, however
  // small that has to be. Only the automatic one is floored.
  function fitView(hard) {
    if (!layout || !scene) return;
    var b = worldBox(), s = boardSize(), pad = 30;
    var k = Math.min((s.w - pad * 2) / Math.max(1, b.x1 - b.x0),
                     (s.h - pad * 2) / Math.max(1, b.y1 - b.y0));
    var floor = hard ? ZMIN : 0.34;
    view.note = !hard && k < floor
      ? "part of a wide lineage \u2014 press fit to see all " + state.nodes.length : "";
    view.k = Math.max(floor, Math.min(1.6, k));
    view.tx = s.w / 2 - (b.x0 + b.x1) / 2 * view.k;
    view.ty = s.h / 2 - (b.y0 + b.y1) / 2 * view.k;
    view.auto = true;
    showZoom();
  }

  function zoomAt(px, py, f) {
    var k = Math.max(ZMIN, Math.min(ZMAX, view.k * f));
    if (k === view.k) return;
    view.tx = px - (px - view.tx) * (k / view.k);
    view.ty = py - (py - view.ty) * (k / view.k);
    view.k = k; view.auto = false; view.note = "";
    showZoom(); paint();
    // A residue too small to see at the old scale may not be at the new one.
    kick();
  }

  function centerOn(i) {
    var s = boardSize();
    view.k = Math.min(ZMAX, Math.max(view.k, 1.3));
    view.tx = s.w / 2 - sim.p[i].x * view.k;
    view.ty = s.h / 2 - sim.p[i].y * view.k;
    view.auto = false; view.note = "";
    showZoom(); paint();
  }

  // Where the camera is, said plainly. A map that can go from 2% to 5000% owes
  // the reader a number, or "zoomed out" and "lost" look identical.
  function showZoom() {
    var z = $("#zoomlbl"); if (!z) return;
    var pct = view.k * 100;
    z.textContent = (pct >= 10 ? Math.round(pct) : pct.toFixed(1)) + "%" +
      (view.note ? " \u00b7 " + view.note : "");
  }

  /* ---------------- the board, built once and then moved ----------------

     The circles are repositioned sixty times a second, so they are real
     elements that get a new transform rather than markup rebuilt from a string
     each frame. Colour, the coordination ring and the time cut-off change far
     more rarely and have their own pass. */

  // The axis-break convention, drawn the way the rest of the board is drawn.
  function squiggle(x0, x1, y) {
    var d = "M" + x0.toFixed(1) + "," + y.toFixed(1), x = x0, up = 1;
    while (x < x1 - 0.5) {
      var nx = Math.min(x1, x + 11);
      d += "Q" + (x + (nx - x) / 2).toFixed(1) + "," + (y + up * 3.4).toFixed(1) +
           " " + nx.toFixed(1) + "," + y.toFixed(1);
      x = nx; up = -up;
    }
    return d;
  }

  // How long a gap was, in the coarsest unit that still says something.
  function spanLabel(h) {
    if (h < 48) return Math.round(h) + " h";
    var d = h / 24;
    return (d < 10 ? d.toFixed(1).replace(/\.0$/, "") : String(Math.round(d))) + " d";
  }

  function gridMarkup(L) {
    if (L.mode !== "time") return "";
    var b = worldBox(), x0 = b.x0 + 82, x1 = b.x1 + 14, out = [];
    var elapsed = L.t1 - L.t0, step = 1;
    // Aim for five or six labelled guides, then use a human-readable time
    // unit. The positions remain linear even when the labels use days/weeks.
    [1, 2, 4, 6, 12, 24, 48, 72, 120, 168, 336, 720, 1440, 2880].some(function (v) {
      step = v;
      return elapsed / v <= 6;
    });
    var ticks = [0];
    for (var o = step; o < elapsed; o += step) ticks.push(o);
    if (ticks[ticks.length - 1] !== elapsed) ticks.push(elapsed);

    // Evenly spaced hours land at uneven distances on an elastic axis, so a run
    // of ticks through a compressed stretch would stack its own labels. Both
    // ends are worth more than anything between them, so a collision drops the
    // guide already placed rather than the one arriving.
    var keep = [];
    ticks.forEach(function (o, k) {
      var gy = L.frac(L.t0 + o) * L.H;
      if (keep.length && Math.abs(gy - keep[keep.length - 1].gy) < 16) {
        if (k !== ticks.length - 1) return;
        keep.pop();
      }
      keep.push({ o: o, gy: gy });
    });

    keep.forEach(function (t) {
      var gy = t.gy.toFixed(1);
      out.push('<line x1="' + x0.toFixed(1) + '" y1="' + gy + '" x2="' + x1.toFixed(1) + '" y2="' + gy +
        '" stroke="' + css("--hair") + '" stroke-width="1"/>');
      out.push('<text x="' + (x0 - 10).toFixed(1) + '" y="' + (+gy + 4).toFixed(1) + '" font-size="11" fill="' +
        css("--ink-2") + '" text-anchor="end">' + esc(dayLabel(L.t0 + t.o)) + "</text>");
    });

    // Where the clock was shortened, say so on the board itself. Nothing is
    // drawn in these bands by construction -- they were compressed precisely
    // because no wording falls inside them -- so the note has the width to
    // itself, and it carries the real elapsed time the break stands in for.
    (L.breaks || []).forEach(function (b) {
      out.push('<path d="' + squiggle(x0, x1, b.y) + '" fill="none" stroke="' + css("--hair") +
        '" stroke-width="1.2"/>');
      out.push('<text x="' + (x0 + 12).toFixed(1) + '" y="' + (b.y - 8).toFixed(1) +
        '" font-size="10.5" fill="' + css("--ink-2") + '" opacity=".85">' +
        esc(spanLabel(b.hours)) + " with no new wording \u2014 axis compressed</text>");
    });
    // The crawl thins 15x on 1 September, so a lineage that appears to stop
    // there may only have gone unobserved. Draw the seam rather than hide it.
    if (META.cliff_h > L.t0 && META.cliff_h < L.t1) {
      var cy = L.frac(META.cliff_h) * L.H;
      out.push('<line x1="' + x0.toFixed(1) + '" y1="' + cy.toFixed(1) + '" x2="' + x1.toFixed(1) +
        '" y2="' + cy.toFixed(1) + '" stroke="' + css("--red") +
        '" stroke-width="1.5" stroke-dasharray="4 3"/>');
      out.push('<text x="' + (x1 - 2).toFixed(1) + '" y="' + (cy - 6).toFixed(1) +
        '" font-size="12.5" fill="' + css("--red") + '" text-anchor="end">1 Sep — crawl thins 15×</text>');
    }
    return out.join("");
  }

  function buildScene() {
    var svg = $("#tree"); if (!svg) return;
    var L = layout, nodes = state.nodes;
    var heavy = {};
    nodes.map(function (n, i) { return [n.n, i]; })
      .sort(function (a, b) { return b[0] - a[0]; }).slice(0, 4)
      .forEach(function (p) { heavy[p[1]] = fmt(nodes[p[1]].n); });

    var owner = [], edges = [], marks = [];
    nodes.forEach(function (n, i) {
      var r = L.r[i], fs = Math.min(13, Math.max(9, r * 0.86));
      if (!(n.p === null || n.p === undefined)) {
        owner.push(i);
        edges.push('<path fill="none" stroke="' + css("--ink-2") +
          '" stroke-width="1.3" stroke-linecap="round"/>');
      }
      marks.push('<g class="ndg" data-i="' + i + '">' +
        '<circle class="nd" r="' + r.toFixed(1) + '"/>' +
        '<text class="lb" y="' + (fs * 0.35).toFixed(1) + '" text-anchor="middle" font-size="' +
          fs.toFixed(1) + '" font-weight="600"></text>' +
        (i === L.root
          ? '<text class="cap" y="' + (-r - 10).toFixed(1) + '" text-anchor="middle" font-size="13.5" fill="' +
            css("--ink-2") + '">root</text>' : "") +
        (heavy[i]
          ? '<text class="cap" y="' + (r + 13).toFixed(1) + '" text-anchor="middle" font-size="11.5" fill="' +
            css("--ink-2") + '">' + heavy[i] + "</text>" : "") +
        (n.cmt && n.cmt.n
          ? '<g class="rsp" transform="translate(' + (r * .72).toFixed(1) + ',' + (-r * .72).toFixed(1) +
            ')" aria-label="' + fmt(n.cmt.n) + ' comments captured"><title>' + fmt(n.cmt.n) +
            ' comments captured (' + fmt(n.cmt.q) + ' quote tweets, ' + fmt(n.cmt.n - n.cmt.q) +
            ' replies)</title><circle r="5.7"/><path d="M-2.4 -1.8h4.8v3.5h-2l-1.7 1.4V1.7h-1.1z"/></g>'
          : "") +
        "</g>");
    });

    svg.innerHTML =
      '<defs><pattern id="dotgrid" patternUnits="userSpaceOnUse" width="80" height="80">' +
        '<circle class="dot" cx="40" cy="40" r="1" fill="' + css("--rule") + '" opacity=".75"/>' +
      "</pattern></defs>" +
      // A canvas with no edges needs something to move against, or panning
      // reads as nothing happening. The dots are drawn in screen space and
      // re-tiled as the zoom changes, so they never grow into blobs.
      '<rect class="paper" x="0" y="0" width="100%" height="100%" fill="url(#dotgrid)"/>' +
      '<g class="world">' +
        '<g class="grid">' + gridMarkup(L) + "</g>" +
        '<path class="hull" fill="' + css("--ink") + '" fill-opacity=".045" stroke="' + css("--ink-2") +
          '" stroke-opacity=".65" stroke-width="1.1" stroke-dasharray="1 4" stroke-linecap="round" ' +
          'stroke-linejoin="round" pointer-events="none" d=""/>' +
        '<g class="edges">' + edges.join("") + "</g>" +
        '<circle class="pring" fill="none" stroke="' + css("--pen") + '" stroke-width="1.3" ' +
          'stroke-dasharray="3 3" opacity="0" pointer-events="none"/>' +
        '<circle class="sring" fill="none" stroke="' + css("--pen") + '" stroke-width="1.8" ' +
          'opacity="0" pointer-events="none"/>' +
        '<g class="nodes">' + marks.join("") + "</g>" +
      "</g>";

    var q = function (s) { return [].slice.call(svg.querySelectorAll(s)); };
    scene = {
      pat: svg.querySelector("#dotgrid"), dot: svg.querySelector(".dot"),
      world: svg.querySelector(".world"), hull: svg.querySelector(".hull"),
      edges: q(".edges > path"), owner: owner,
      g: q(".nodes > g"), circ: q(".nodes > g > circle"), lab: q(".nodes > g > text.lb"),
      sring: svg.querySelector(".sring"), pring: svg.querySelector(".pring")
    };
  }

  // The subtree of the selected wording: everything descended from it, which is
  // the population the lineage-total figure in the panel counts. The circles
  // move, so it is a hull recomputed with them rather than a fixed band.
  function hullPath() {
    var L = layout, P = sim.p, sel = state.sel;
    if (sel === L.root || !L.kids[sel] || !L.kids[sel].length) return "";
    var pts = [], stack = [sel];
    while (stack.length) {
      var i = stack.pop(), r = L.r[i] + 11;
      for (var a = 0; a < 10; a++) {
        pts.push([P[i].x + Math.cos(a * Math.PI / 5) * r, P[i].y + Math.sin(a * Math.PI / 5) * r]);
      }
      L.kids[i].forEach(function (k) { stack.push(k); });
    }
    var h = convexHull(pts);
    if (h.length < 3) return "";
    return "M" + h.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join("L") + "Z";
  }
  // Monotone chain: sort by x, then keep only the turns that go one way, twice.
  function convexHull(pts) {
    pts = pts.slice().sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; });
    var cross = function (o, a, b) {
      return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    };
    var lo = [], up = [], i;
    for (i = 0; i < pts.length; i++) {
      while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], pts[i]) <= 0) lo.pop();
      lo.push(pts[i]);
    }
    for (i = pts.length - 1; i >= 0; i--) {
      while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], pts[i]) <= 0) up.pop();
      up.push(pts[i]);
    }
    lo.pop(); up.pop();
    return lo.concat(up);
  }

  // Geometry only, once a frame.
  function paint() {
    var L = layout, S = scene, P = sim.p;
    if (!L || !S || !P.length) return;
    var i, n = P.length;

    S.world.setAttribute("transform", "translate(" + view.tx.toFixed(2) + "," + view.ty.toFixed(2) +
      ") scale(" + view.k.toFixed(5) + ")");

    // Re-tile the dot grid by zoom decade so the dots keep both their size and
    // a sane spacing however far in or out the reader goes.
    var step = 80;
    while (step * view.k < 46) step *= 2;
    while (step * view.k > 130) step /= 2;
    var sp = step * view.k;
    S.pat.setAttribute("width", sp.toFixed(3));
    S.pat.setAttribute("height", sp.toFixed(3));
    S.dot.setAttribute("cx", (sp / 2).toFixed(3));
    S.dot.setAttribute("cy", (sp / 2).toFixed(3));
    S.pat.setAttribute("patternTransform", "translate(" +
      ((view.tx % sp + sp) % sp).toFixed(2) + "," + ((view.ty % sp + sp) % sp).toFixed(2) + ")");

    for (i = 0; i < n; i++) {
      S.g[i].setAttribute("transform",
        "translate(" + P[i].x.toFixed(1) + "," + P[i].y.toFixed(1) + ")");
    }

    // One straight segment from a parent to a child, drawn rim to rim rather
    // than centre to centre so a line never crosses a circle's own label. It
    // is the shortest thing that can be drawn between two circles and the only
    // one with nothing to interpret: no wobble, no corner, no curve. The
    // length of a long edge is a real distance on the board, not a detour.
    for (i = 0; i < S.edges.length; i++) {
      var c = S.owner[i], pj = state.nodes[c].p, A = P[pj], B = P[c];
      var rp = L.r[pj], rc = L.r[c], dx = B.x - A.x, dy = B.y - A.y;
      var len = Math.sqrt(dx * dx + dy * dy) || 1;
      S.edges[i].setAttribute("d",
        "M" + (A.x + dx / len * rp).toFixed(1) + "," + (A.y + dy / len * rp).toFixed(1) +
        "L" + (B.x - dx / len * rc).toFixed(1) + "," + (B.y - dy / len * rc).toFixed(1));
    }

    var sel = state.sel, par = state.nodes[sel].p;
    S.sring.setAttribute("cx", P[sel].x.toFixed(1));
    S.sring.setAttribute("cy", P[sel].y.toFixed(1));
    if (!(par === null || par === undefined)) {
      S.pring.setAttribute("cx", P[par].x.toFixed(1));
      S.pring.setAttribute("cy", P[par].y.toFixed(1));
    }
    S.hull.setAttribute("d", hullPath());
  }

  // Everything that is about a wording rather than about where it currently is.
  function restyle() {
    var L = layout, S = scene, nodes = state.nodes;
    if (!L || !S) return;
    // Only mark the cliff per node where the distinction bites: inside a
    // lineage that straddles it. A wholly post-September family is flagged once
    // at the top instead of on every circle.
    var markCliff = state.fam.win === "span";
    nodes.forEach(function (n, i) {
      var fill = rampColor(metricOf(n), state.colorBy);
      var coord = n.acc ? n.co / n.acc : 0;
      var c = S.circ[i];
      c.setAttribute("fill", fill);
      c.setAttribute("stroke", coord > 0.15 ? css("--red") : css("--paper"));
      c.setAttribute("stroke-width", coord > 0.15 ? 2.4 : 2);
      c.setAttribute("stroke-dasharray", n.leaf ? "3 2" : "");
      S.g[i].setAttribute("opacity", n.t0 > state.cut ? 0.12 : 1);
      S.lab[i].setAttribute("fill", inkOn(fill));
      S.lab[i].textContent = L.label[i] + (markCliff && n.t0 >= META.cliff_h ? "*" : "");
    });
    S.edges.forEach(function (p, i) {
      var c = S.owner[i];
      p.setAttribute("opacity",
        nodes[c].t0 > state.cut || nodes[nodes[c].p].t0 > state.cut ? 0.12 : 1);
    });
    var sel = state.sel, par = nodes[sel].p;
    S.sring.setAttribute("r", (L.r[sel] + 5).toFixed(1));
    S.sring.setAttribute("opacity", nodes[sel].t0 > state.cut ? 0.12 : 1);
    S.pring.setAttribute("opacity", par === null || par === undefined ? 0 : 0.85);
    if (!(par === null || par === undefined)) S.pring.setAttribute("r", (L.r[par] + 4.5).toFixed(1));
  }

  // Family emission curve: one series, so no legend -- the heading names it.
  function drawPulse() {
    var svg = $("#pulse"); if (!svg) return;
    var byHour = {};
    state.nodes.forEach(function (n) {
      (n.spark || []).forEach(function (p) { byHour[p[0]] = (byHour[p[0]] || 0) + p[1]; });
    });
    var hs = Object.keys(byHour).map(Number).sort(function (a, b) { return a - b; });
    if (!hs.length) { svg.innerHTML = ""; return; }
    // Inside a 264px island the chart is all curve: no left gutter, the peak
    // named above the line and the two dates under it, so the series itself
    // gets the whole width instead of sharing it with a legend.
    var W = svg.clientWidth || 240, H = 58, padL = 2, padR = 2;
    var h0 = hs[0], h1 = hs[hs.length - 1], mx = Math.max.apply(null, hs.map(function (h) { return byHour[h]; }));
    var cap = 17, base = H - 13, span = W - padL - padR;
    var X = function (h) { return padL + (h1 > h0 ? (h - h0) / (h1 - h0) : 0) * span; };
    var Y = function (v) { return base - (v / mx) * (base - cap); };
    var pts = [], area = ["M" + X(h0) + "," + base];
    for (var h = h0; h <= h1; h++) {
      var v = byHour[h] || 0;
      pts.push(X(h) + "," + Y(v)); area.push("L" + X(h) + "," + Y(v));
    }
    area.push("L" + X(h1) + "," + base + "Z");
    var cutX = state.cut === Infinity ? null : X(Math.min(state.cut, h1));
    var cliffX = (META.cliff_h > h0 && META.cliff_h < h1) ? X(META.cliff_h) : null;
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.innerHTML =
      '<path d="' + area.join("") + '" fill="' + css("--pen") + '" opacity=".16"/>' +
      '<polyline points="' + pts.join(" ") + '" fill="none" stroke="' + css("--pen") +
        '" stroke-width="2" stroke-linejoin="round"/>' +
      '<line x1="' + padL + '" y1="' + base + '" x2="' + (W - padR) + '" y2="' + base +
        '" stroke="' + css("--rule") + '" stroke-width="1"/>' +
      (cliffX !== null ? '<line x1="' + cliffX + '" y1="' + cap + '" x2="' + cliffX + '" y2="' + base +
        '" stroke="' + css("--red") + '" stroke-width="1.5" stroke-dasharray="4 3"/>' : "") +
      (cutX !== null ? '<line x1="' + cutX + '" y1="' + cap + '" x2="' + cutX + '" y2="' + base +
        '" stroke="' + css("--pen") + '" stroke-width="1.5"/>' : "") +
      '<text x="' + padL + '" y="10" font-size="9.5" fill="' + css("--ink-2") + '">peak ' + fmt(mx) + "/h</text>" +
      '<text x="' + padL + '" y="' + (H - 2.5) + '" font-size="9.5" fill="' + css("--ink-2") + '">' +
        esc(dayLabel(h0)) + "</text>" +
      '<text x="' + (W - padR) + '" y="' + (H - 2.5) + '" font-size="9.5" fill="' + css("--ink-2") +
        '" text-anchor="end">' + esc(dayLabel(h1)) + "</text>";
  }

  /* ---------------- the post, as X would draw it ----------------

     Generic equivalents of X's action icons, not their artwork: same
     vocabulary at the same weight, drawn here. */
  var XI = {
    reply: "M4.3 5.9A2.6 2.6 0 0 1 6.9 3.3h10.2a2.6 2.6 0 0 1 2.6 2.6v7.5a2.6 2.6 0 0 1-2.6 2.6h-4.6l-4.8 3.7v-3.7H6.9a2.6 2.6 0 0 1-2.6-2.6z",
    rt:    "M4.8 9.3V7.6a2.4 2.4 0 0 1 2.4-2.4h8.3M13.3 2.6 16.1 5.2l-2.8 2.6M19.2 14.7v1.7a2.4 2.4 0 0 1-2.4 2.4H8.5M10.7 21.4 7.9 18.8l2.8-2.6",
    like:  "M12 20.3S4.6 15.7 4.6 10.9A4.1 4.1 0 0 1 12 8.4a4.1 4.1 0 0 1 7.4 2.5c0 4.8-7.4 9.4-7.4 9.4z",
    views: "M4.4 20.2v-8.8M9.5 20.2V4.6M14.5 20.2v-6.1M19.6 20.2V8.2",
    save:  "M6.2 3.6h11.6v17.1L12 16.3l-5.8 4.4z",
    share: "M12 15.4V3.4M8.4 7 12 3.4 15.6 7M5 12.6v6.1a1.6 1.6 0 0 0 1.6 1.6h10.8a1.6 1.6 0 0 0 1.6-1.6v-6.1"
  };
  function xicon(k) {
    return '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" ' +
      'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="' + XI[k] + '"/></svg>';
  }

  // X's own compact counter: 942, 2.3K, 230K, 1.4M.
  function compact(v) {
    if (v < 1000) return String(v);
    var u = v < 1e6 ? [v / 1e3, "K"] : [v / 1e6, "M"];
    return (u[0] < 100 ? u[0].toFixed(1).replace(/\.0$/, "") : String(Math.round(u[0]))) + u[1];
  }

  // No avatars were collected, so the circle is a deterministic monogram
  // rather than a stand-in photograph of somebody.
  function avatar(handle) {
    var h = 0;
    for (var i = 0; i < handle.length; i++) h = (h * 31 + handle.charCodeAt(i)) >>> 0;
    return { bg: "hsl(" + (h % 360) + " 48% 44%)", ch: (handle[0] || "?").toUpperCase() };
  }

  // `mini` is the hover card: the whole text, no clamp, nothing to press.
  function xpost(nd, mini) {
    var who = String(nd.src || "").replace(/^@/, "");
    var av = avatar(who || "?");
    // X's own counters, as the platform reported them. A zero shows as a bare
    // icon the way X draws it, and a variant with no match to its original
    // shows bare icons throughout rather than a number we would have to guess.
    var m = nd.met;
    var act = function (k, v, label) {
      return '<span class="xact" title="' + (m ? fmt(v) + " " + label : "not recorded for this wording") +
        '">' + xicon(k) + (m && v ? "<span>" + compact(v) + "</span>" : "") + "</span>";
    };
    var acts =
      '<div class="xacts">' +
        act("reply", m && m.reply, "replies") +
        act("rt",    m && m.rt,    "retweets") +
        act("like",  m && m.like,  "likes") +
        act("views", m && m.views, "views") +
        '<span class="xact">' + xicon("save") + "</span>" +
        '<span class="xact">' + xicon("share") + "</span>" +
      "</div>";
    // 05_enrich recovers the original tweet's id for ~70% of wordings, so the
    // date can do what it does on X: be the permalink. The other 30% are
    // wordings whose original was never crawled -- they keep a plain date
    // rather than a link that would 404 in front of someone. Suppressed in
    // mini (hover tooltip) mode, where an anchor is an affordance the pointer
    // can never actually reach. x.com/i/status/<id> resolves even when the
    // handle is missing, so a null src still gets a working link.
    var stamp = esc(dayLabel(nd.t0));
    var when = (!mini && nd.tweet)
      ? '<a class="xdate" href="https://x.com/' + encodeURIComponent(who || "i") +
        "/status/" + encodeURIComponent(nd.tweet) +
        '" target="_blank" rel="noopener noreferrer" title="Open this tweet on X">' +
        "&middot; " + stamp + "</a>"
      : '<span class="xdate">&middot; ' + stamp + "</span>";

    return '<article class="xpost" data-expanded="' + (mini ? "true" : "false") + '">' +
      '<span class="av" style="background:' + av.bg + '" aria-hidden="true">' + esc(av.ch) + "</span>" +
      '<div class="xcol">' +
        '<p class="xhead"><span class="xname">' +
          (who ? "@" + esc(who) : "account not recorded") + "</span>" + when + "</p>" +
        '<p class="xtext">' + esc(detwit(nd.txt)) + "</p>" +
        (mini ? "" : '<button type="button" class="xmore" hidden>Show more</button>') +
        acts +
      "</div></article>";
  }

  // Whether the clamp actually bit can only be known once it is laid out, and
  // an offer to expand something already whole is worse than no offer.
  function initPost(root) {
    var post = root.querySelector(".xpost"), txt = root.querySelector(".xtext"),
        more = root.querySelector(".xmore");
    if (!post || !txt || !more) return;
    more.hidden = txt.scrollHeight - txt.clientHeight < 2;
  }
  function togglePost(post) {
    var open = post.dataset.expanded === "true";
    var from = post.offsetHeight;
    post.dataset.expanded = open ? "false" : "true";
    post.querySelector(".xmore").textContent = open ? "Show more" : "Show less";
    if (REDUCE || !post.animate) return;
    var to = post.offsetHeight;
    if (from === to) return;
    // The clamp is applied the instant the attribute flips, so the card is
    // already the wrong size for its contents; hiding the overflow for the
    // length of the travel keeps the rest of the post from spilling past the
    // rounded edge while the box catches up.
    post.style.overflow = "hidden";
    var run = post.animate([{ height: from + "px" }, { height: to + "px" }],
                           { duration: 260, easing: "cubic-bezier(.32,.72,0,1)" });
    run.onfinish = run.oncancel = function () { post.style.overflow = ""; };
  }

  /* ---------------- inspector ---------------- */

  // Gemini's own mark, drawn rather than fetched -- the page is a single file
  // with no network dependency, and a logo pulled from a CDN would be the one
  // thing on it that can fail in front of a judge. Its gradient is the
  // brand's, so it stays itself on the paper and on the chalkboard instead of
  // following the pen like everything else in the inspector does.
  var GEM_MARK =
    '<svg class="gem-logo" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
    '<linearGradient id="gem-mark-grad" x1="1" y1="23" x2="23" y2="1" gradientUnits="userSpaceOnUse">' +
    '<stop offset="0" stop-color="#4285f4"/><stop offset=".45" stop-color="#9b72cb"/>' +
    '<stop offset="1" stop-color="#d96570"/></linearGradient>' +
    '<path fill="url(#gem-mark-grad)" d="M11.04 19.32Q12 21.51 12 24q0-2.49.93-4.68.96-2.19 ' +
    '2.58-3.81t3.81-2.55Q21.51 12 24 12q-2.49 0-4.68-.93a12.3 12.3 0 0 1-3.81-2.58 12.3 12.3 ' +
    '0 0 1-2.58-3.81Q12 2.49 12 0q0 2.49-.96 4.68-.93 2.19-2.55 3.81a12.3 12.3 0 0 1-3.81 ' +
    '2.58Q2.49 12 0 12q2.49 0 4.68.96 2.19.93 3.81 2.55t2.55 3.81"/></svg>';

  function renderInspector() {
    var n = state.nodes[state.sel]; if (!n) return;
    var el = $("#inspector"); if (!el) return;
    var T = state.topo;
    var isRoot = n.p === null || n.p === undefined;
    var coord = n.acc ? n.co / n.acc : 0;
    var add = (n.add || []).map(function (t) { return '<span class="tok add">+' + esc(t) + "</span>"; }).join("");
    var del = (n["del"] || []).map(function (t) { return '<span class="tok del">' + esc(t) + "</span>"; }).join("");

    var mutation = isRoot
      ? '<p class="mut"><span class="lbl">earliest phrasing in the corpus &mdash; the root of this lineage</span></p>'
      : '<p class="mut"><span class="lbl">changed from ' + T.label[n.p] + "</span>" + add + del +
        (add || del ? "" : '<span class="tok">wording only</span>') +
        '<span class="lbl">' + Math.round(n.sim * 100) + "% of the words kept</span>" +
        (n.leaf ? '<span class="lbl">lower-confidence attached leaf; it cannot join lineages</span>' : "") +
        "</p>";

    // Every relation the diagram draws is a word you can click.
    var kids = T.kids[state.sel];
    var sibs = isRoot ? [] : T.kids[n.p].filter(function (k) { return k !== state.sel; });
    var more = function (rest) { return rest > 0 ? '<button disabled>+' + rest + " more</button>" : ""; };
    // The chips that lead somewhere come first and the one that reports an
    // absence comes last, so a dead end never sits between two live links.
    var rels = '<p class="rels"><span class="lbl">relations</span>' +
      (isRoot ? "<button disabled>root</button>" : relChip("parent", n.p)) +
      kids.slice(0, 8).map(function (k) { return relChip("child", k); }).join("") + more(kids.length - 8) +
      sibs.slice(0, 6).map(function (k) { return relChip("sibling", k); }).join("") + more(sibs.length - 6) +
      (kids.length ? "" : "<button disabled>no surviving children</button>") +
      "</p>";

    // Only the flags that are actually raised. An unlit warning is noise.
    var fl = [];
    // Two different things used to be reported as one number. A lookalike
    // character sitting inside an otherwise Latin word is evasion and very
    // little else; a wholly styled headline is typography. Only the first
    // is worth raising.
    if (n.mix > 0) {
      fl.push(n.mix + " word" + (n.mix > 1 ? "s" : "") +
              " mix scripts \u2014 a lookalike character inside a Latin word, which " +
              "reads normally and misses a keyword filter");
    } else if (n.obf > 3) {
      fl.push(n.obf + " styled characters (math-bold and similar) \u2014 defeats a naive " +
              "keyword match, but reads as decoration here");
    }
    if (coord > 0.15) fl.push("coordinated accounts present");

    // Replies were the obvious place to look for the audience and the wrong
    // one: they are ~2% of this corpus. Quote tweets are commentary too, they
    // are four times as numerous, and `quoting_id` points straight at the
    // tweet being answered -- which is why `cmt` reaches 39,656 wordings where
    // the reply-only pass reached 9,922. Both are carried, never merged.
    var comments = commentBlock(n.cmt, state.famId, n.met && n.met.reply);
    var gem = '<section class="gem" id="gemini-analysis" aria-live="polite">' +
      '<h4>Gemini reading</h4>' +
      '<button type="button" id="gem-run">' + GEM_MARK +
        '<span id="gem-label">Call Gemini</span></button>' +
      '<p id="gem-result"></p></section>';
    var deadends = deadEndBlock(n);

    el.innerHTML =
      "<h3>Wording " + T.label[state.sel] + "</h3><span>generation " + n.d +
        " &middot; first seen " + esc(hourLabel(n.t0)) + "</span>" +
      xpost(n) + mutation + rels +
      '<p class="figs"><b>' + fmt(n.n) + "</b> retweets seen in this crawl &middot; <b>" + fmt(n.acc) + "</b> accounts &middot; <b>" +
        fmt(n.sub) + "</b> counting everything descended from it &middot; <b>" + Math.round(n.drift * 100) +
        "%</b> drift &middot; <b>" + Math.round(coord * 100) + "%</b> coordinated" +
        (n.src ? " &middot; amplifies @" + esc(n.src) : "") + "</p>" +
      comments +
      gem +
      deadends +
      (fl.length
        ? '<p class="flags' + (n.mix > 0 ? "" : " mild") + '">' + fl.join(" &middot; ") + "</p>"
        : "");
    initPost(el);
    Array.prototype.forEach.call(el.querySelectorAll(".reply-excerpts"), animateDetails);
    replay(el, "swap");
    var ask = $("#gem-run");
    if (ask) ask.addEventListener("click", requestAnalysis);
  }

  function requestAnalysis() {
    var n = state.nodes[state.sel], f = state.fam, button = $("#gem-run"),
        label = $("#gem-label"), out = $("#gem-result");
    if (!n || !f || !button || !label || !out) return;
    button.disabled = true;
    label.textContent = "Reading the wording...";
    out.className = "";
    out.textContent = "Gemini is reading this wording against the figures above.";
    // The parent wording and the token diff are what make this a reading of a
    // mutation rather than of an isolated sentence -- without them the model
    // can only describe the text, not what changed when it was copied.
    var parent = n.p != null && state.nodes[n.p] ? state.nodes[n.p] : null;
    var payload = {
      lineage_id: f.id,
      wording: detwit(n.txt || n.text || ""),
      parent_wording: parent ? detwit(parent.txt || parent.text || "") : null,
      tokens_added: n.add || [],
      tokens_dropped: n["del"] || [],
      root: detwit(f.root || ""),
      topics: f.topics || [],
      spread: {
        kind: f.kind,
        why: f.why || [],
        coordination_share: f.coord_share,
        accounts: n.acc,
        retweets_seen: n.n,
        drift: n.drift,
        comments: n.cmt ? n.cmt.n : 0,
        comment_stance: n.cmt ? n.cmt.st : {}
      }
    };
    fetch("/api/analyze", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
    }).then(function (r) {
      return r.json().then(function (body) { if (!r.ok) throw new Error(body.error || "analysis unavailable"); return body; });
    }).then(function (review) {
      out.innerHTML = esc(String(review.analysis || "No reading returned.")) +
        '<span class="conf">Gemini’s confidence in this reading: ' +
        Math.round(Number(review.confidence || 0) * 100) + "%</span>";
    }).catch(function (error) {
      out.className = "gem-error";
      out.textContent = error.message + ". Set GEMINI_API_KEY and restart ./run.sh serve.";
    }).finally(function () {
      button.disabled = false;
      label.textContent = "Call Gemini";
    });
  }
  // Every wording on this tree spread at least twice -- that is what stage 4's
  // MIN_COPIES=2 buys, and it is also survivorship bias built into the sample:
  // the tree shows which phrasings won and can never show what they beat.
  // 07_deadends.py goes back to the once-only messages and finds the
  // rewordings of this phrasing that nobody ever repeated. They are not nodes
  // -- they have no spread and no descendants, so there is nothing to draw --
  // but they are the denominator the visible mutations were selected against,
  // which is the whole reason a lineage is a claim about selection and not
  // just a similarity diagram.
  function deadEndBlock(n) {
    if (!n.dx) return "";
    var ex = n.dxs || [];
    return '<p class="figs"><b>' + fmt(n.dx) + "</b> rewording" + (n.dx === 1 ? "" : "s") +
      " of this phrasing " + (n.dx === 1 ? "was" : "were") + " posted once and never " +
      "copied &mdash; mutations that did not take</p>" +
      (ex.length
        ? '<details class="reply-excerpts"><summary>' +
          (ex.length === 1 ? "read one" : "read " + ex.length + " of them") + "</summary>" +
          ex.map(function (t) {
            return "<blockquote><p>" + esc(detwit(t)) + "</p></blockquote>";
          }).join("") + "</details>"
        : "");
  }

  /* ---------------- comment ecology ---------------- */

  // Order runs endorse -> dispute so the bar reads as one polarity axis, with
  // the two no-position classes parked at the end.
  var STANCE = ["endorse", "dispute", "mock", "attack", "question", "promo", "none"];
  var STANCE_TXT = {
    endorse:  "endorses",
    dispute:  "disputes",
    mock:     "mocks",
    attack:   "hostile",
    question: "asks",
    promo:    "promo",
    none:     "no stance cue"
  };
  // Tone is VADER's polarity, bucketed. It is a second axis and not a finer
  // stance: most comments carry no stance cue at all, and tone is the only
  // thing that can be said about those. Same two hues as the stance bar
  // because both run favourable -> unfavourable, and each bar is labelled.
  var TONE = ["pos", "neu", "neg"];
  var TONE_TXT = { pos: "positive", neu: "neutral", neg: "negative" };

  function stanceTotal(st) {
    return STANCE.reduce(function (a, k) { return a + (st[k] || 0); }, 0);
  }

  // A stacked bar plus a key that names and counts every segment. The key is
  // not decoration: it is what keeps the split readable when the colours are
  // not, so it is always rendered and never collapsed behind a hover.
  function mixBar(mix, order, labels, prefix, caption) {
    var total = order.reduce(function (a, k) { return a + (mix[k] || 0); }, 0);
    if (!total) return "";
    var segs = "", key = "";
    order.forEach(function (k) {
      var v = mix[k] || 0; if (!v) return;
      var pct = Math.round(100 * v / total);
      segs += '<span class="' + prefix + k + '" style="flex:' + v + '"><title>' +
              labels[k] + " " + fmt(v) + " (" + pct + "%)</title></span>";
      key += '<li><i class="' + prefix + k + '"></i>' + labels[k] +
             " <b>" + pct + "%</b></li>";
    });
    var read = order.filter(function (k) { return mix[k]; }).map(function (k) {
      return labels[k] + " " + Math.round(100 * mix[k] / total) + "%";
    }).join(", ");
    return '<div class="stance"><p class="blab">' + caption + '</p>' +
      '<div class="sbar" role="img" aria-label="' + caption + ": " + read + '">' +
      segs + '</div><ul class="skey">' + key + "</ul></div>";
  }

  // Two bars, never merged: what the comment does to the claim, and how the
  // wording reads. A comment with no stance cue still has a tone, which is
  // the whole reason the second bar exists.
  function stanceBar(st, tn) {
    return mixBar(st, STANCE, STANCE_TXT, "s-", "stance toward the wording") +
           (tn ? mixBar(tn, TONE, TONE_TXT, "t-", "tone of the wording") : "");
  }

  // `cl` is [[clusterId, countOnThisNode], ...]. The count shown is the local
  // one; `acc` and `nfam` come off the shared cluster, because how far a
  // template reaches is a property of the template and not of this node.
  function clusterList(cl, famId) {
    if (!cl || !cl.length) return "";
    var items = cl.map(function (pair) {
      var c = CLUSTERS[pair[0]];
      if (!c) return "";
      var others = c.nfam - (famId != null && c.fams.indexOf(famId) >= 0 ? 1 : 0);
      // Reach only means something for a distinctive wording. A cluster of
      // common speech turning up under thirty lineages is a fact about
      // English, so it is labelled as such instead of being sold as spread.
      var reach = c.gen
        ? "common phrasing"
        : others > 0
          ? '<span class="spans">also under ' + fmt(others) + " other lineage" +
            (others === 1 ? "" : "s") + "</span>"
          : "only this lineage";
      return "<li><span class=\"cn\">" + fmt(pair[1]) + "\u00d7</span> " +
        esc(detwit(String(c.sample[0] || "")).slice(0, 130)) +
        '<span class="cmeta">' + fmt(c.acc) + " account" + (c.acc === 1 ? "" : "s") +
        " \u00b7 " + reach + (c.reuse ? ' \u00b7 <b class="cib">reused template</b>' : "") +
        "</span></li>";
    }).join("");
    return items ? '<ul class="cmt-cl">' + items + "</ul>" : "";
  }

  // The two comment kinds are never added into one number without saying so:
  // a quote tweet is public commentary with its own audience, a reply is a
  // response inside the thread, and the ratio between them is itself a
  // reading of how the wording travelled.
  // A silhouette, because nobody's face was collected and nobody's should be
  // guessed at. Drawn filled rather than stroked, like X's own placeholder.
  var XAV = "M12 11.7a3.9 3.9 0 1 0 0-7.8 3.9 3.9 0 0 0 0 7.8zm0 1.6c-3.5 0-6.3 " +
            "2.2-6.3 4.9v2.3h12.6v-2.3c0-2.7-2.8-4.9-6.3-4.9z";

  // A captured comment, drawn in the same card as the wording it answers --
  // it is a tweet too, and reading a reply as a paragraph of quoted text
  // loses that it was posted by somebody, at a time, with an audience.
  //
  // Two things here are deliberately not X's, because the data cannot back
  // them. The name line: this corpus carries no handle, bio or avatar for a
  // *posting* account. The handles the project does have are recovered out of
  // `RT @handle:` bodies and belong to the account being amplified, never to
  // the one answering -- so the card says the account was not recorded and
  // the avatar stays a silhouette. Its tint is a hash of the author id, which
  // is the one honest thing the card can say about identity: two comments
  // from the same account come out the same colour, and nobody is handed a
  // name they did not have. And the footer line: stance and tone are this
  // project's reading of the text, not figures X reported, so they sit under
  // a rule and outside the action row, which is reserved for the platform's
  // own counters.
  function xcomment(r) {
    // Likes are the only counter the firehose carried for a comment, so the
    // other icons stay bare. A zero shows as a bare heart the way X draws it,
    // but it is still a reading and says so on hover -- the bare icons around
    // it are a different claim, which is that nothing was ever recorded.
    var bare = function (k) {
      return '<span class="xact" title="not recorded for this comment">' + xicon(k) + "</span>";
    };
    var likes = '<span class="xact" title="' + fmt(r.like || 0) +
      ' likes when captured">' + xicon("like") +
      (r.like ? "<span>" + compact(r.like) + "</span>" : "") + "</span>";
    // Same rule as the wording above it: the date is the permalink, and
    // x.com/i/status/<id> resolves without a handle. An export that predates
    // the timestamp simply shows no date rather than an invented one.
    var when = r.t == null
      ? ""
      : r.id
        ? '<a class="xdate" href="https://x.com/i/status/' + encodeURIComponent(r.id) +
          '" target="_blank" rel="noopener noreferrer" title="Open this comment on X">' +
          "&middot; " + esc(dayLabel(r.t)) + "</a>"
        : '<span class="xdate">&middot; ' + esc(dayLabel(r.t)) + "</span>";

    return '<article class="xpost xcmt" data-expanded="true">' +
      '<span class="av" style="background:hsl(' + (r.hue == null ? 210 : r.hue) +
        ' 48% 44%)" aria-hidden="true">' +
        '<svg viewBox="0 0 24 24" fill="currentColor"><path d="' + XAV + '"/></svg>' +
      "</span>" +
      '<div class="xcol">' +
        '<p class="xhead"><span class="xname xanon">account not recorded</span>' + when +
          '<span class="xkind">' + (r.q ? "quote tweet" : "reply") + "</span></p>" +
        '<p class="xtext">' + esc(detwit(r.txt)) + "</p>" +
        '<div class="xacts">' +
          bare("reply") + bare("rt") + likes + bare("views") +
          '<span class="xact">' + xicon("save") + "</span>" +
          '<span class="xact">' + xicon("share") + "</span>" +
        "</div>" +
        '<p class="xnote">' +
          (r.st === "none" || !r.st ? "no stance cue" : "scored <b>" + STANCE_TXT[r.st] + "</b>") +
          (r.tn ? " &middot; <b>" + TONE_TXT[r.tn] + "</b> tone" : "") +
        "</p>" +
      "</div></article>";
  }

  function commentBlock(c, famId, xReplies) {
    if (!c) {
      return xReplies
        ? '<p class="figs">X reports <b>' + fmt(xReplies) +
          "</b> replies, but none were captured against this wording.</p>"
        : "";
    }
    var replies = c.n - c.q;
    return '<p class="figs"><b>' + fmt(c.n) + "</b> comment" + (c.n === 1 ? "" : "s") +
      " captured \u00b7 <b>" + fmt(c.q) + "</b> quote tweet" + (c.q === 1 ? "" : "s") +
      " \u00b7 <b>" + fmt(replies) + "</b> repl" + (replies === 1 ? "y" : "ies") +
      " \u00b7 <b>" + fmt(c.acc) + "</b> responding account" + (c.acc === 1 ? "" : "s") +
      (xReplies ? " \u00b7 X reports <b>" + fmt(xReplies) +
                  "</b> replies in total; this is the captured subset" : "") +
      "</p>" + stanceBar(c.st, c.tn) + clusterList(c.cl, famId) +
      (c.sample && c.sample.length
        ? '<details class="reply-excerpts"><summary>read ' + c.sample.length +
          " captured comment" + (c.sample.length === 1 ? "" : "s") + "</summary>" +
          c.sample.map(function (r) { return xcomment(r); }).join("") + "</details>"
        : "");
  }

  function relChip(kind, i) {
    return "<button data-i=\"" + i + '">' + kind + " " + state.topo.label[i] + "</button>";
  }

  /* ---------------- the inspector dock ----------------

     Three readings of the same lineage, one showing at a time, in a panel
     docked under the board rather than an accordion that pushes it away:

       wordings  -- every node as a row. Colour and area are the diagram's
                    encodings, so this is the same lineage as numbers and
                    nothing on the page is readable only as a colour.
       metadata  -- the whole record of the selected wording. The slide-in
                    panel reads that node as a tweet and a sentence about it;
                    this reads it as fields, including the ones the sentence
                    has no room for.
       drift     -- how far the rewording has travelled, as a distribution
                    and as a curve over generations, which is the question
                    the tree is drawn to ask. */

  var DOCK_TABS = [
    { id: "wordings", label: "Wordings" },
    { id: "meta",     label: "Node Metadata" },
    { id: "drift",    label: "Drift Analytics" }
  ];

  function renderDock() {
    var tabs = DOCK_TABS.map(function (t) {
      var on = t.id === state.dockTab;
      return '<button type="button" role="tab" id="dtab-' + t.id + '" data-tab="' + t.id +
        '" aria-selected="' + on + '" aria-controls="dpane-' + t.id +
        '" tabindex="' + (on ? "0" : "-1") + '">' + t.label +
        (t.id === "wordings" ? '<span class="dock-n">' + state.nodes.length + "</span>" : "") +
        "</button>";
    }).join("");

    var panes = DOCK_TABS.map(function (t) {
      return '<div class="dock-pane" role="tabpanel" id="dpane-' + t.id + '" data-pane="' + t.id +
        '" aria-labelledby="dtab-' + t.id + '" tabindex="0"' +
        (t.id === state.dockTab ? "" : " hidden") + ">" + dockPane(t.id) + "</div>";
    }).join("");

    return '<section class="dock" id="dock" data-open="' + state.dockOpen +
        '" aria-label="Lineage inspector"' +
        (state.dockHeight !== null ? ' style="--dock-h:' + Math.round(state.dockHeight) + 'px"' : "") + '>' +
      '<div class="dock-resize" id="dockresize" role="separator" aria-orientation="horizontal" ' +
        'aria-label="Resize lineage inspector" aria-valuemin="0" ' +
        'aria-valuenow="' + Math.round(state.dockHeight !== null ? state.dockHeight : 274) +
        '" tabindex="0"></div>' +
      '<div class="dock-bar">' +
        '<div class="dock-tabs" role="tablist" aria-label="Inspector views">' + tabs + "</div>" +
        '<div class="dock-tools">' +
          '<p class="dock-sel" id="docksel"></p>' +
          '<button class="fold" id="docktoggle" type="button" aria-expanded="' + state.dockOpen +
            '" aria-controls="dock-body" title="' + (state.dockOpen ? "Minimize" : "Expand") +
            ' the inspector"><svg width="13" height="13" viewBox="0 0 13 13" aria-hidden="true"><path ' +
            'd="M2 4.5 6.5 9 11 4.5" fill="none" stroke="currentColor" stroke-width="1.6" ' +
            'stroke-linecap="round" stroke-linejoin="round"/></svg><span class="vh" id="docktoggletext">' +
            (state.dockOpen ? "Minimize" : "Expand") + " the inspector</span></button>" +
        "</div>" +
      "</div>" +
      '<div class="dock-body" id="dock-body">' + panes + "</div>" +
    "</section>";
  }
  function dockPane(id) {
    return id === "wordings" ? paneWordings()
         : id === "meta"     ? paneMeta()
         :                     paneDrift();
  }

  /* ---- pane: every wording as a row ---- */

  function paneWordings() {
    var T = state.topo, nodes = state.nodes;
    var rows = T.order.map(function (i) {
      var n = nodes[i];
      return '<tr data-i="' + i + '" aria-current="' + (i === state.sel) + '">' +
        '<td class="k">' + T.label[i] + "</td><td>" + n.d + "</td><td>" +
        (n.p === null || n.p === undefined ? "\u2014" : T.label[n.p]) + "</td><td>" +
        fmt(n.n) + "</td><td>" + fmt(n.acc) + "</td><td>" + fmt(n.cmt && n.cmt.n || 0) + "</td><td>" +
        (n.acc ? Math.round(n.co / n.acc * 100) : 0) + "%</td><td>" +
        Math.round(n.drift * 100) + "%</td><td>" + esc(hourLabel(n.t0)) + "</td>" +
        '<td class="txt"><span>' + esc(detwit(n.txt)) + "</span></td></tr>";
    }).join("");
    return '<table id="vartable">' +
      "<thead><tr><th>node</th><th>generation</th><th>from</th><th>retweets</th><th>accounts</th><th>comments</th>" +
      "<th>coord.</th><th>drift</th><th>first seen</th><th>text</th></tr></thead><tbody>" +
      rows + "</tbody></table>";
  }

  /* ---- pane: the selected wording, as fields ---- */

  function paneMeta() {
    var n = state.nodes[state.sel]; if (!n) return '<p class="dock-empty">No wording selected.</p>';
    var T = state.topo, isRoot = n.p === null || n.p === undefined;
    var kids = T.kids[state.sel] || [];
    var coord = n.acc ? n.co / n.acc : 0;
    var cmt = n.cmt, m = n.met;
    var out = [];
    var row = function (k, v, dim) {
      out.push("<div><dt>" + k + '</dt><dd' + (dim ? ' class="dim"' : "") + ">" + v + "</dd></div>");
    };
    var none = '<span class="dim">not recorded</span>';

    row("node", T.label[state.sel]);
    row("generation", isRoot ? "0 — root" : String(n.d));
    row("parent", isRoot ? "—" : T.label[n.p]);
    row("children", kids.length ? kids.map(function (k) { return T.label[k]; }).join(", ") : "none, a dead end");
    row("first seen", esc(hourLabel(n.t0)));
    row("posted by", n.src ? "@" + esc(String(n.src).replace(/^@/, "")) : none);
    row("retweets in crawl", fmt(n.n));
    row("distinct accounts", fmt(n.acc));
    row("subtree total", fmt(n.sub));
    row("coordinated accounts", fmt(n.co) + " (" + Math.round(coord * 100) + "%)",
        coord <= 0.15);
    row("drift from root", Math.round(n.drift * 100) + "%");
    row("words kept from parent", isRoot ? "—" : Math.round(n.sim * 100) + "%");
    row("attachment", n.leaf ? "lower-confidence leaf" : (isRoot ? "root of the lineage" : "strict match"),
        !n.leaf);
    row("after the 1 Sep cliff", n.t0 >= META.cliff_h ? "yes — spread undercounted ~15×" : "no",
        n.t0 < META.cliff_h);
    row("mixed-script words", n.mix > 0 ? String(n.mix) : "0", !n.mix);
    row("styled characters", n.obf > 0 ? String(n.obf) : "0", !n.obf);
    row("comments captured", cmt && cmt.n
        ? fmt(cmt.n) + " (" + fmt(cmt.q) + " quote tweets, " + fmt(cmt.n - cmt.q) + " replies)"
        : none, !(cmt && cmt.n));
    row("X replies / retweets", m ? fmt(m.reply || 0) + " / " + fmt(m.rt || 0) : none, !m);
    row("X likes / views", m ? fmt(m.like || 0) + " / " + fmt(m.views || 0) : none, !m);

    var add = (n.add || []).map(function (t) { return '<span class="tok add">+' + esc(t) + "</span>"; }).join(" ");
    var del = (n["del"] || []).map(function (t) { return '<span class="tok del">' + esc(t) + "</span>"; }).join(" ");
    row("words added", add || (isRoot ? "—" : "none"), !add);
    row("words dropped", del || (isRoot ? "—" : "none"), !del);

    return "<h4>Wording " + T.label[state.sel] + "</h4>" +
      '<dl class="meta-grid">' + out.join("") + "</dl>" +
      '<p class="meta-txt">' + esc(detwit(n.txt)) + "</p>";
  }

  /* ---- pane: the lineage's rewording ---- */

  function paneDrift() {
    var nodes = state.nodes, T = state.topo;
    var ds = nodes.map(function (n) { return n.drift; }).slice().sort(function (a, b) { return a - b; });
    var mean = ds.reduce(function (a, b) { return a + b; }, 0) / (ds.length || 1);
    var med = ds.length ? ds[Math.floor(ds.length / 2)] : 0;
    var kept = nodes.filter(function (n) { return !(n.p === null || n.p === undefined); })
                    .map(function (n) { return n.sim; });
    var keptMean = kept.length ? kept.reduce(function (a, b) { return a + b; }, 0) / kept.length : 1;
    var reworded = nodes.filter(function (n) { return n.drift >= 0.5; }).length;

    var pct = function (v) { return Math.round(v * 100) + "%"; };
    var figs =
      '<div class="an-figs">' +
        "<div><b>" + pct(mean) + "</b> mean drift</div>" +
        "<div><b>" + pct(med) + "</b> median</div>" +
        "<div><b>" + pct(ds[ds.length - 1] || 0) + "</b> furthest</div>" +
        "<div><b>" + pct(keptMean) + "</b> mean words kept per step</div>" +
        "<div><b>" + reworded + "</b> of " + nodes.length + " past halfway from the root</div>" +
      "</div>";

    // The rows are ranked, so they are ordered by the number and read as a
    // ranking; the board keeps the colour.
    var top = nodes.map(function (n, i) { return i; })
      .sort(function (a, b) { return nodes[b].drift - nodes[a].drift; })
      .slice(0, 6)
      .map(function (i) {
        var n = nodes[i];
        return '<button type="button" data-i="' + i + '" aria-current="' + (i === state.sel) + '">' +
          '<span class="k">' + T.label[i] + '</span><span class="v">' + pct(n.drift) +
          '</span><span class="t">' + esc(detwit(n.txt)) + "</span></button>";
      }).join("");

    return figs +
      '<div class="an-charts">' +
        '<div class="an-chart"><h4>Wordings by distance from the root</h4>' +
          '<svg id="an-dist" role="img" aria-label="How many wordings fall in each ten-percent band of drift from the root"></svg></div>' +
        '<div class="an-chart"><h4>Mean drift by generation</h4>' +
          '<svg id="an-gen" role="img" aria-label="Mean drift from the root at each generation of the lineage"></svg></div>' +
      "</div>" +
      "<h4>Furthest from the root</h4>" +
      '<div class="an-top">' + top + "</div>";
  }

  // Both charts carry one series, so the heading names it and no legend is
  // needed. The bars wear the board's own drift wash, so a band of the
  // histogram and a circle on the tree at the same drift are the same colour.
  function drawDockCharts() {
    if (!state.dockOpen || state.dockTab !== "drift") return;
    drawDriftDist();
    drawDriftGen();
  }
  function drawDriftDist() {
    var svg = $("#an-dist"); if (!svg) return;
    var W = svg.clientWidth, H = 112;
    if (W < 140) return;
    var bins = [], i;
    for (i = 0; i < 10; i++) bins.push(0);
    state.nodes.forEach(function (n) {
      bins[Math.max(0, Math.min(9, Math.floor(n.drift * 10)))]++;
    });
    var mx = Math.max.apply(null, bins) || 1;
    var padL = 2, padR = 2, base = H - 21, top = 16;
    var bw = (W - padL - padR) / 10;
    var peak = bins.indexOf(mx);
    var bars = bins.map(function (c, i) {
      var h = c / mx * (base - top);
      var x = padL + i * bw, y = base - h;
      var lab = (i * 10) + "–" + (i * 10 + 10) + "% drift";
      return (c
        ? '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + Math.max(1, bw - 2).toFixed(1) +
          '" height="' + h.toFixed(1) + '" fill="' + rampColor((i + 0.5) / 10, "drift") + '"><title>' +
          c + " wording" + (c === 1 ? "" : "s") + ", " + lab + "</title></rect>"
        : '<rect x="' + x.toFixed(1) + '" y="' + (base - 1.5) + '" width="' + Math.max(1, bw - 2).toFixed(1) +
          '" height="1.5" fill="' + css("--hair") + '"><title>no wordings, ' + lab + "</title></rect>") +
        (i === peak && c
          ? '<text x="' + (x + (bw - 2) / 2).toFixed(1) + '" y="' + (y - 5).toFixed(1) +
            '" font-size="11.5" text-anchor="middle" fill="' + css("--ink-2") + '">' + c + "</text>"
          : "");
    }).join("");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.innerHTML = bars +
      '<line x1="' + padL + '" y1="' + base + '" x2="' + (W - padR) + '" y2="' + base +
        '" stroke="' + css("--rule") + '" stroke-width="1"/>' +
      '<text x="' + padL + '" y="' + (H - 6) + '" font-size="11.5" fill="' + css("--ink-2") + '">identical</text>' +
      '<text x="' + (W - padR) + '" y="' + (H - 6) + '" font-size="11.5" text-anchor="end" fill="' +
        css("--ink-2") + '">fully reworded</text>';
  }
  function drawDriftGen() {
    var svg = $("#an-gen"); if (!svg) return;
    var W = svg.clientWidth, H = 112;
    if (W < 140) return;
    var sum = [], cnt = [], maxD = 0;
    state.nodes.forEach(function (n) {
      var d = n.d;
      maxD = Math.max(maxD, d);
      sum[d] = (sum[d] || 0) + n.drift;
      cnt[d] = (cnt[d] || 0) + 1;
    });
    var padL = 32, padR = 6, base = H - 21, top = 14;
    var X = function (d) { return padL + (maxD ? d / maxD : 0.5) * (W - padL - padR); };
    var Y = function (v) { return base - v * (base - top); };
    var pts = [], dots = "";
    for (var d = 0; d <= maxD; d++) {
      if (!cnt[d]) continue;
      var v = sum[d] / cnt[d], x = X(d), y = Y(v);
      pts.push(x.toFixed(1) + "," + y.toFixed(1));
      // A 2px surface ring keeps the dots legible where the curve doubles back
      // on itself and they overlap.
      dots += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="4" fill="' + css("--pen") +
        '" stroke="' + css("--paper") + '" stroke-width="2"><title>generation ' + d + ": " +
        Math.round(v * 100) + "% mean drift across " + cnt[d] + " wording" + (cnt[d] === 1 ? "" : "s") +
        "</title></circle>";
    }
    var grid = [0, 0.5, 1].map(function (v) {
      return '<line x1="' + padL + '" y1="' + Y(v) + '" x2="' + (W - padR) + '" y2="' + Y(v) +
        '" stroke="' + css(v ? "--hair" : "--rule") + '" stroke-width="1"/>' +
        '<text x="' + (padL - 6) + '" y="' + (Y(v) + 4) + '" font-size="11.5" text-anchor="end" fill="' +
        css("--ink-2") + '">' + Math.round(v * 100) + "%</text>";
    }).join("");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.innerHTML = grid +
      (pts.length > 1
        ? '<polyline points="' + pts.join(" ") + '" fill="none" stroke="' + css("--pen") +
          '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
        : "") + dots +
      '<text x="' + padL + '" y="' + (H - 6) + '" font-size="11.5" fill="' + css("--ink-2") + '">gen 0</text>' +
      '<text x="' + (W - padR) + '" y="' + (H - 6) + '" font-size="11.5" text-anchor="end" fill="' +
        css("--ink-2") + '">gen ' + maxD + "</text>";
  }

  function syncDockResize() {
    var handle = $("#dockresize"), body = $("#dock-body");
    if (!handle || !body) return;
    var height = Math.round(body.getBoundingClientRect().height);
    handle.setAttribute("aria-valuemin", "0");
    handle.removeAttribute("aria-valuemax");
    handle.setAttribute("aria-valuenow", String(height));
    handle.setAttribute("aria-valuetext", height + " pixels tall");
  }
  function setDockHeight(height) {
    // The pointer is the only upper bound: the reader can devote the whole
    // stage to analysis or pull the body all the way down to its tab bar.
    height = Math.max(0, Math.round(height));
    state.dockHeight = height;
    var dock = $("#dock");
    if (dock) dock.style.setProperty("--dock-h", height + "px");
    syncDockResize();
    drawDockCharts();
  }
  function wireDockResize(dock) {
    var handle = $("#dockresize"), body = $("#dock-body"), drag = null;
    if (!dock || !handle || !body) return;
    syncDockResize();
    handle.addEventListener("pointerdown", function (e) {
      if (e.button !== 0 || !state.dockOpen) return;
      e.preventDefault();
      drag = { id:e.pointerId, y:e.clientY, height:body.getBoundingClientRect().height };
      handle.setPointerCapture(e.pointerId);
      dock.classList.add("resizing");
    });
    handle.addEventListener("pointermove", function (e) {
      if (!drag || e.pointerId !== drag.id) return;
      setDockHeight(drag.height + drag.y - e.clientY);
    });
    var finish = function (e) {
      if (!drag || e.pointerId !== drag.id) return;
      if (handle.hasPointerCapture && handle.hasPointerCapture(e.pointerId)) {
        handle.releasePointerCapture(e.pointerId);
      }
      drag = null;
      dock.classList.remove("resizing");
    };
    handle.addEventListener("pointerup", finish);
    handle.addEventListener("pointercancel", finish);
    // The separator has the same range semantics for a keyboard reader.
    handle.addEventListener("keydown", function (e) {
      var height = body.getBoundingClientRect().height, next;
      if (e.key === "ArrowUp" || e.key === "ArrowRight") next = height + 20;
      else if (e.key === "ArrowDown" || e.key === "ArrowLeft") next = height - 20;
      else if (e.key === "Home") next = 0;
      else return;
      e.preventDefault();
      setDockHeight(next);
    });
  }

  // Selecting a circle is the dock's input: the row highlights, the field list
  // is rewritten and the ranking marks its entry. Only the visible pane is
  // rebuilt -- the other two are rebuilt when they are opened.
  function syncDock() {
    var sel = state.sel, T = state.topo;
    var lab = $("#docksel");
    if (lab) {
      lab.innerHTML = "selected <b>" + (T ? T.label[sel] : "—") + "</b>";
    }
    var t = $("#vartable");
    if (t) {
      Array.prototype.forEach.call(t.querySelectorAll("tr[data-i]"), function (tr) {
        tr.setAttribute("aria-current", String(+tr.dataset.i === sel));
      });
    }
    if (state.dockTab === "meta") {
      var pane = $('#dpane-meta'); if (pane) pane.innerHTML = paneMeta();
    } else if (state.dockTab === "drift") {
      var top = $(".an-top");
      if (top) Array.prototype.forEach.call(top.querySelectorAll("button[data-i]"), function (b) {
        b.setAttribute("aria-current", String(+b.dataset.i === sel));
      });
    }
  }
  function showDockTab(id) {
    if (state.dockTab === id && state.dockOpen) return;
    state.dockTab = id;
    DOCK_TABS.forEach(function (t) {
      var tab = $("#dtab-" + t.id), pane = $("#dpane-" + t.id), on = t.id === id;
      if (!tab || !pane) return;
      tab.setAttribute("aria-selected", String(on));
      tab.tabIndex = on ? 0 : -1;
      pane.hidden = !on;
      // Metadata and analytics are about the current selection, so they are
      // built at the moment they are opened rather than kept in step while
      // hidden.
      if (on && t.id !== "wordings") pane.innerHTML = dockPane(t.id);
    });
    if (!state.dockOpen) setDock(true);
    drawDockCharts();
  }
  function setDock(open) {
    state.dockOpen = open;
    var d = $("#dock"), b = $("#docktoggle");
    if (!d || !b) return;
    d.dataset.open = String(open);
    b.setAttribute("aria-expanded", String(open));
    b.title = (open ? "Minimize" : "Expand") + " the inspector";
    $("#docktoggletext").textContent = b.title;
    if (open) { syncDockResize(); drawDockCharts(); }
  }

  function openPanel()  { setPanel(true); }
  function closePanel() { setPanel(false); }
  function setPanel(on) {
    var p = $("#panel");
    p.classList.toggle("on", on);
    p.setAttribute("aria-hidden", String(!on));
    $("#sheet").dataset.panel = on ? "open" : "closed";
  }
  // `open` is passed by everything a person can click or key. Switching family
  // selects the root silently, which should not throw a panel over the board.
  function selectNode(i, open) {
    state.sel = i; restyle(); paint(); renderInspector(); syncDock();
    if (open) openPanel();
  }

  /* ---------------- stage ---------------- */

  function boardLabel() {
    return state.xMode === "tree"
      ? "Mutation tree as a rooted tree, one generation per row. Drag to pan, scroll to zoom, " +
        "drag a circle to pull it off its spring. Arrow keys move to the parent, a child or a sibling."
      : "Mutation tree with time running from top to bottom. Drag to pan, scroll to zoom, drag a circle to pull it off " +
        "its spring. Arrow keys move to the parent, a child or a sibling.";
  }

  // A column rather than the band it used to be, so every mark gets its own
  // line and its own drawing: on one row the two marks that carry no swatch
  // read as leftover prose beside the ones that do.
  function renderKey() {
    var f = state.fam, ml = METRIC_LABEL[state.colorBy];
    var ramp = RAMPS[state.colorBy];
    var wash = ramp.map(function (v) { return '<i style="background:' + css(v) + '"></i>'; }).join("");
    // The size mark borrows the wash's own midpoint, so it reads as the same
    // circle the board draws rather than as a second colour language.
    var mid = css(ramp[Math.floor(ramp.length / 2)]);

    var marks = [
      '<svg width="20" height="15" aria-hidden="true"><circle cx="4" cy="9.5" r="2.5" fill="' + mid +
        '" stroke="' + css("--ink-2") + '" stroke-width=".8"/><circle cx="14" cy="7.5" r="5.5" fill="' + mid +
        '" stroke="' + css("--ink-2") + '" stroke-width=".8"/></svg>bigger circle, more retweets',
      '<svg width="20" height="15" aria-hidden="true"><circle cx="10" cy="7.5" r="5" fill="none" stroke="' +
        css("--red") + '" stroke-width="2"/></svg>coordinated accounts',
      '<svg width="20" height="15" aria-hidden="true"><circle cx="10" cy="7.5" r="5" fill="' + css("--paper") + '" stroke="' +
        css("--pen") + '" stroke-width="1.25"/><path d="M8 6h4v3h-1.5l-1.3 1V9H8z" fill="none" stroke="' +
        css("--pen") + '" stroke-width="1.1" stroke-linejoin="round"/></svg>collapsed response group; *sampled replies',
      // Drawn with the hull's own dash and opacity (see buildScene), so the
      // swatch is the mark on the board at a smaller size.
      '<svg width="20" height="15" aria-hidden="true"><rect x="1" y="2.5" width="18" height="11" rx="5" fill="' +
        css("--ink") + '" fill-opacity=".045" stroke="' + css("--ink-2") +
        '" stroke-opacity=".65" stroke-width="1.1" stroke-dasharray="1 4" stroke-linecap="round"/></svg>' +
        'pencilled ring, the subtree of the selected wording',
      // No swatch to draw for this one -- the asterisk *is* the mark, so it
      // takes the swatch gutter rather than sitting out of line with the rest.
      state.xMode === "tree"
        ? (f.win === "span" ? '<i class="key-star" aria-hidden="true">*</i>first seen after 1 Sep' : "")
        : '<svg width="20" height="15" aria-hidden="true"><line x1="1" y1="7.5" x2="19" y2="7.5" stroke="' +
          css("--red") + '" stroke-width="1.5" stroke-dasharray="3 2"/></svg>1 Sep collection cliff'
    ].filter(Boolean);

    $("#key").innerHTML =
      '<p class="key-ttl">' + ml[0] + "</p>" +
      '<p class="key-ramp">' + ml[1] + '<span class="wash">' + wash + "</span>" + ml[2] + "</p>" +
      '<ul class="key-marks">' +
        marks.map(function (m) { return "<li>" + m + "</li>"; }).join("") +
      "</ul>";
  }
  /* The three islands fold through one door. Each row is the state field the
     next lineage is rebuilt from, the button that carries the fold, and the
     words that finish "Expand ..." for a reader who is being told rather than
     shown. renderKey() only ever fills the key; the island keeps the fold. */
  var ISLES = {
    "isle-l": { at: "linOpen", tog: "lintog", what: "the lineage summary" },
    "isle-r": { at: "ctlOpen", tog: "ctltog", what: "the board controls" },
    "isle-k": { at: "keyOpen", tog: "keytog", what: "the key" }
  };
  function setIsle(id, open) {
    var m = ISLES[id], isle = document.getElementById(id);
    if (!m || !isle) return;
    state[m.at] = open;
    var b = document.getElementById(m.tog);
    if (b) {
      var say = (open ? "Minimize " : "Expand ") + m.what;
      b.setAttribute("aria-expanded", String(open));
      b.title = say;
      var vh = b.querySelector(".vh");
      if (vh) vh.textContent = say;
    }
    setFold(isle, open);
    // Whether the root post's clamp actually bit can only be measured once the
    // island is laid out, which it was not while the body was folded away.
    if (id === "isle-l" && open) initPost(isle);
  }

  // The lineage's audience, summarised. `shared` is the part that matters and
  // the part a per-lineage clustering could not produce: response templates
  // that also appear under other lineages. One template under one narrative
  // is a crowd reacting; the same template under several unrelated ones is a
  // repertoire being deployed.
  function famComments(f) {
    var c = f.cmt;
    if (!c) return "";
    var shared = (c.shared || []).filter(function (id) { return CLUSTERS[id]; });
    var line = stanceBar(c.st, c.tn);
    if (shared.length) {
      line += '<ul class="cmt-cl">' + shared.slice(0, 3).map(function (id) {
        var cl = CLUSTERS[id];
        return "<li>" + esc(detwit(String(cl.sample[0] || "")).slice(0, 120)) +
          '<span class="cmeta"><span class="spans">appears under ' + fmt(cl.nfam) +
          " lineages</span> \u00b7 " + fmt(cl.acc) + " accounts \u00b7 " +
          fmt(cl.n) + " comments</span></li>";
      }).join("") + "</ul>";
    }
    return line;
  }

  function renderStage() {
    var f = state.fam;

    var warn = f.win === "sep"
      ? '<p class="warn">Lives entirely after 1 September, where the crawl collects 1.4M tweets a day against August\'s 22.0M. Its spread is undercounted by roughly 15× next to an August lineage.</p>'
      : "";

    // A lineage switch tears down the board, and an interval still walking a
    // cut through the family it was started on would keep restyling nodes that
    // no longer exist.
    stopPlay();

    $("#stage-body").className = "";
    $("#stage-body").innerHTML =
      '<div class="draw">' +
        '<svg id="tree" class="tree" role="img" tabindex="0" aria-label="' + boardLabel() + '"></svg>' +
        '<p class="zoomlbl" id="zoomlbl"></p>' +
        '<div class="nav">' +
          '<button type="button" id="zin" title="Zoom in" aria-label="Zoom in">+</button>' +
          '<button type="button" id="zout" title="Zoom out" aria-label="Zoom out">−</button>' +
          '<button type="button" class="fit" id="zfit" title="Fit the whole lineage" ' +
            'aria-label="Fit the whole lineage">fit</button>' +
        "</div>" +

        /* ---- the island on the left: what this lineage is ----
           Folded down to its title when the board wants the room, and holding
           the earliest phrasing as the post it actually was rather than as a
           paragraph of quoted text. */
        '<aside class="isle isle-l lin" id="isle-l" data-open="' + state.linOpen +
          '" aria-label="About this lineage">' +
          isleTog("lintog", "lin-in", state.linOpen, "the lineage summary",
                  "<h2>Lineage " + f.id +
                  (f.name ? ' <span class="lin-name">' + esc(f.name) + "</span>" : "") + "</h2>") +
          '<div class="isle-in" id="lin-in">' +
            '<div class="lin-body">' +
            // the evidence, on the far left
            '<div class="lin-post">' +
              '<p class="isle-hd">earliest phrasing in the corpus</p>' +
              xpost(state.nodes[state.topo.root]) +
              // The lineage's durable words belong to the root post they
              // describe, rather than to the aggregate figures beside it.
              ((f.kw && f.kw.length)
                ? '<p class="lin-kw">' + f.kw.map(function (w) {
                    return '<span class="kw">' + esc(w) + "</span>";
                  }).join("") + "</p>"
                : "") +
            "</div>" +
            // and what the corpus says about it, alongside
            '<div class="lin-meta"><div class="hdr">' +
              '<p class="figs"><b>' + f.nv + "</b> wordings &middot; <b>" + f.depth + "</b> generations &middot; <b>" +
                fmt(f.emis) + "</b> retweets &middot; <b>" + fmt(f.acc) + "</b> accounts &middot; <b>" +
                Math.round(f.drift * 100) + "%</b> mean drift &middot; <b>" + Math.round(f.coord_share * 100) +
                "%</b> coordinated &middot; over <b>" + Math.round((f.t1 - f.t0) / 24) + "</b> days</p>" +
              famComments(f) +
            "</div>" + warn + "</div>" +
            "</div>" +
          "</div>" +
        "</aside>" +

        /* ---- the island on the right: what the drawing is doing ----
           Shade and layout are always live, because they change what is on the
           board; the timeline is not, because it is a second chart and it waits
           to be asked. */
        '<aside class="isle isle-r" id="isle-r" data-open="' + state.ctlOpen +
          '" aria-label="Board controls">' +
          isleTog("ctltog", "ctl-in", state.ctlOpen, "the board controls", "board") +
          '<div class="isle-in" id="ctl-in">' +
          '<div class="bar">' +
            '<span class="grp" id="colorby"><b>shade</b>' +
              btn("drift", "drift", state.colorBy) + btn("spread", "spread", state.colorBy) +
              btn("coord", "coordination", state.colorBy) + "</span>" +
            '<span class="grp" id="xmode"><b>layout</b>' +
              btn("tree", "tree", state.xMode) + btn("time", "time ↓", state.xMode) + "</span>" +
          "</div>" +
          '<div class="tl" id="tl" data-open="false">' +
            '<div class="tl-clip" id="tl-clip"><div class="tl-wrap"><div class="tl-in">' +
              '<svg id="pulse" class="pulse" role="img" aria-label="Retweets per hour for this lineage"></svg>' +
              '<input id="cut" type="range" min="' + f.t0 + '" max="' + f.t1 + '" value="' + f.t1 +
                '" aria-label="Show wordings first seen up to">' +
              '<output class="cutout" id="cutout"></output>' +
            "</div></div></div>" +
            '<p class="tl-row">' +
              '<button class="act" type="button" id="play" aria-expanded="false" ' +
                'aria-controls="tl-clip">&#9654; play</button>' +
              '<button class="act tl-x" type="button" id="tlhide" hidden>hide</button>' +
            "</p>" +
          "</div>" +
          "</div>" +
        "</aside>" +

        /* ---- the island in the bottom-left corner: how to read the board ----
           Filled by renderKey(), which runs again whenever the shade, the
           layout or the theme changes what the marks mean. */
        '<aside class="isle isle-k" id="isle-k" data-open="' + state.keyOpen + '" aria-label="Key">' +
          isleTog("keytog", "key", state.keyOpen, "the key", "key") +
          '<div class="isle-in key" id="key"></div>' +
        "</aside>" +
      "</div>" +
      renderDock();

    renderKey();
    replay($("#stage-body"), "swap");
    state.cut = f.t1;
    view = { k: 1, tx: 0, ty: 0, auto: true, note: "" };
    wireStage();
    initPost($("#isle-l"));
    relayout({ bloom: true });
    renderInspector();
  }
  function btn(v, label, cur) {
    return '<button data-v="' + v + '" aria-pressed="' + (v === cur) + '">' + label + "</button>";
  }
  // Every island's title is its fold control, and every one of them is this
  // button: the mark, the name, and the sentence a screen reader is read
  // instead of the mark. `what` completes "Expand ..." / "Minimize ...".
  function isleTog(id, controls, open, what, label) {
    return '<button class="isle-tog" type="button" id="' + id + '" aria-expanded="' + open +
      '" aria-controls="' + controls + '" title="' + (open ? "Minimize " : "Expand ") + what +
      '"><i class="pm" aria-hidden="true"></i>' + label +
      '<span class="vh">' + (open ? "Minimize " : "Expand ") + what + "</span></button>";
  }
  // Rebuild the rest positions and the elements that sit on them. `bloom`
  // means a different lineage, so the circles start over; a layout switch keeps
  // them where they are and lets the springs carry them to the new places,
  // which is also the clearest possible answer to what the switch changed.
  function relayout(opts) {
    opts = opts || {};
    if (!$("#tree")) return;
    sizeBoard();
    layout = buildLayout(state.nodes, state.xMode);
    initSim(!!opts.bloom);
    buildScene();
    restyle();
    if (opts.fit !== false) fitView();
    paint(); drawPulse(); updateCut();
    kick();
  }

  function updateCut() {
    var o = $("#cutout"); if (!o) return;
    var shown = state.nodes.filter(function (n) { return n.t0 <= state.cut; }).length;
    o.textContent = shown + "/" + state.nodes.length + " · " + dayLabel(state.cut);
  }

  function wireStage() {
    var svg = $("#tree"), tip = $("#tip");

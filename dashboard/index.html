<script>
(function () {
  "use strict";

  var RAMP = ["--w1","--w2","--w3","--w4","--w5"];
  var TOPIC_LABEL = {
    politics:"Politics", conflict:"Conflict", migration:"Migration", identity:"Identity",
    health:"Health", crypto:"Crypto", fandom:"Fandom", sports:"Sport"
  };
  var NEWS = { politics:1, conflict:1, migration:1, identity:1, health:1 };

  // Behaviour classes. Topic says what a lineage argues; this says how it
  // travelled, which is the axis that actually separates a propaganda
  // campaign from a concert promotion. Wording matters here: only "farm"
  // is a confident accusation, "burst" is a shortlist, and "promo" is a
  // description of a disclosed marketing pattern rather than a charge.
  var KIND_LABEL = {
    farm:"engagement farming", evade:"filter evasion", promo:"promo template",
    burst:"synchronised burst", organic:"no structural flag"
  };
  var KIND_SHORT = {
    farm:"farm", evade:"evasion", promo:"promo", burst:"burst", organic:""
  };
  var KIND_NOTE = {
    farm:"The payload is an instruction \u2014 follow, retweet, enter. Inauthentic " +
         "engagement, and openly so.",
    evade:"Words carrying cross-script lookalike characters, so the text reads " +
          "normally to a person and misses a keyword filter.",
    promo:"A conserved hashtag block with variable free text: scheduled marketing " +
          "and fan-campaign material. Coordinated by construction, but disclosed " +
          "and commercial \u2014 not covert.",
    burst:"Near-identical wordings from several different upstream accounts inside " +
          "a few hours. This is a shortlist to review, not a verdict: a newsroom " +
          "racing a scoop has the same shape as a press campaign.",
    organic:"No structural evidence of farming, evasion, templating or synchronised " +
            "release. Absence of evidence only."
  };

  var META = null, FAMS = [], BUCKETS = {}, CORPUS_T0 = 0;
  var state = { q:"", sort:"notable", topic:"all", kind:"all", win:"all", famId:null, fam:null, nodes:null,
                topo:null, colorBy:"drift", xMode:"time", cut:Infinity, sel:0, playing:false,
                tableOpen:false };
  // The board's camera. auto = it is still the fitted default, so a resize may
  // refit it; any pan or zoom clears the flag and the camera is left where the
  // reader put it. The zoom range is wide enough to be called free: the whole
  // corpus's widest lineage at one end, a single circle filling the window at
  // the other.
  var view = { k:1, tx:0, ty:0, auto:true, note:"" };
  var ZMIN = 0.02, ZMAX = 50;
  var layout = null, scene = null, boardRO = null, KEYNAV = false;

  var $ = function (s) { return document.querySelector(s); };
  var fmt = function (n) { return n.toLocaleString("en-US"); };
  var css = function (v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); };

  // Twitter stores tweet text with &, < and > already escaped, so a band
  // called &TEAM arrives as "&amp;TEAM". Undo that before escaping it again
  // for this page, or the card shows markup where the tweet showed a word.
  // &amp; goes last: doing it first would turn "&amp;lt;" into a real "<".
  function detwit(s) {
    return String(s)
      .replace(/&lt;/g, "<").replace(/&gt;/g, ">")
      .replace(/&quot;/g, '"').replace(/&#0*39;/g, "'").replace(/&apos;/g, "'")
      .replace(/&nbsp;/g, "\u00a0").replace(/&amp;/g, "&");
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  // A, B, ... Z, AA, AB -- spreadsheet-style, so a tree of any size gets short
  // labels that stay readable inside a node.
  function letter(k) {
    var out = "";
    for (k += 1; k > 0; k = Math.floor((k - 1) / 26)) {
      out = String.fromCharCode(65 + (k - 1) % 26) + out;
    }
    return out;
  }

  // A label set inside a filled mark takes white or ink by the fill's own
  // luminance, so it clears contrast at either end of the ramp and in both
  // themes -- the ramp inverts in dark mode, so a fixed choice would fail.
  function inkOn(hex) {
    var h = String(hex).replace("#", "");
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    if (h.length < 6) return css("--ink");
    var lin = function (c) {
      c = parseInt(c, 16) / 255;
      return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    };
    var lum = 0.2126 * lin(h.slice(0, 2)) + 0.7152 * lin(h.slice(2, 4)) + 0.0722 * lin(h.slice(4, 6));
    return lum > 0.19 ? "#1c1c1a" : "#ffffff";
  }

  // Parent/child structure and the node letters are properties of the lineage,
  // not of any one layout, so they are computed once per family and shared by
  // the diagram, the inspector and the table.
  function topology(nodes) {
    var kids = nodes.map(function () { return []; });
    var root = 0;
    nodes.forEach(function (nd, i) {
      if (nd.p === null || nd.p === undefined) root = i; else kids[nd.p].push(i);
    });
    kids.forEach(function (ks) {
      ks.sort(function (a, b) { return nodes[a].t0 - nodes[b].t0 || nodes[b].n - nodes[a].n; });
    });
    var label = new Array(nodes.length), order = [root];
    for (var i = 0; i < order.length; i++) {
      label[order[i]] = letter(i);
      kids[order[i]].forEach(function (k) { order.push(k); });
    }
    return { kids: kids, root: root, label: label, order: order };
  }

  // Hours are stored relative to the first tweet in the corpus so every family
  // shares one clock; this turns one back into a readable date.
  function hourLabel(h) {
    var d = new Date(CORPUS_T0 + h * 3600e3);
    return d.toLocaleString("en-US", { month:"short", day:"numeric", hour:"numeric", timeZone:"UTC" }) + " UTC";
  }
  function dayLabel(h) {
    var d = new Date(CORPUS_T0 + h * 3600e3);
    return d.toLocaleString("en-US", { month:"short", day:"numeric", timeZone:"UTC" });
  }

  function notability(f) {
    return f.depth * Math.log10(Math.max(10, f.emis)) * (1 + f.drift);
  }

  // Name the behaviour class and show the numbers that produced it, so the
  // call can be checked rather than taken. Nothing here is a verdict the
  // reader has to accept: the evidence is the point.
  function kindLine(f) {
    var bits = [];
    if (f.kind !== "organic") {
      bits.push("<b>" + KIND_LABEL[f.kind] + "</b> \u2014 " + esc(KIND_NOTE[f.kind]));
      if (f.why && f.why.length) bits.push("Evidence: " + f.why.map(esc).join("; ") + ".");
    } else {
      bits.push("<b>No structural flag.</b> " + esc(KIND_NOTE.organic));
    }
    if (f.offlang) {
      bits.push("Twitter tagged this lineage English and " +
                Math.round(f.nonlatin * 100) + "% of its text is not. " +
                "Tokenisation keeps only Latin characters, so this tree was built from " +
                "its hashtags rather than from a reworded sentence.");
    }
    return '<p class="why">' + bits.join(" ") + "</p>";
  }

  /* ---------------- family list ---------------- */

  function filtered() {
    var q = state.q.toLowerCase().trim();
    var out = FAMS.filter(function (f) {
      if (state.win !== "all" && f.win !== state.win) return false;
      if (state.topic === "news") { if (!f.topics.some(function (t) { return NEWS[t]; })) return false; }
      else if (state.topic !== "all") { if (f.topics.indexOf(state.topic) < 0) return false; }
      if (state.kind === "flagged") { if (f.kind === "organic") return false; }
      else if (state.kind === "offlang") { if (!f.offlang) return false; }
      else if (state.kind !== "all") { if (f.kind !== state.kind) return false; }
      if (!q) return true;
      return f.q.indexOf(q) >= 0 || f.top.toLowerCase().indexOf(q) >= 0 || f.root.toLowerCase().indexOf(q) >= 0;
    });
    var key = {
      notable: notability, emis: function (f) { return f.emis; }, nv: function (f) { return f.nv; },
      depth: function (f) { return f.depth * 1000 + Math.log10(f.emis); },
      drift: function (f) { return f.drift; }, coord: function (f) { return f.coord_share; },
      peak6: function (f) { return f.peak6; }
    }[state.sort];
    return out.sort(function (a, b) { return key(b) - key(a); });
  }

  function renderList() {
    var rows = filtered();
    $("#count").textContent = fmt(rows.length) + " lineages" + (state.q ? ' matching "' + state.q + '"' : "");
    var shown = rows.slice(0, 400);
    if (state.famId !== null && !shown.some(function (f) { return f.id === state.famId; })) {
      var cur = FAMS.find(function (f) { return f.id === state.famId; });
      if (cur) shown.unshift(cur);
    }
    var html = shown.map(function (f) {
      var tags = f.topics.map(function (t) { return TOPIC_LABEL[t].toLowerCase(); }).join(", ");
      var badge = KIND_SHORT[f.kind]
        ? '<span class="kind ' + f.kind + '">' + KIND_SHORT[f.kind] + "</span>" : "";
      if (f.offlang) badge += '<span class="kind offlang">non-English</span>';
      return '<button class="fam" data-id="' + f.id + '" aria-current="' + (f.id === state.famId) + '">' +
        '<span class="fam-txt">' + esc(detwit(f.top)) + "</span>" +
        '<span class="fam-meta">' + badge + f.nv + " wordings &middot; " + fmt(f.emis) + " retweets" +
        (tags ? " &middot; " + tags : "") + "</span></button>";
    }).join("");
    $("#list").innerHTML = html || '<p class="loading">Nothing matches that phrase.</p>';
    var cur = $('.fam[aria-current="true"]');
    if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "nearest" });
    if (rows.length > 400) {
      $("#list").insertAdjacentHTML("beforeend",
        '<p class="loading">Top 400 of ' + fmt(rows.length) + " \u2014 narrow it with the search or a topic.</p>");
    }
  }

  /* ---------------- where the wordings rest ----------------

     Two ways to place the same lineage, and they answer different questions.

       tree  -- the classic rooted tree. A wording hangs below the one it was
                derived from and a parent sits centred over its children.
                Structure is the subject: the branching factor, which wordings
                are siblings, how deep the lineage runs. Horizontal position
                carries no measure.
       time  -- a variant sits at the hour it was first observed, so the gap
                down an edge is the real waiting time before the rewording
                appeared. Structure is harder to read; timing is exact.

     Either way these are only *rest* positions. Nothing is drawn straight from
     them: they are where each circle is pulled towards, and the simulation
     underneath decides where it actually is right now. That keeps the board
     something you can take apart with your hands without ever losing the
     arrangement the measurements produced -- let go and it comes back. */

  function radii(nodes) {
    var maxN = Math.max.apply(null, nodes.map(function (n) { return n.n; }));
    var base = nodes.length > 120 ? 9.5 : nodes.length > 50 ? 11 : 12.5;
    return nodes.map(function (n) { return base + 8 * Math.sqrt(n.n / maxN); });
  }

  // Leaves take consecutive slots in sibling order and every parent is centred
  // over its children: the textbook tidy tree, and because sibling subtrees
  // occupy disjoint slot ranges it cannot collide with itself. It supplies the
  // stable left-to-right order for both layouts; relaxColumns may compact that
  // order but must never change it.
  function tidySlots(kids, root, n) {
    var slot = 0, pos = new Array(n).fill(0);
    (function walk(i) {
      if (!kids[i].length) { pos[i] = slot++; return; }
      kids[i].forEach(walk);
      pos[i] = (pos[kids[i][0]] + pos[kids[i][kids[i].length - 1]]) / 2;
    })(root);
    return pos;
  }

  // Tidy slots alone make a terrible wide tree. Every leaf gets an identical
  // column whether its circle is large or small, and then each parent is
  // centred over the whole span of its subtree -- so the root's three children
  // end up most of a screen apart, and the size of that gap is carrying no
  // information at all. It is the widest thing on the board and it means
  // nothing.
  //
  // So the columns get relaxed instead. The order from the tidy pass is fixed
  // and never revisited, which is the whole guarantee that subtrees cannot
  // cross; within that order the positions settle under three pressures --
  // parents pulled onto the middle of their children, children pulled in under
  // their parent, and circles that are genuinely too close opened up by the
  // radii they actually have. Across 60 lineages that halves the width and cuts
  // the span of the root's own children by 61%, while leaving parents closer to
  // the middle of their children than the tidy pass managed. A generation ends
  // up as wide as its contents need and no wider, so the horizontal distance
  // that is left means something: circles near each other are relatives.
  function relaxColumns(nodes, kids, root, r, slots) {
    var i, k;
    var maxR = Math.max.apply(null, r);
    var x = slots.map(function (c) { return c * (2 * maxR + 20); });

    var lev = [];
    nodes.forEach(function (nd, j) { (lev[nd.d] || (lev[nd.d] = [])).push(j); });
    lev.forEach(function (row) { row.sort(function (a, b) { return slots[a] - slots[b]; }); });

    // Parents before children, so one sweep of the array is one pass down the
    // tree and the reverse is one pass back up it.
    var bfs = [root];
    for (i = 0; i < bfs.length; i++) kids[bfs[i]].forEach(function (c) { bfs.push(c); });

    var N = 220;
    for (var it = 0; it < N; it++) {
      var pull = 0.10 + 0.05 * (1 - it / N);

      for (i = bfs.length - 1; i >= 0; i--) {
        var p = bfs[i], ks = kids[p];
        if (!ks.length) continue;
        var m = 0;
        for (k = 0; k < ks.length; k++) m += x[ks[k]];
        x[p] += (m / ks.length - x[p]) * 0.55;
      }

      for (i = 1; i < bfs.length; i++) {
        var c = bfs[i];
        x[c] += (x[nodes[c].p] - x[c]) * pull;
      }

      for (var d = 0; d < lev.length; d++) if (lev[d]) separate(lev[d], x, r);
    }
    return x;
  }

  // Open a level up until no two circles touch, moving them as little as
  // possible and as evenly as possible.
  //
  // The obvious version -- walk left to right shoving each circle clear of the
  // one before it -- only ever pushes right, so a level under pressure walks
  // off the side of the tree and has to be dragged back by its average. That
  // is what the first attempt at this did, and it is why a couple of loose
  // circles used to end up marooned hundreds of pixels to the left of their own
  // siblings: they were the only ones free to absorb the correction.
  //
  // Requiring x[k] - x[k-1] >= gap[k] is the same as requiring the running
  // total of the gaps, subtracted off, to come out non-decreasing -- so the
  // nearest arrangement that satisfies every gap at once is the isotonic
  // regression of that sequence, and pooling adjacent violators finds it in one
  // pass. Blocks that have to move do so around their own centre of mass, which
  // is exactly the even-handedness the left-to-right version lacked.
  var _pv = [], _pc = [];
  function separate(row, x, r) {
    var m = row.length, PAD = 15, i, g = 0, v, c, top = -1;
    if (m < 2) return;
    for (i = 0; i < m; i++) {
      if (i) g += r[row[i - 1]] + r[row[i]] + PAD;
      v = x[row[i]] - g; c = 1;
      while (top >= 0 && _pv[top] > v) {
        v = (_pv[top] * _pc[top] + v * c) / (_pc[top] + c);
        c += _pc[top]; top--;
      }
      _pv[++top] = v; _pc[top] = c;
    }
    g = 0; i = 0;
    for (var b = 0; b <= top; b++) {
      for (var q = 0; q < _pc[b]; q++, i++) {
        if (i) g += r[row[i - 1]] + r[row[i]] + PAD;
        x[row[i]] = _pv[b] + g;
      }
    }
  }

  // A spring's stiffness sets how fast it goes home; this sets how it gets
  // there. One damping ratio for every axis on the board means the firmly held
  // hour of the time layout and the loosely held column of the tree layout
  // both ease in with the same one soft overshoot, instead of one snapping and
  // the other wallowing. Just under 1 would ring; well over would crawl.
  var ZETA = 0.55;
  function damping(k) { return 1 - 2 * ZETA * Math.sqrt(k); }

  function buildLayout(nodes, mode) {
    var t = state.topo, r = radii(nodes);
    var slots = tidySlots(t.kids, t.root, nodes.length);
    var maxR = Math.max.apply(null, r);
    var maxD = Math.max.apply(null, nodes.map(function (n) { return n.d; }));
    var base = {
      r: r, maxD: maxD, kids: t.kids, root: t.root, label: t.label
    };

    if (mode === "tree") {
      var x = relaxColumns(nodes, t.kids, t.root, r, slots);
      var lo = Infinity, hi = -Infinity;
      x.forEach(function (v, i) { lo = Math.min(lo, v - r[i]); hi = Math.max(hi, v + r[i]); });
      // Now that the columns are only as wide as they need to be, a fixed row
      // height is the thing that makes a deep lineage tall and thin and a
      // shallow one flat -- and either way the fit shrinks the circles to
      // nothing. So the generations take their spacing from how wide the tree
      // actually came out, inside limits that keep a row reading as a row and
      // leave an edge long enough to see.
      var gen = Math.max(68, Math.min(150, (hi - lo) / Math.max(1, maxD) / 1.7));
      base.mode = "tree";
      base.x = x;
      base.y = nodes.map(function (n) { return n.d * gen; });
      base.ax = base.ay = 0.0075;
      base.dx = base.dy = damping(base.ax);
      return base;
    }

    var t0 = Math.min.apply(null, nodes.map(function (n) { return n.t0; }));
    var t1 = Math.max.apply(null, nodes.map(function (n) { return n.t0; }));
    // Time is intentionally linear here: the vertical distance between two
    // circles is their actual waiting time, not a generation index or a
    // logarithmic approximation. The board is a pan-and-zoom map, so a long
    // quiet interval gets the space it genuinely occupied.
    var span = Math.max(1, t1 - t0);
    var frac = function (h) { return Math.max(0, h - t0) / span; };
    base.mode = "time";
    base.t0 = t0; base.t1 = t1; base.frac = frac;
    base.H = Math.max(680, nodes.length * 15);
    // Keep related wordings near one another across the page. Unlike a fixed
    // leaf-slot grid this uses only the width the circles actually require,
    // so a large but shallow family does not explode into empty space.
    base.x = relaxColumns(nodes, t.kids, t.root, r, slots);
    base.y = nodes.map(function (n) { return frac(n.t0) * base.H; });
    // Vertical position is the measurement here, so a circle is held to its
    // observed hour far harder than to its horizontal family column.
    base.ax = 0.006; base.ay = 0.05;
    base.dx = damping(base.ax); base.dy = damping(base.ay);
    return base;
  }

  function metricOf(n) {
    if (state.colorBy === "drift") return n.drift;
    if (state.colorBy === "coord") return n.acc ? n.co / n.acc : 0;
    return Math.log10(Math.max(1, n.n)) / 4.6;     // spread, log-scaled to ~40k
  }
  function rampColor(v) {
    var i = Math.max(0, Math.min(RAMP.length - 1, Math.round(v * (RAMP.length - 1))));
    return css(RAMP[i]);
  }
  var METRIC_LABEL = {
    drift: ["drift from the root", "identical", "fully reworded"],
    coord: ["coordinated share", "none", "all accounts"],
    spread: ["spread, log scale", "1", "40k+"]
  };

  /* ---------------- the board as a physical thing ----------------

     Every circle is a mass on a spring anchored at its rest position, tied to
     its parent and its children by more springs, and solid enough not to sit
     on top of a neighbour. None of it moves the data: the anchors *are* the
     layout above, so any arrangement a reader pulls the tree into eases back
     to the one the measurements produced. Overlap repulsion only fires when
     two circles actually touch, so a settled tree keeps exactly the spacing
     the tidy layout gave it and the physics is invisible until you reach in. */

  var REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var sim = { p: [], links: [], held: -1 };
  var motion = { raf: 0, glide: null };

  function initSim(bloom) {
    var L = layout, nodes = state.nodes, n = nodes.length;
    var keep = !bloom && sim.p.length === n;
    var old = sim.p, p = new Array(n), i;
    for (i = 0; i < n; i++) {
      if (keep) { p[i] = old[i]; continue; }
      // A new lineage arrives folded up against its root and springs open, so
      // the first thing the board says about itself is that it is not a picture.
      var b = bloom && !REDUCE ? 0.55 : 1;
      p[i] = { x: L.x[L.root] + (L.x[i] - L.x[L.root]) * b,
               y: L.y[L.root] + (L.y[i] - L.y[L.root]) * b, vx: 0, vy: 0 };
    }
    sim.p = p; sim.held = -1; sim.links = [];
    nodes.forEach(function (nd, j) {
      if (nd.p === null || nd.p === undefined) return;
      var dx = L.x[j] - L.x[nd.p], dy = L.y[j] - L.y[nd.p];
      sim.links.push({ a: nd.p, b: j, len: Math.sqrt(dx * dx + dy * dy) || 1 });
    });
    if (REDUCE) settle();
  }

  function settle() {
    var L = layout;
    if (!L) return;
    sim.p.forEach(function (p, i) { p.x = L.x[i]; p.y = L.y[i]; p.vx = p.vy = 0; });
  }

  // One frame of the simulation. Returns whether anything is still moving, so
  // the loop can stop the moment the board is at rest rather than burn a core
  // redrawing a still picture.
  function stepSim() {
    var L = layout, P = sim.p, n = P.length, i, j;
    if (!L || !n || REDUCE) return false;
    var lk, a, b, dx, dy, d, d2, f;

    for (i = 0; i < sim.links.length; i++) {
      lk = sim.links[i]; a = P[lk.a]; b = P[lk.b];
      dx = b.x - a.x; dy = b.y - a.y;
      d = Math.sqrt(dx * dx + dy * dy) || 1e-6;
      f = (d - lk.len) / d * 0.035;
      if (lk.a !== sim.held) { a.vx += dx * f; a.vy += dy * f; }
      if (lk.b !== sim.held) { b.vx -= dx * f; b.vy -= dy * f; }
    }

    for (i = 0; i < n; i++) {
      for (j = i + 1; j < n; j++) {
        a = P[i]; b = P[j];
        dx = b.x - a.x; dy = b.y - a.y;
        var gap = L.r[i] + L.r[j] + 7;
        d2 = dx * dx + dy * dy;
        if (d2 >= gap * gap) continue;
        if (d2 < 1e-4) { dx = (i % 2 ? 1 : -1); dy = 1; d2 = 2; }
        d = Math.sqrt(d2);
        f = (gap - d) / d * 0.13;
        if (i !== sim.held) { a.vx -= dx * f; a.vy -= dy * f; }
        if (j !== sim.held) { b.vx += dx * f; b.vy += dy * f; }
      }
    }

    var moving = false;
    for (i = 0; i < n; i++) {
      var p = P[i];
      if (i === sim.held) { p.vx = p.vy = 0; moving = true; continue; }
      p.vx = (p.vx + (L.x[i] - p.x) * L.ax) * L.dx;
      p.vy = (p.vy + (L.y[i] - p.y) * L.ay) * L.dy;
      p.x += p.vx; p.y += p.vy;
      if (!moving && (Math.abs(p.vx) + Math.abs(p.vy) > 0.015 ||
                      Math.abs(L.x[i] - p.x) + Math.abs(L.y[i] - p.y) > 0.4)) moving = true;
    }
    // Nothing left to resolve: park every circle exactly on its rest position
    // so the board is pixel-identical to the one the layout describes.
    if (!moving) settle();
    return moving;
  }

  // Letting go of the board keeps the throw, the way letting go of a map does.
  function stepGlide() {
    var g = motion.glide;
    if (!g) return false;
    view.tx += g.vx; view.ty += g.vy;
    g.vx *= 0.945; g.vy *= 0.945;
    if (Math.abs(g.vx) + Math.abs(g.vy) < 0.15) { motion.glide = null; return false; }
    return true;
  }

  function kick() { if (!motion.raf) motion.raf = requestAnimationFrame(frame); }
  function frame() {
    motion.raf = 0;
    var busy = stepGlide();
    if (stepSim()) busy = true;
    paint();
    if (busy) kick();
  }

  /* ---------------- the camera ---------------- */

  function boardSize() {
    var svg = $("#tree");
    return svg ? { w: svg.clientWidth || 800, h: svg.clientHeight || 520 } : { w: 800, h: 520 };
  }
  function sizeBoard() {
    var d = $(".draw"), svg = $("#tree");
    if (!d || !svg) return;
    svg.setAttribute("width", Math.max(140, d.clientWidth));
    svg.setAttribute("height", Math.max(140, d.clientHeight));
  }

  // World extent of the resting arrangement, which is what "the whole lineage"
  // means -- fitting to wherever the circles have been dragged to would make
  // the fit button move the answer around.
  function worldBox() {
    var L = layout, x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    state.nodes.forEach(function (n, i) {
      x0 = Math.min(x0, L.x[i] - L.r[i]); x1 = Math.max(x1, L.x[i] + L.r[i]);
      y0 = Math.min(y0, L.y[i] - L.r[i]); y1 = Math.max(y1, L.y[i] + L.r[i]);
    });
    if (L.mode === "time") { x0 -= 92; y0 -= 28; } // room for time-axis labels
    else y0 -= 22;                              // room for the "root" caption
    return { x0: x0, y0: y0, x1: x1, y1: y1 };
  }

  // The widest lineage in the corpus is 226 wordings across a dozen
  // generations. Fitted to the window that is a field of specks, so opening a
  // lineage stops at a size the circles can still be read at and leaves the
  // rest to the pan -- but `fit` pressed on purpose really does fit, however
  // small that has to be. Only the automatic one is floored.
  function fitView(hard) {
    if (!layout || !scene) return;
    var b = worldBox(), s = boardSize(), pad = 30;
    var k = Math.min((s.w - pad * 2) / Math.max(1, b.x1 - b.x0),
                     (s.h - pad * 2) / Math.max(1, b.y1 - b.y0));
    var floor = hard ? ZMIN : 0.34;
    view.note = !hard && k < floor
      ? "part of a wide lineage \u2014 press fit to see all " + state.nodes.length : "";
    view.k = Math.max(floor, Math.min(1.6, k));
    view.tx = s.w / 2 - (b.x0 + b.x1) / 2 * view.k;
    view.ty = s.h / 2 - (b.y0 + b.y1) / 2 * view.k;
    view.auto = true;
    showZoom();
  }

  function zoomAt(px, py, f) {
    var k = Math.max(ZMIN, Math.min(ZMAX, view.k * f));
    if (k === view.k) return;
    view.tx = px - (px - view.tx) * (k / view.k);
    view.ty = py - (py - view.ty) * (k / view.k);
    view.k = k; view.auto = false; view.note = "";
    showZoom(); paint();
  }

  function centerOn(i) {
    var s = boardSize();
    view.k = Math.min(ZMAX, Math.max(view.k, 1.3));
    view.tx = s.w / 2 - sim.p[i].x * view.k;
    view.ty = s.h / 2 - sim.p[i].y * view.k;
    view.auto = false; view.note = "";
    showZoom(); paint();
  }

  // Where the camera is, said plainly. A map that can go from 2% to 5000% owes
  // the reader a number, or "zoomed out" and "lost" look identical.
  function showZoom() {
    var z = $("#zoomlbl"); if (!z) return;
    var pct = view.k * 100;
    z.textContent = (pct >= 10 ? Math.round(pct) : pct.toFixed(1)) + "%" +
      (view.note ? " \u00b7 " + view.note : "");
  }

  /* ---------------- the board, built once and then moved ----------------

     The circles are repositioned sixty times a second, so they are real
     elements that get a new transform rather than markup rebuilt from a string
     each frame. Colour, the coordination ring and the time cut-off change far
     more rarely and have their own pass. */

  function gridMarkup(L) {
    if (L.mode !== "time") return "";
    var b = worldBox(), x0 = b.x0 + 82, x1 = b.x1 + 14, out = [];
    var elapsed = L.t1 - L.t0, step = 1;
    // Aim for five or six labelled guides, then use a human-readable time
    // unit. The positions remain linear even when the labels use days/weeks.
    [1, 2, 4, 6, 12, 24, 48, 72, 120, 168, 336, 720, 1440, 2880].some(function (v) {
      step = v;
      return elapsed / v <= 6;
    });
    var ticks = [0];
    for (var o = step; o < elapsed; o += step) ticks.push(o);
    if (ticks[ticks.length - 1] !== elapsed) ticks.push(elapsed);
    ticks.forEach(function (o) {
      var gy = (L.frac(L.t0 + o) * L.H).toFixed(1);
      out.push('<line x1="' + x0.toFixed(1) + '" y1="' + gy + '" x2="' + x1.toFixed(1) + '" y2="' + gy +
        '" stroke="' + css("--hair") + '" stroke-width="1"/>');
      out.push('<text x="' + (x0 - 10).toFixed(1) + '" y="' + (+gy + 4).toFixed(1) + '" font-size="11" fill="' +
        css("--ink-2") + '" text-anchor="end">' + esc(dayLabel(L.t0 + o)) + "</text>");
    });
    // The crawl thins 15x on 1 September, so a lineage that appears to stop
    // there may only have gone unobserved. Draw the seam rather than hide it.
    if (META.cliff_h > L.t0 && META.cliff_h < L.t1) {
      var cy = L.frac(META.cliff_h) * L.H;
      out.push('<line x1="' + x0.toFixed(1) + '" y1="' + cy.toFixed(1) + '" x2="' + x1.toFixed(1) +
        '" y2="' + cy.toFixed(1) + '" stroke="' + css("--red") +
        '" stroke-width="1.5" stroke-dasharray="4 3"/>');
      out.push('<text x="' + (x1 - 2).toFixed(1) + '" y="' + (cy - 6).toFixed(1) +
        '" font-size="11" fill="' + css("--red") + '" text-anchor="end">1 Sep — crawl thins 15×</text>');
    }
    return out.join("");
  }

  function buildScene() {
    var svg = $("#tree"); if (!svg) return;
    var L = layout, nodes = state.nodes;
    var heavy = {};
    nodes.map(function (n, i) { return [n.n, i]; })
      .sort(function (a, b) { return b[0] - a[0]; }).slice(0, 4)
      .forEach(function (p) { heavy[p[1]] = fmt(nodes[p[1]].n); });

    var owner = [], edges = [], marks = [];
    nodes.forEach(function (n, i) {
      var r = L.r[i], fs = Math.min(11.5, Math.max(7, r * 0.82));
      if (!(n.p === null || n.p === undefined)) {
        owner.push(i);
        edges.push('<path fill="none" stroke="' + css("--ink-2") +
          '" stroke-width="1.3" stroke-linecap="round"/>');
      }
      marks.push('<g class="ndg" data-i="' + i + '">' +
        '<circle class="nd" r="' + r.toFixed(1) + '"/>' +
        '<text class="lb" y="' + (fs * 0.35).toFixed(1) + '" text-anchor="middle" font-size="' +
          fs.toFixed(1) + '" font-weight="600"></text>' +
        (i === L.root
          ? '<text class="cap" y="' + (-r - 10).toFixed(1) + '" text-anchor="middle" font-size="12" fill="' +
            css("--ink-2") + '">root</text>' : "") +
        (heavy[i]
          ? '<text class="cap" y="' + (r + 13).toFixed(1) + '" text-anchor="middle" font-size="9.5" fill="' +
            css("--ink-2") + '">' + heavy[i] + "</text>" : "") +
        (n.rsp && n.rsp.n
          ? '<g class="rsp" transform="translate(' + (r * .72).toFixed(1) + ',' + (-r * .72).toFixed(1) +
            ')" aria-label="' + fmt(n.rsp.n) + ' sampled responses"><title>' + fmt(n.rsp.n) +
            ' responses observed in this crawl</title><circle r="5.7"/><path d="M-2.4 -1.8h4.8v3.5h-2l-1.7 1.4V1.7h-1.1z"/></g>'
          : "") +
        "</g>");
    });

    svg.innerHTML =
      '<defs><pattern id="dotgrid" patternUnits="userSpaceOnUse" width="80" height="80">' +
        '<circle class="dot" cx="40" cy="40" r="1" fill="' + css("--rule") + '" opacity=".75"/>' +
      "</pattern></defs>" +
      // A canvas with no edges needs something to move against, or panning
      // reads as nothing happening. The dots are drawn in screen space and
      // re-tiled as the zoom changes, so they never grow into blobs.
      '<rect class="paper" x="0" y="0" width="100%" height="100%" fill="url(#dotgrid)"/>' +
      '<g class="world">' +
        '<g class="grid">' + gridMarkup(L) + "</g>" +
        '<path class="hull" fill="' + css("--ink") + '" fill-opacity=".045" stroke="' + css("--ink-2") +
          '" stroke-opacity=".65" stroke-width="1.1" stroke-dasharray="1 4" stroke-linecap="round" ' +
          'stroke-linejoin="round" pointer-events="none" d=""/>' +
        '<g class="edges">' + edges.join("") + "</g>" +
        '<circle class="pring" fill="none" stroke="' + css("--pen") + '" stroke-width="1.3" ' +
          'stroke-dasharray="3 3" opacity="0" pointer-events="none"/>' +
        '<circle class="sring" fill="none" stroke="' + css("--pen") + '" stroke-width="1.8" ' +
          'opacity="0" pointer-events="none"/>' +
        '<g class="nodes">' + marks.join("") + "</g>" +
      "</g>";

    var q = function (s) { return [].slice.call(svg.querySelectorAll(s)); };
    scene = {
      pat: svg.querySelector("#dotgrid"), dot: svg.querySelector(".dot"),
      world: svg.querySelector(".world"), hull: svg.querySelector(".hull"),
      edges: q(".edges > path"), owner: owner,
      g: q(".nodes > g"), circ: q(".nodes > g > circle"), lab: q(".nodes > g > text.lb"),
      sring: svg.querySelector(".sring"), pring: svg.querySelector(".pring")
    };
  }

  // No line drawn by hand lands perfectly straight. The deviation is seeded
  // from the node index, so a circle's edge keeps the same bow while it is
  // dragged instead of flickering between shapes.
  function bow(x1, y1, x2, y2, seed) {
    var dx = x2 - x1, dy = y2 - y1, len = Math.sqrt(dx * dx + dy * dy) || 1;
    var h = Math.sin(seed * 12.9898) * 43758.5453;
    var off = ((h - Math.floor(h)) - 0.5) * Math.min(6, len * 0.08);
    return "M" + x1.toFixed(1) + "," + y1.toFixed(1) +
      "Q" + ((x1 + x2) / 2 - dy / len * off).toFixed(1) + "," + ((y1 + y2) / 2 + dx / len * off).toFixed(1) +
      " " + x2.toFixed(1) + "," + y2.toFixed(1);
  }

  // The subtree of the selected wording: everything descended from it, which is
  // the population the lineage-total figure in the panel counts. The circles
  // move, so it is a hull recomputed with them rather than a fixed band.
  function hullPath() {
    var L = layout, P = sim.p, sel = state.sel;
    if (sel === L.root || !L.kids[sel] || !L.kids[sel].length) return "";
    var pts = [], stack = [sel];
    while (stack.length) {
      var i = stack.pop(), r = L.r[i] + 11;
      for (var a = 0; a < 10; a++) {
        pts.push([P[i].x + Math.cos(a * Math.PI / 5) * r, P[i].y + Math.sin(a * Math.PI / 5) * r]);
      }
      L.kids[i].forEach(function (k) { stack.push(k); });
    }
    var h = convexHull(pts);
    if (h.length < 3) return "";
    return "M" + h.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join("L") + "Z";
  }
  // Monotone chain: sort by x, then keep only the turns that go one way, twice.
  function convexHull(pts) {
    pts = pts.slice().sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; });
    var cross = function (o, a, b) {
      return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    };
    var lo = [], up = [], i;
    for (i = 0; i < pts.length; i++) {
      while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], pts[i]) <= 0) lo.pop();
      lo.push(pts[i]);
    }
    for (i = pts.length - 1; i >= 0; i--) {
      while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], pts[i]) <= 0) up.pop();
      up.push(pts[i]);
    }
    lo.pop(); up.pop();
    return lo.concat(up);
  }

  // Geometry only, once a frame.
  function paint() {
    var L = layout, S = scene, P = sim.p;
    if (!L || !S || !P.length) return;
    var i, n = P.length;

    S.world.setAttribute("transform", "translate(" + view.tx.toFixed(2) + "," + view.ty.toFixed(2) +
      ") scale(" + view.k.toFixed(5) + ")");

    // Re-tile the dot grid by zoom decade so the dots keep both their size and
    // a sane spacing however far in or out the reader goes.
    var step = 80;
    while (step * view.k < 46) step *= 2;
    while (step * view.k > 130) step /= 2;
    var sp = step * view.k;
    S.pat.setAttribute("width", sp.toFixed(3));
    S.pat.setAttribute("height", sp.toFixed(3));
    S.dot.setAttribute("cx", (sp / 2).toFixed(3));
    S.dot.setAttribute("cy", (sp / 2).toFixed(3));
    S.pat.setAttribute("patternTransform", "translate(" +
      ((view.tx % sp + sp) % sp).toFixed(2) + "," + ((view.ty % sp + sp) % sp).toFixed(2) + ")");

    for (i = 0; i < n; i++) {
      S.g[i].setAttribute("transform",
        "translate(" + P[i].x.toFixed(1) + "," + P[i].y.toFixed(1) + ")");
    }

    // Edges run rim to rim rather than centre to centre, so a line never
    // crosses a circle's own label.
    for (i = 0; i < S.edges.length; i++) {
      var c = S.owner[i], pj = state.nodes[c].p, A = P[pj], B = P[c];
      var dx = B.x - A.x, dy = B.y - A.y, len = Math.sqrt(dx * dx + dy * dy) || 1;
      S.edges[i].setAttribute("d", bow(
        A.x + dx / len * L.r[pj], A.y + dy / len * L.r[pj],
        B.x - dx / len * L.r[c], B.y - dy / len * L.r[c], c + 1));
    }

    var sel = state.sel, par = state.nodes[sel].p;
    S.sring.setAttribute("cx", P[sel].x.toFixed(1));
    S.sring.setAttribute("cy", P[sel].y.toFixed(1));
    if (!(par === null || par === undefined)) {
      S.pring.setAttribute("cx", P[par].x.toFixed(1));
      S.pring.setAttribute("cy", P[par].y.toFixed(1));
    }
    S.hull.setAttribute("d", hullPath());
  }

  // Everything that is about a wording rather than about where it currently is.
  function restyle() {
    var L = layout, S = scene, nodes = state.nodes;
    if (!L || !S) return;
    // Only mark the cliff per node where the distinction bites: inside a
    // lineage that straddles it. A wholly post-September family is flagged once
    // at the top instead of on every circle.
    var markCliff = state.fam.win === "span";
    nodes.forEach(function (n, i) {
      var fill = rampColor(metricOf(n));
      var coord = n.acc ? n.co / n.acc : 0;
      var c = S.circ[i];
      c.setAttribute("fill", fill);
      c.setAttribute("stroke", coord > 0.15 ? css("--red") : css("--paper"));
      c.setAttribute("stroke-width", coord > 0.15 ? 2.4 : 2);
      c.setAttribute("stroke-dasharray", n.leaf ? "3 2" : "");
      S.g[i].setAttribute("opacity", n.t0 > state.cut ? 0.12 : 1);
      S.lab[i].setAttribute("fill", inkOn(fill));
      S.lab[i].textContent = L.label[i] + (markCliff && n.t0 >= META.cliff_h ? "*" : "");
    });
    S.edges.forEach(function (p, i) {
      var c = S.owner[i];
      p.setAttribute("opacity",
        nodes[c].t0 > state.cut || nodes[nodes[c].p].t0 > state.cut ? 0.12 : 1);
    });
    var sel = state.sel, par = nodes[sel].p;
    S.sring.setAttribute("r", (L.r[sel] + 5).toFixed(1));
    S.sring.setAttribute("opacity", nodes[sel].t0 > state.cut ? 0.12 : 1);
    S.pring.setAttribute("opacity", par === null || par === undefined ? 0 : 0.85);
    if (!(par === null || par === undefined)) S.pring.setAttribute("r", (L.r[par] + 4.5).toFixed(1));
  }

  // Family emission curve: one series, so no legend -- the heading names it.
  function drawPulse() {
    var svg = $("#pulse"); if (!svg) return;
    var byHour = {};
    state.nodes.forEach(function (n) {
      (n.spark || []).forEach(function (p) { byHour[p[0]] = (byHour[p[0]] || 0) + p[1]; });
    });
    var hs = Object.keys(byHour).map(Number).sort(function (a, b) { return a - b; });
    if (!hs.length) { svg.innerHTML = ""; return; }
    var W = svg.clientWidth || 800, H = 56, pad = 26;
    var h0 = hs[0], h1 = hs[hs.length - 1], mx = Math.max.apply(null, hs.map(function (h) { return byHour[h]; }));
    var X = function (h) { return pad + (h1 > h0 ? (h - h0) / (h1 - h0) : 0) * (W - pad - 118); };
    var Y = function (v) { return H - 14 - (v / mx) * (H - 22); };
    var pts = [], area = ["M" + X(h0) + "," + (H - 14)];
    for (var h = h0; h <= h1; h++) {
      var v = byHour[h] || 0;
      pts.push(X(h) + "," + Y(v)); area.push("L" + X(h) + "," + Y(v));
    }
    area.push("L" + X(h1) + "," + (H - 14) + "Z");
    var cutX = state.cut === Infinity ? null : X(Math.min(state.cut, h1));
    var cliffX = (META.cliff_h > h0 && META.cliff_h < h1) ? X(META.cliff_h) : null;
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.innerHTML =
      '<path d="' + area.join("") + '" fill="' + css("--pen") + '" opacity=".16"/>' +
      '<polyline points="' + pts.join(" ") + '" fill="none" stroke="' + css("--pen") + '" stroke-width="2" stroke-linejoin="round"/>' +
      '<line x1="' + pad + '" y1="' + (H - 14) + '" x2="' + (W - 118) + '" y2="' + (H - 14) + '" stroke="' + css("--rule") + '" stroke-width="1"/>' +
      (cliffX !== null ? '<line x1="' + cliffX + '" y1="4" x2="' + cliffX + '" y2="' + (H - 14) + '" stroke="' + css("--red") + '" stroke-width="1.5" stroke-dasharray="4 3"/>' : "") +
      (cutX !== null ? '<line x1="' + cutX + '" y1="4" x2="' + cutX + '" y2="' + (H - 14) + '" stroke="' + css("--pen") + '" stroke-width="1.5"/>' : "") +
      '<text x="' + pad + '" y="' + (H - 3) + '" font-size="9.5" fill="' + css("--ink-2") + '">' + esc(dayLabel(h0)) + "</text>" +
      '<text x="' + (W - 118) + '" y="' + (H - 3) + '" font-size="9.5" fill="' + css("--ink-2") + '" text-anchor="end">' + esc(dayLabel(h1)) + "</text>" +
      '<text x="' + (W - 112) + '" y="14" font-size="10" fill="' + css("--ink-2") + '">peak ' + fmt(mx) + "/h</text>";
  }

  /* ---------------- the post, as X would draw it ----------------

     Generic equivalents of X's action icons, not their artwork: same
     vocabulary at the same weight, drawn here. */
  var XI = {
    reply: "M4.3 5.9A2.6 2.6 0 0 1 6.9 3.3h10.2a2.6 2.6 0 0 1 2.6 2.6v7.5a2.6 2.6 0 0 1-2.6 2.6h-4.6l-4.8 3.7v-3.7H6.9a2.6 2.6 0 0 1-2.6-2.6z",
    rt:    "M4.8 9.3V7.6a2.4 2.4 0 0 1 2.4-2.4h8.3M13.3 2.6 16.1 5.2l-2.8 2.6M19.2 14.7v1.7a2.4 2.4 0 0 1-2.4 2.4H8.5M10.7 21.4 7.9 18.8l2.8-2.6",
    like:  "M12 20.3S4.6 15.7 4.6 10.9A4.1 4.1 0 0 1 12 8.4a4.1 4.1 0 0 1 7.4 2.5c0 4.8-7.4 9.4-7.4 9.4z",
    views: "M4.4 20.2v-8.8M9.5 20.2V4.6M14.5 20.2v-6.1M19.6 20.2V8.2",
    save:  "M6.2 3.6h11.6v17.1L12 16.3l-5.8 4.4z",
    share: "M12 15.4V3.4M8.4 7 12 3.4 15.6 7M5 12.6v6.1a1.6 1.6 0 0 0 1.6 1.6h10.8a1.6 1.6 0 0 0 1.6-1.6v-6.1"
  };
  function xicon(k) {
    return '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" ' +
      'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="' + XI[k] + '"/></svg>';
  }

  // X's own compact counter: 942, 2.3K, 230K, 1.4M.
  function compact(v) {
    if (v < 1000) return String(v);
    var u = v < 1e6 ? [v / 1e3, "K"] : [v / 1e6, "M"];
    return (u[0] < 100 ? u[0].toFixed(1).replace(/\.0$/, "") : String(Math.round(u[0]))) + u[1];
  }

  // No avatars were collected, so the circle is a deterministic monogram
  // rather than a stand-in photograph of somebody.
  function avatar(handle) {
    var h = 0;
    for (var i = 0; i < handle.length; i++) h = (h * 31 + handle.charCodeAt(i)) >>> 0;
    return { bg: "hsl(" + (h % 360) + " 48% 44%)", ch: (handle[0] || "?").toUpperCase() };
  }

  // `mini` is the hover card: the whole text, no clamp, nothing to press.
  function xpost(nd, mini) {
    var who = String(nd.src || "").replace(/^@/, "");
    var av = avatar(who || "?");
    // X's own counters, as the platform reported them. A zero shows as a bare
    // icon the way X draws it, and a variant with no match to its original
    // shows bare icons throughout rather than a number we would have to guess.
    var m = nd.met;
    var act = function (k, v, label) {
      return '<span class="xact" title="' + (m ? fmt(v) + " " + label : "not recorded for this wording") +
        '">' + xicon(k) + (m && v ? "<span>" + compact(v) + "</span>" : "") + "</span>";
    };
    var acts =
      '<div class="xacts">' +
        act("reply", m && m.reply, "replies") +
        act("rt",    m && m.rt,    "retweets") +
        act("like",  m && m.like,  "likes") +
        act("views", m && m.views, "views") +
        '<span class="xact">' + xicon("save") + "</span>" +
        '<span class="xact">' + xicon("share") + "</span>" +
      "</div>";
    return '<article class="xpost" data-expanded="' + (mini ? "true" : "false") + '">' +
      '<span class="av" style="background:' + av.bg + '" aria-hidden="true">' + esc(av.ch) + "</span>" +
      '<div class="xcol">' +
        '<p class="xhead"><span class="xname">' +
          (who ? "@" + esc(who) : "account not recorded") + "</span>" +
          '<span class="xdate">&middot; ' + esc(dayLabel(nd.t0)) + "</span></p>" +
        '<p class="xtext">' + esc(detwit(nd.txt)) + "</p>" +
        (mini ? "" : '<button type="button" class="xmore" hidden>Show more</button>') +
        acts +
      "</div></article>";
  }

  // Whether the clamp actually bit can only be known once it is laid out, and
  // an offer to expand something already whole is worse than no offer.
  function initPost(root) {
    var post = root.querySelector(".xpost"), txt = root.querySelector(".xtext"),
        more = root.querySelector(".xmore");
    if (!post || !txt || !more) return;
    more.hidden = txt.scrollHeight - txt.clientHeight < 2;
  }
  function togglePost(post) {
    var open = post.dataset.expanded === "true";
    post.dataset.expanded = open ? "false" : "true";
    post.querySelector(".xmore").textContent = open ? "Show more" : "Show less";
  }

  /* ---------------- inspector ---------------- */

  function renderInspector() {
    var n = state.nodes[state.sel]; if (!n) return;
    var el = $("#inspector"); if (!el) return;
    var T = state.topo;
    var isRoot = n.p === null || n.p === undefined;
    var coord = n.acc ? n.co / n.acc : 0;
    var add = (n.add || []).map(function (t) { return '<span class="tok add">+' + esc(t) + "</span>"; }).join("");
    var del = (n["del"] || []).map(function (t) { return '<span class="tok del">' + esc(t) + "</span>"; }).join("");

    var mutation = isRoot
      ? '<p class="mut"><span class="lbl">earliest phrasing in the corpus &mdash; the root of this lineage</span></p>'
      : '<p class="mut"><span class="lbl">changed from ' + T.label[n.p] + "</span>" + add + del +
        (add || del ? "" : '<span class="tok">wording only</span>') +
        '<span class="lbl">' + Math.round(n.sim * 100) + "% of the words kept</span>" +
        (n.leaf ? '<span class="lbl">lower-confidence attached leaf; it cannot join lineages</span>' : "") +
        "</p>";

    // Every relation the diagram draws is a word you can click.
    var kids = T.kids[state.sel];
    var sibs = isRoot ? [] : T.kids[n.p].filter(function (k) { return k !== state.sel; });
    var more = function (rest) { return rest > 0 ? '<button disabled>+' + rest + " more</button>" : ""; };
    var rels = '<p class="rels"><span class="lbl">relations</span>' +
      (isRoot ? "<button disabled>root</button>" : relChip("parent", n.p)) +
      (kids.length
        ? kids.slice(0, 8).map(function (k) { return relChip("child", k); }).join("") + more(kids.length - 8)
        : "<button disabled>no children, a dead end</button>") +
      sibs.slice(0, 6).map(function (k) { return relChip("sibling", k); }).join("") + more(sibs.length - 6) +
      "</p>";

    // Only the flags that are actually raised. An unlit warning is noise.
    var fl = [];
    // Two different things used to be reported as one number. A lookalike
    // character sitting inside an otherwise Latin word is evasion and very
    // little else; a wholly styled headline is typography. Only the first
    // is worth raising.
    if (n.mix > 0) {
      fl.push(n.mix + " word" + (n.mix > 1 ? "s" : "") +
              " mix scripts \u2014 a lookalike character inside a Latin word, which " +
              "reads normally and misses a keyword filter");
    } else if (n.obf > 3) {
      fl.push(n.obf + " styled characters (math-bold and similar) \u2014 defeats a naive " +
              "keyword match, but reads as decoration here");
    }
    if (coord > 0.15) fl.push("coordinated accounts present");

    var rsp = n.rsp;
    var replyExcerpts = rsp && rsp.sample && rsp.sample.length
      ? '<details class="reply-excerpts"><summary>read ' + rsp.sample.length +
        ' captured response' + (rsp.sample.length === 1 ? "" : "s") + '</summary>' +
        rsp.sample.map(function (reply) {
          return '<blockquote><p>' + esc(detwit(reply.txt)) + '</p><span>' +
            (reply.direct ? 'direct reply' : 'reply in this thread') +
            (reply.like ? ' &middot; ' + fmt(reply.like) + ' likes when captured' : '') +
            '</span></blockquote>';
        }).join("") + '</details>'
      : '';
    var responses = rsp
      ? '<p class="figs"><b>' + fmt(rsp.n) + '</b> response' + (rsp.n === 1 ? "" : "s") +
        ' observed in this crawl &middot; <b>' + fmt(rsp.acc) + '</b> responding accounts' +
        (rsp.thread ? ' &middot; <b>' + fmt(rsp.direct) + '</b> direct to this tweet, plus thread replies' :
                      ' &middot; all direct to this tweet') +
        (n.met && n.met.reply
          ? ' &middot; X reports <b>' + fmt(n.met.reply) + '</b> total replies; observed responses are a sampled subset'
          : ' &middot; response coverage is limited to tweets captured in this crawl') +
        '</p>' + replyExcerpts
      : (n.met && n.met.reply
          ? '<p class="figs">X reports <b>' + fmt(n.met.reply) +
            '</b> replies, but none of their rows were captured for this matched tweet.</p>'
          : '');

    el.innerHTML =
      "<h3>Wording " + T.label[state.sel] + "</h3><span>generation " + n.d +
        " &middot; first seen " + esc(hourLabel(n.t0)) + "</span>" +
      xpost(n) + mutation + rels +
      '<p class="figs"><b>' + fmt(n.n) + "</b> retweets seen in this crawl &middot; <b>" + fmt(n.acc) + "</b> accounts &middot; <b>" +
        fmt(n.sub) + "</b> counting everything descended from it &middot; <b>" + Math.round(n.drift * 100) +
        "%</b> drift &middot; <b>" + Math.round(coord * 100) + "%</b> coordinated" +
        (n.src ? " &middot; amplifies @" + esc(n.src) : "") + "</p>" +
      responses +
      (fl.length
        ? '<p class="flags' + (n.mix > 0 ? "" : " mild") + '">' + fl.join(" &middot; ") + "</p>"
        : "");
    initPost(el);
  }
  function relChip(kind, i) {
    return "<button data-i=\"" + i + '">' + kind + " " + state.topo.label[i] + "</button>";
  }

  /* ---------------- table twin ---------------- */

  // Colour and area are the diagram's encodings; this is the same lineage as
  // numbers, so nothing on the page is readable only as a colour.
  function renderTable() {
    var T = state.topo, nodes = state.nodes;
    var rows = T.order.map(function (i) {
      var n = nodes[i];
      return '<tr data-i="' + i + '" aria-current="' + (i === state.sel) + '">' +
        '<td class="k">' + T.label[i] + "</td><td>" + n.d + "</td><td>" +
        (n.p === null || n.p === undefined ? "\u2014" : T.label[n.p]) + "</td><td>" +
        fmt(n.n) + "</td><td>" + fmt(n.acc) + "</td><td>" + fmt(n.rsp && n.rsp.n || 0) + "</td><td>" +
        (n.acc ? Math.round(n.co / n.acc * 100) : 0) + "%</td><td>" +
        Math.round(n.drift * 100) + "%</td><td>" + esc(hourLabel(n.t0)) + "</td>" +
        '<td class="txt"><span>' + esc(detwit(n.txt)) + "</span></td></tr>";
    }).join("");
    return '<details class="tbl" id="tabledetails"' + (state.tableOpen ? " open" : "") +
      "><summary>the same lineage as numbers \u2014 all " + nodes.length + " wordings</summary>" +
      '<div class="tscroll"><table id="vartable">' +
      "<thead><tr><th>node</th><th>generation</th><th>from</th><th>retweets</th><th>accounts</th><th>responses*</th>" +
      "<th>coord.</th><th>drift</th><th>first seen</th><th>text</th></tr></thead><tbody>" +
      rows + "</tbody></table></div></details>";
  }
  function syncTable() {
    var t = $("#vartable"); if (!t) return;
    Array.prototype.forEach.call(t.querySelectorAll("tr[data-i]"), function (tr) {
      tr.setAttribute("aria-current", String(+tr.dataset.i === state.sel));
    });
  }
  function openPanel()  { setPanel(true); }
  function closePanel() { setPanel(false); }
  function setPanel(on) {
    var p = $("#panel");
    p.classList.toggle("on", on);
    p.setAttribute("aria-hidden", String(!on));
    $("#sheet").dataset.panel = on ? "open" : "closed";
  }
  // `open` is passed by everything a person can click or key. Switching family
  // selects the root silently, which should not throw a panel over the board.
  function selectNode(i, open) {
    state.sel = i; restyle(); paint(); renderInspector(); syncTable();
    if (open) openPanel();
  }

  /* ---------------- stage ---------------- */

  function boardLabel() {
    return state.xMode === "tree"
      ? "Mutation tree as a rooted tree, one generation per row. Drag to pan, scroll to zoom, " +
        "drag a circle to pull it off its spring. Arrow keys move to the parent, a child or a sibling."
      : "Mutation tree with time running from top to bottom. Drag to pan, scroll to zoom, drag a circle to pull it off " +
        "its spring. Arrow keys move to the parent, a child or a sibling.";
  }

  function renderKey() {
    var f = state.fam, ml = METRIC_LABEL[state.colorBy];
    var wash = RAMP.map(function (v) { return '<i style="background:' + css(v) + '"></i>'; }).join("");
    $("#key").innerHTML =
      "<span>" + ml[1] + '<span class="wash">' + wash + "</span>" + ml[2] + " &mdash; " + ml[0] + "</span>" +
      "<span>bigger circle, more retweets</span>" +
      '<span><svg width="15" height="15" aria-hidden="true"><circle cx="7.5" cy="7.5" r="5" fill="none" stroke="' +
        css("--red") + '" stroke-width="2"/></svg>coordinated accounts</span>' +
      '<span><svg width="15" height="15" aria-hidden="true"><circle cx="7.5" cy="7.5" r="5" fill="white" stroke="' +
        css("--pen") + '" stroke-width="1.25"/><path d="M5.5 6h4v3H8l-1.3 1V9H5.5z" fill="none" stroke="' +
        css("--pen") + '" stroke-width="1.1" stroke-linejoin="round"/></svg>collapsed response group; *sampled replies</span>' +
      "<span>pencilled ring, the subtree of the selected wording</span>" +
      (state.xMode === "tree"
        ? (f.win === "span" ? "<span>* first seen after 1 Sep</span>" : "")
        : '<span><svg width="15" height="10" aria-hidden="true"><line x1="0" y1="5" x2="15" y2="5" stroke="' +
          css("--red") + '" stroke-width="1.5" stroke-dasharray="3 2"/></svg>1 Sep collection cliff</span>');
  }

  function renderStage() {
    var f = state.fam;

    var warn = f.win === "sep"
      ? '<p class="warn">Lives entirely after 1 September, where the crawl collects 1.4M tweets a day against August\'s 22.0M. Its spread is undercounted by roughly 15× next to an August lineage.</p>'
      : "";

    $("#stage-body").className = "";
    $("#stage-body").innerHTML =
      '<div class="lin"><div class="hdr">' +
        "<h2>Lineage " + f.id + "</h2>" +
        '<p class="figs"><b>' + f.nv + "</b> wordings &middot; <b>" + f.depth + "</b> generations &middot; <b>" +
          fmt(f.emis) + "</b> retweets &middot; <b>" + fmt(f.acc) + "</b> accounts &middot; <b>" +
          Math.round(f.drift * 100) + "%</b> mean drift &middot; <b>" + Math.round(f.coord_share * 100) +
          "%</b> coordinated &middot; over <b>" + Math.round((f.t1 - f.t0) / 24) + "</b> days</p>" +
        kindLine(f) + "</div>" +
        '<p class="root">' + esc(detwit(f.root)) + "</p>" +
        warn +
      "</div>" +
      '<div class="bar">' +
        '<span class="grp" id="colorby"><b>shade</b>' +
          btn("drift", "drift", state.colorBy) + btn("spread", "spread", state.colorBy) +
          btn("coord", "coordination", state.colorBy) + "</span>" +
        '<span class="grp" id="xmode"><b>layout</b>' +
          btn("tree", "tree", state.xMode) + btn("time", "time ↓", state.xMode) + "</span>" +
        '<span class="scrub"><button class="act" id="play">play</button>' +
          '<input id="cut" type="range" min="' + f.t0 + '" max="' + f.t1 + '" value="' + f.t1 +
          '" aria-label="Show wordings first seen up to"><output id="cutout"></output></span>' +
        '<button class="act" id="reset">fit the board</button>' +
      "</div>" +
      '<div class="plot"><svg id="pulse" class="pulse" role="img" aria-label="Retweets per hour for this lineage"></svg></div>' +
      '<div class="draw">' +
        '<svg id="tree" class="tree" role="img" tabindex="0" aria-label="' + boardLabel() + '"></svg>' +
        '<p class="zoomlbl" id="zoomlbl"></p>' +
        '<div class="nav">' +
          '<button type="button" id="zin" title="Zoom in" aria-label="Zoom in">+</button>' +
          '<button type="button" id="zout" title="Zoom out" aria-label="Zoom out">−</button>' +
          '<button type="button" class="fit" id="zfit" title="Fit the whole lineage" ' +
            'aria-label="Fit the whole lineage">fit</button>' +
        "</div>" +
      "</div>" +
      '<div class="key" id="key"></div>' +
      renderTable();

    renderKey();
    state.cut = f.t1;
    view = { k: 1, tx: 0, ty: 0, auto: true, note: "" };
    wireStage();
    relayout({ bloom: true });
    renderInspector();
  }
  function btn(v, label, cur) {
    return '<button data-v="' + v + '" aria-pressed="' + (v === cur) + '">' + label + "</button>";
  }
  // Rebuild the rest positions and the elements that sit on them. `bloom`
  // means a different lineage, so the circles start over; a layout switch keeps
  // them where they are and lets the springs carry them to the new places,
  // which is also the clearest possible answer to what the switch changed.
  function relayout(opts) {
    opts = opts || {};
    if (!$("#tree")) return;
    sizeBoard();
    layout = buildLayout(state.nodes, state.xMode);
    initSim(!!opts.bloom);
    buildScene();
    restyle();
    if (opts.fit !== false) fitView();
    paint(); drawPulse(); updateCut();
    kick();
  }

  function updateCut() {
    var o = $("#cutout"); if (!o) return;
    var shown = state.nodes.filter(function (n) { return n.t0 <= state.cut; }).length;
    o.textContent = shown + "/" + state.nodes.length + " · " + dayLabel(state.cut);
  }

  function wireStage() {
    var svg = $("#tree"), tip = $("#tip");

    /* ---- the board is a map ----
       Drag the paper to pan, drag a circle to pull it off its spring, scroll
       or pinch to zoom about the pointer, double-click to zoom in. There is no
       bottom or top to the zoom worth speaking of and no edge to the canvas:
       the arrangement is a place you move around in rather than a picture that
       gets refitted whenever you touch it. */
    var pointers = {}, pan = null, grab = null, pinch = null, hover = -1;

    function local(e) {
      var r = svg.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }
    function toWorld(px, py) {
      return { x: (px - view.tx) / view.k, y: (py - view.ty) / view.k };
    }
    function nodeUnder(e) {
      var t = e.target;
      return t && t.closest ? t.closest(".ndg") : null;
    }
    function hideTip() { tip.classList.remove("on"); hover = -1; }
    function showTip(i, e) {
      if (i !== hover) {
        var n = state.nodes[i];
        tip.innerHTML = xpost(n, true) +
          '<div class="m">generation ' + n.d + " &middot; " + Math.round(n.drift * 100) +
          "% drift &middot; first seen " + esc(hourLabel(n.t0)) + "</div>";
        hover = i;
      }
      tip.classList.add("on");
      var w = tip.offsetWidth, h = tip.offsetHeight;
      tip.style.left = Math.min(e.clientX + 14, innerWidth - w - 10) + "px";
      tip.style.top = Math.max(8, e.clientY - h - 12) + "px";
    }

    svg.addEventListener("pointerdown", function (e) {
      try { svg.setPointerCapture(e.pointerId); } catch (err) {}
      pointers[e.pointerId] = local(e);
      motion.glide = null;

      if (Object.keys(pointers).length === 2) {
        var id = Object.keys(pointers), a = pointers[id[0]], b = pointers[id[1]];
        pinch = { d: Math.hypot(b.x - a.x, b.y - a.y) || 1 };
        if (grab) { sim.held = -1; grab = null; svg.classList.remove("holding"); }
        pan = null; svg.classList.remove("panning");
        hideTip();
        return;
      }

      var p = pointers[e.pointerId], g = nodeUnder(e);
      if (g) {
        var i = +g.dataset.i, w = toWorld(p.x, p.y);
        grab = { i: i, sx: p.x, sy: p.y, dx: sim.p[i].x - w.x, dy: sim.p[i].y - w.y,
                 vx: 0, vy: 0, moved: false };
        sim.held = i;
        svg.classList.add("holding");
        kick();
      } else {
        pan = { x: p.x, y: p.y, tx: view.tx, ty: view.ty, vx: 0, vy: 0, moved: false };
        svg.classList.add("panning");
      }
    });

    svg.addEventListener("pointermove", function (e) {
      var p = local(e);
      if (pointers[e.pointerId]) pointers[e.pointerId] = p;

      if (pinch) {
        var id = Object.keys(pointers);
        if (id.length >= 2) {
          var a = pointers[id[0]], b = pointers[id[1]];
          var d = Math.hypot(b.x - a.x, b.y - a.y) || 1;
          zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, d / pinch.d);
          pinch.d = d;
        }
        return;
      }

      if (grab) {
        // A few pixels of hand tremor is a pick, not a drag.
        if (!grab.moved) {
          if (Math.abs(p.x - grab.sx) + Math.abs(p.y - grab.sy) < 4) return;
          grab.moved = true;
          hideTip();
        }
        var w = toWorld(p.x, p.y), q = sim.p[grab.i];
        var nx = w.x + grab.dx, ny = w.y + grab.dy;
        grab.vx = nx - q.x; grab.vy = ny - q.y;
        q.x = nx; q.y = ny;
        kick();
        return;
      }

      if (pan) {
        if (!pan.moved) {
          if (Math.abs(p.x - pan.x) + Math.abs(p.y - pan.y) < 4) return;
          pan.moved = true;
          hideTip();
        }
        var tx = pan.tx + (p.x - pan.x), ty = pan.ty + (p.y - pan.y);
        pan.vx = tx - view.tx; pan.vy = ty - view.ty;
        view.tx = tx; view.ty = ty; view.auto = false;
        paint();
        return;
      }

      var g = nodeUnder(e);
      if (g) showTip(+g.dataset.i, e); else hideTip();
    });

    function letGo(e) {
      delete pointers[e.pointerId];
      try { svg.releasePointerCapture(e.pointerId); } catch (err) {}
      if (Object.keys(pointers).length < 2) pinch = null;

      if (grab) {
        var gr = grab; grab = null; sim.held = -1;
        svg.classList.remove("holding");
        // Let go and the circle keeps the speed it was thrown with; the spring
        // takes it home from wherever that lands it.
        var q = sim.p[gr.i];
        q.vx = Math.max(-26, Math.min(26, gr.vx));
        q.vy = Math.max(-26, Math.min(26, gr.vy));
        if (REDUCE) settle();
        if (!gr.moved) selectNode(gr.i, true);
        kick();
      }
      if (pan) {
        var pv = pan; pan = null;
        svg.classList.remove("panning");
        if (pv.moved && Math.abs(pv.vx) + Math.abs(pv.vy) > 1.5 && !REDUCE) {
          motion.glide = { vx: pv.vx, vy: pv.vy };
          kick();
        }
      }
    }
    svg.addEventListener("pointerup", letGo);
    svg.addEventListener("pointercancel", letGo);
    svg.addEventListener("pointerleave", function () { hideTip(); });
    svg.addEventListener("focus", function () { svg.classList.toggle("kb", KEYNAV); });
    svg.addEventListener("blur", function () { svg.classList.remove("kb"); });

    svg.addEventListener("wheel", function (e) {
      e.preventDefault();
      var p = local(e);
      // A trackpad pinch arrives as a ctrl-wheel and a wheel notch as a coarse
      // one; both zoom, at the resolution the gesture actually has.
      var d = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1);
      zoomAt(p.x, p.y, Math.exp(-d * (e.ctrlKey ? 0.012 : 0.0024)));
    }, { passive: false });

    svg.addEventListener("dblclick", function (e) {
      var g = nodeUnder(e);
      if (g) { centerOn(+g.dataset.i); return; }
      var p = local(e);
      zoomAt(p.x, p.y, 1.8);
    });

    // A tree is navigated by its relations, so give the keyboard the same four
    // moves the diagram draws, plus the map's own three.
    svg.addEventListener("keydown", function (e) {
      var T = state.topo, n = state.nodes[state.sel], go;
      var hasParent = !(n.p === null || n.p === undefined);
      var s = boardSize();
      if (e.key === "+" || e.key === "=") { zoomAt(s.w / 2, s.h / 2, 1.45); e.preventDefault(); return; }
      if (e.key === "-" || e.key === "_") { zoomAt(s.w / 2, s.h / 2, 1 / 1.45); e.preventDefault(); return; }
      if (e.key === "0") { fitView(true); paint(); e.preventDefault(); return; }
      svg.classList.add("kb");
      if (e.key === "ArrowUp") go = hasParent ? n.p : undefined;
      else if (e.key === "ArrowDown") go = T.kids[state.sel][0];
      else if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
        var sibs = hasParent ? T.kids[n.p] : [T.root];
        go = sibs[sibs.indexOf(state.sel) + (e.key === "ArrowRight" ? 1 : -1)];
      } else if (e.key === "Home") go = T.root;
      else return;
      e.preventDefault();
      if (go !== undefined) selectNode(go, true);
    });

    $("#zin").addEventListener("click", function () {
      var b = boardSize(); zoomAt(b.w / 2, b.h / 2, 1.45);
    });
    $("#zout").addEventListener("click", function () {
      var b = boardSize(); zoomAt(b.w / 2, b.h / 2, 1 / 1.45);
    });
    $("#zfit").addEventListener("click", function () { fitView(true); paint(); });
    $("#reset").addEventListener("click", function () { fitView(true); paint(); });

    // The board is a window, so it has to learn its own size rather than be
    // told: the rail folding, the panel sliding and the table opening all
    // change it without a window resize firing.
    if (boardRO) boardRO.disconnect();
    if (window.ResizeObserver) {
      boardRO = new ResizeObserver(function () {
        sizeBoard();
        if (view.auto) fitView();
        paint();
      });
      boardRO.observe($(".draw"));
    }

    var table = $("#vartable");
    if (table) table.addEventListener("click", function (e) {
      var tr = e.target.closest("tr[data-i]"); if (tr) selectNode(+tr.dataset.i, true);
    });
    var details = $("#tabledetails");
    if (details) details.addEventListener("toggle", function () { state.tableOpen = details.open; });

    $("#colorby").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-v]"); if (!b || b.dataset.v === state.colorBy) return;
      state.colorBy = b.dataset.v;
      press(b);
      restyle(); renderKey();
    });
    $("#xmode").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-v]"); if (!b || b.dataset.v === state.xMode) return;
      state.xMode = b.dataset.v;
      press(b);
      renderKey();
      svg.setAttribute("aria-label", boardLabel());
      relayout();
    });
    $("#cut").addEventListener("input", function (e) {
      state.cut = +e.target.value; restyle(); drawPulse(); updateCut();
    });
    $("#play").addEventListener("click", play);
  }

  // Shading and layout are each one live choice out of a row of words.
  function press(b) {
    Array.prototype.forEach.call(b.parentNode.querySelectorAll("button[data-v]"), function (x) {
      x.setAttribute("aria-pressed", String(x === b));
    });
  }
  // Wired once, against elements that no render replaces.
  function wireOnce() {
    // Which ring the board shows when it takes focus depends on how the focus
    // arrived, and only the page as a whole can tell.
    addEventListener("keydown", function (e) { if (e.key === "Tab") KEYNAV = true; }, true);
    addEventListener("pointerdown", function () { KEYNAV = false; }, true);

    // The relation chips are the diagram's edges as words, so they navigate it.
    $("#inspector").addEventListener("click", function (e) {
      var m = e.target.closest(".xmore");
      if (m) { togglePost(m.closest(".xpost")); return; }
      var b = e.target.closest("button[data-i]"); if (b) selectNode(+b.dataset.i, true);
    });
    $("#panelx").addEventListener("click", closePanel);
    addEventListener("keydown", function (e) {
      if (e.key === "Escape") closePanel();
    });

    $("#topics-sum").addEventListener("click", function () { toggleFilt("filt-topics"); });
    $("#kinds-sum").addEventListener("click", function () { toggleFilt("filt-kinds"); });

    var fold = $("#fold"), sheet = $("#sheet");
    fold.addEventListener("click", function () {
      var open = sheet.dataset.rail !== "closed";
      sheet.dataset.rail = open ? "closed" : "open";
      fold.setAttribute("aria-expanded", String(!open));
      fold.title = open ? "Show the lineage list" : "Hide the lineage list";
      $("#foldtext").textContent = fold.title;
    });

    addEventListener("resize", debounce(function () {
      sizeBoard();
      if (view.auto) fitView();
      paint(); drawPulse();
    }, 160));
  }

  function play() {
    if (state.playing) return;
    var f = state.fam, slider = $("#cut"), btn = $("#play");
    var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) { state.cut = f.t1; slider.value = f.t1; restyle(); drawPulse(); updateCut(); return; }
    state.playing = true; btn.textContent = "■ Playing";
    var h = f.t0, step = Math.max(1, Math.round((f.t1 - f.t0) / 90));
    var timer = setInterval(function () {
      h += step;
      if (h >= f.t1) { h = f.t1; clearInterval(timer); state.playing = false; btn.innerHTML = "&#9654; Play"; }
      state.cut = h; slider.value = h; restyle(); drawPulse(); updateCut();
    }, 45);
  }

  function debounce(fn, ms) {
    var t; return function () { clearTimeout(t); t = setTimeout(fn, ms); };
  }

  /* ---------------- loading ---------------- */

  function selectFamily(id) {
    state.famId = id;
    state.fam = FAMS.find(function (f) { return f.id === id; });
    renderList();
    var b = id % META.buckets;
    var go = function (bucket) {
      state.nodes = bucket[String(id)].nodes;
      state.topo = topology(state.nodes);
      state.sel = state.topo.root;
      renderStage();
    };
    if (BUCKETS[b]) { go(BUCKETS[b]); return; }
    $("#stage-body").className = "loading";
    $("#stage-body").textContent = "Loading lineage " + id + "…";
    fetch("phylo/trees-" + String(b).padStart(2, "0") + ".json")
      .then(function (r) { return r.json(); })
      .then(function (j) { BUCKETS[b] = j; go(j); })
      .catch(function () {
        $("#stage-body").textContent = "Could not load that lineage. Try another from the list.";
      });
  }

  function chipStyle(i) { return ' style="--i:' + i + '"'; }

  function filtPickedText(group) {
    var pressed = group.querySelector('button[aria-pressed="true"]');
    return pressed ? pressed.textContent.replace(/\s+/g, " ").trim() : "";
  }

  function syncFiltPicks() {
    $("#topics-pick").textContent = filtPickedText($("#topics")) || "all subjects";
    $("#kinds-pick").textContent = filtPickedText($("#kinds")) || "any behaviour";
  }

  function setFiltOpen(id, open) {
    var el = $("#" + id);
    el.dataset.open = String(open);
    el.querySelector(".filt-sum").setAttribute("aria-expanded", String(open));
  }

  // One drawer at a time: opening subjects closes behaviour, and the reverse.
  // Clicking the open drawer again folds it, so the rail only shows the pick.
  function toggleFilt(id) {
    var opening = $("#" + id).dataset.open !== "true";
    setFiltOpen("filt-topics", opening && id === "filt-topics");
    setFiltOpen("filt-kinds", opening && id === "filt-kinds");
  }

  function renderTopics() {
    var counts = {};
    FAMS.forEach(function (f) { f.topics.forEach(function (t) { counts[t] = (counts[t] || 0) + 1; }); });
    var i = 0;
    var chips = ['<button data-t="all"' + chipStyle(i++) + ' aria-pressed="' + String(state.topic === "all") + '">all subjects</button>',
                 '<button data-t="news"' + chipStyle(i++) + ' aria-pressed="' + String(state.topic === "news") + '">news &amp; politics</button>'];
    Object.keys(TOPIC_LABEL).filter(function (t) { return counts[t]; }).forEach(function (t) {
      chips.push('<button data-t="' + t + '"' + chipStyle(i++) + ' aria-pressed="' + String(state.topic === t) + '">' +
                 TOPIC_LABEL[t].toLowerCase() + ' <i>(' + counts[t] + ")</i></button>");
    });
    $("#topics").innerHTML = chips.join("");
    syncFiltPicks();
  }

  // The behaviour row. Classes with nothing in them are still listed, greyed
  // and disabled, because "we looked for filter evasion and found none" is a
  // result and hiding the chip would quietly turn it into a question never
  // asked.
  function renderKinds() {
    var counts = {}, off = 0, flagged = 0;
    FAMS.forEach(function (f) {
      counts[f.kind] = (counts[f.kind] || 0) + 1;
      if (f.offlang) off++;
      if (f.kind !== "organic") flagged++;
    });
    var i = 0;
    var chips = ['<button data-k="all"' + chipStyle(i++) + ' aria-pressed="' + String(state.kind === "all") + '">any behaviour</button>',
                 '<button data-k="flagged"' + chipStyle(i++) + ' aria-pressed="' + String(state.kind === "flagged") + '">any flag <i>(' + flagged + ")</i></button>"];
    ["farm", "evade", "burst", "promo", "organic"].forEach(function (k) {
      var n = counts[k] || 0;
      chips.push('<button data-k="' + k + '"' + chipStyle(i++) + ' aria-pressed="' + String(state.kind === k) + '" title="' + esc(KIND_NOTE[k]) + '"' +
                 (n ? "" : " disabled") + ">" + KIND_LABEL[k] + " <i>(" + n + ")</i></button>");
    });
    if (off) {
      chips.push('<button data-k="offlang"' + chipStyle(i++) + ' aria-pressed="' + String(state.kind === "offlang") + '" title="' +
                 'Twitter tagged these English. Their text is not, so the lineage was built ' +
                 'from Latin-script hashtags alone.">non-English <i>(' + off + ")</i></button>");
    }
    $("#kinds").innerHTML = chips.join("");
    syncFiltPicks();
  }

  fetch("phylo/index.json").then(function (r) { return r.json(); }).then(function (data) {
    META = data.meta; FAMS = data.families; CORPUS_T0 = Date.parse(META.t0);

    var flagged = FAMS.filter(function (f) { return f.kind !== "organic"; }).length;
    $("#corpus").innerHTML =
      "<b>" + fmt(META.n_families) + "</b> lineages &middot; <b>" + fmt(META.n_variants) +
      "</b> distinct wordings &middot; <b>" + fmt(META.n_emissions) + "</b> retweets traced &middot; " +
      "<b>" + fmt(flagged) + "</b> carrying a behaviour flag &middot; Aug 17 \u2013 Sep 17, 2026";

    renderTopics();
    renderKinds();
    renderList();
    wireOnce();

    // Open on a prose narrative rather than a promotional template: both are
    // real lineages, but the hashtag-block campaigns dominate the corpus by
    // volume and would give a misleading first impression of what the method
    // finds. Now that promo is classified rather than guessed at by hashtag
    // count, exclude it by class, and exclude the lineages whose text is not
    // actually English.
    var pick = FAMS.filter(function (f) {
      return f.kind !== "promo" && !f.offlang && f.win === "aug" &&
             f.topics.some(function (t) { return NEWS[t]; });
    }).sort(function (a, b) { return notability(b) - notability(a); })[0] || FAMS[0];
    selectFamily(pick.id);

    $("#list").addEventListener("click", function (e) {
      var b = e.target.closest(".fam"); if (b) selectFamily(+b.dataset.id);
    });
    $("#q").addEventListener("input", debounce(function () {
      state.q = $("#q").value; renderList();
    }, 180));
    $("#sort").addEventListener("change", function (e) { state.sort = e.target.value; renderList(); });
    $("#augonly").addEventListener("change", function (e) {
      state.win = e.target.checked ? "aug" : "all"; renderList();
    });
    $("#topics").addEventListener("click", function (e) {
      var c = e.target.closest("button[data-t]"); if (!c) return;
      state.topic = c.dataset.t;
      Array.prototype.forEach.call($("#topics").children, function (x) {
        x.setAttribute("aria-pressed", String(x === c));
      });
      syncFiltPicks();
      setFiltOpen("filt-topics", false);
      renderList();
    });
    $("#kinds").addEventListener("click", function (e) {
      var c = e.target.closest("button[data-k]"); if (!c || c.disabled) return;
      state.kind = c.dataset.k;
      Array.prototype.forEach.call($("#kinds").children, function (x) {
        x.setAttribute("aria-pressed", String(x === c));
      });
      syncFiltPicks();
      setFiltOpen("filt-kinds", false);
      renderList();
    });
  }).catch(function () {
    $("#stage-body").textContent = "Could not load the lineage index.";
  });
})();
</script>
